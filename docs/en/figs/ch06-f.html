// Every figure page, migrated or not: plate panels at 1:1 on a phone, and plate corners that flow instead of overlapping.
const PANCSS=`

// Row labels. A <text data-rowlabel> that is a direct child of a panel svg keeps its left edge inside the pan box while the pan scrolls (<= 600 px).
// It sits on a plate-coloured chip, and follow() keeps the cursor clear of the chips (scroll-padding-left). data-rowlabel="head" marks a heading with nothing under it: no chip, no clearance.

      r.style.transform=tr; r.style.display=d?"":"none"; r.setAttribute("x",b.x-2); r.setAttribute("y",b.y-2); r.setAttribute("width",b.width+4); r.setAttribute("height",b.height+4); clear=Math.max(clear,(b.width+2)/k); });

}

    const panels=[...plate.querySelectorAll("svg[viewBox]")].filter(s=>!s.parentElement.closest("svg")).map(s=>{ const w=document.createElement("div"); w.className="fig-pan"; s.before(w); w.append(s); s.style.setProperty("--vbw",s.viewBox.baseVal.width+"px"); pin(w,s); return w; });

const D={"L":{"fig":"Figure 6-7","title":"Multi-Token GEMM qkv_gate from g0 to g5: Eight Measured Versions (g3 Unused) Across Four Token Counts, Full-Graph Replay Latency","page.title":"Figure 6-7 Multi-Token GEMM qkv_gate from g0 to g5: Eight Measured Versions (g3 Unused) Across Four Token Counts, Full-Graph Replay Latency","aria.fig":"Figure 6-7: Hardware evolution and measured latency of multi-token GEMM qkv_gate from g0 to g5 across four token counts","aria.alg":"Evolution chain: eight measured versions from g0 to g5 plus unused g3 placeholder, colored by hardware level","aria.focus":"Step callout: summary of changes and measured outcome in this version","aria.chart":"Measured full-graph replay latency of this step vs. previous measured version and g0 baseline across four token counts T","aria.parts":"Six hardware mechanism cards for one qkv_gate pass; clear cards tagged 'changed' mark components modified in this step","readout.g0":"g0 (T = 8 | 32 | 128 | 256): 18.20 | 18.60 | 21.32 | 22.90 µs\nvs. g0: cuBLAS baseline (each incl. 4.96 µs empty-graph overhead)","readout.g3":"g3 (Level 4): no corresponding version on this chain (unbuilt, unmeasured)\nLatency & delta vs. g0: no measured values","readout.l1":"{id} (T = 8 | 32 | 128 | 256): {v} µs","readout.l2":"vs. g0: {d} µs","strip.hd":"qkv_gate: Y[T, 2304] = X[T, 8192] · Wᵀ · Click or Tab to any version chip to jump (x-axis shows version order only, not to latency scale)","part.tag.changed":"· changed","chip.g0.nm":"cuBLAS","chip.g0.lv":"Baseline","chip.g1a.nm":"1 kernel","chip.g1a.lv":"Lv 1, 5","chip.g1.nm":"Grid+ring","chip.g1.lv":"Lv 2, 3","chip.g2.nm":"Reg cap","chip.g2.lv":"Level 3","chip.g3.nm":"(none)","chip.g3.lv":"Lv 4 skip","chip.g4a.nm":"T=32 wave","chip.g4a.lv":"Lv 2, 3","chip.g4b.nm":"TMA red.","chip.g4b.lv":"Lv 5, 6","chip.g4.nm":"Widen BN","chip.g4.lv":"Lv 2, 5","chip.g5.nm":"C12+C++","chip.g5.lv":"Level 6","focus.g0.l1":"g0 baseline: T≤128 main + reduce (2 launches)","focus.g0.l2":"T=256 1 kernel; eduction kernel reads back and sums partial sums after main kernel exits\nT = 256: single kernel writes Y directly","part.g1a.launch":"All T fused into 1 kernel launch per GEMM (separate reduction kernel removed)","part.g1a.grid":"T = 8: 76 KiB, T = 32: 88 KiB SMEM ⇒ at most 2 CTAs/SM\n288 CTAs ≈ 1.1 waves (264 + 24; actual residency unmeasured)\nT = 128 / 256: 36 × 2 = 72 CTAs, 60 SMs idle","part.g1a.move":"T = 8 / 32: X and W stage through a cp.async 3-slot SMEM ring (76 / 88 KiB, commit_group / wait_group batch waits)\nT = 128 / 256: X and W stage via Triton multi-stage TMA pipeline (4 / 5 stages)","part.g1a.mma":"T = 8 / 32: swap-AB SS wgmma m64n16k16 / m64n32k16 (bundled with 1 launch, not measured separately)\nT = 128: also swap-AB (W 64 rows on M side, X 128 rows on N side; Triton wgmma shape unrecorded)\nT = 256: no swap, X on M side (BN = 64; wgmma shape unrecorded)","part.g1a.reduce":"Each CTA writes FP32 partial sum and runs acq_rel atomic fetch_add\nLast-arriving CTA waits on nobody, reads back & sums all S splits; other CTAs exit at once\nT=32 sums 8 splits (64 KiB); T=128/256 reads 64/128 KiB (60 idle SMs & readback not split)","part.g1.grid":"T = 128 / 256: Split-K 2 → 3, expanded to 108 CTAs (1 wave, idle SMs 60 → 24)\nT = 8 (76 KiB), T = 32 (88 KiB): still 288 CTAs","part.g1.move":"T ≥ 128: 1 dedicated TMA producer warp + mbarrier ring (8 slots 192 KiB / 5 slots 200 KiB ⇒ 1 CTA/SM) + 128 B XOR swizzle\nPer K-step order: producer waits empty[s] → expect_tx (expected bytes) + TMA into s → full[s] flips → consumers wgmma → return empty[s] (T ≤ 32 still cp.async 3-slot ring)\nT = 256 still trails cuBLAS; cause unmeasured","part.g1.mma":"T = 128: 1 consumer warpgroup (4 warps) flips operands from g1a swap-AB back to X on M side (Gluon SS wgmma m64n64k16; operand roles match T = 256)\nT = 256: 2 consumer warpgroups (8 warps), SS wgmma m64n64k16\nT = 8 / 32: still swap-AB m64n16k16 / m64n32k16 (four edits not measured separately)","part.g1.reduce":"T = 128 / 256: all 3 split CTAs claim a ticket and acquire-spin on the counter until all 3 tickets arrive (requires all 3 CTAs co-resident)\nEach reads & sums 1/3 rows across 3 partials, average 32 / 64 KiB/CTA (halving g1a's 64 / 128 KiB)\nT = 8 / 32: still last-arriver readback over 8 splits","part.g2.move":"T = 128 / 256 source requests capping 1 TMA producer warpgroup at 24 regs/thread\nFreed registers stay inside the CTA for consumer warpgroups (launch CTA register total unchanged)\nCompiled warp padding & SASS setmaxnreg.dec 24 unrecorded; all 4 T in 0.35 µs noise, rejected, cause unmeasured","part.g4a.grid":"T = 32: Split-K 8 → 3, 288 → 108 CTAs (1 wave, removes 24-CTA tail wave)\nT = 128 / 256: 108 CTAs (1 wave); T = 8: still 288 CTAs","part.g4a.move":"T = 32: replaces cp.async 3-slot ring with 1 TMA producer warp + 9-slot mbarrier ring (216 KiB SMEM ⇒ 1 CTA/SM; remaining bottleneck unprofiled)\nT = 128 / 256: reverts g2's 24-reg cap back to g1; T = 8: still cp.async 3-slot ring","part.g4a.reduce":"T = 32: replaces 8-split last arriver with all 3 split CTAs claiming tickets and acquire-spinning on the counter (requires 3 CTAs co-resident)\nEach sums 1/3 slice, average 8 KiB/CTA (3 T = 32 edits bundled, not measured separately)\nT ≥ 128: same as g1; T = 8: still last-arriver readback","part.g4b.move":"T = 128 / 256 (8×24 / 5×40 KiB rings): Slice-0 producer waits until consumers return empty[s]\nempty[s] follows Slice-0 consumers' zero-stores to Y (requires Slice-0 K-steps > slots), ordering Y = 0 first\nProducer issues red.release outside load loop (outside async region), avoiding Sec. 6's ptxas serialization hint (DEPBAR drains)","part.g4b.reduce":"T = 128 / 256: Slice-0 consumers first write zeros into output tile Y\nAfter atomic_add(..., acquire) on flag + cross-proxy fence, each slice stages via stmatrix & issues 1 async TMA tile reduction adding into Y\nT=32 still slice reduce; L2 err 1.6e-3→2.7e-3 (pre-rounding inference, sole cause unverified); T=256 lag unmeasured","part.g4.grid":"T = 256: Split-K 3 → 7, grid expands to 18 × 7 = 126 CTAs (idle SMs 24 → 6)\nT = 32 / 128: still 108 CTAs; T = 8: still 288 CTAs","part.g4.move":"T = 256: SMEM ring changes from 5 × 40 KiB (200 KiB) to 4 × 48 KiB (192 KiB)\nSplit-0 producer still releases flag outside async region after empty[s] returns (T = 128 stays 8 × 24 KiB as in g4b)","part.g4.mma":"T = 256: widens BN 64 → 128 (SS wgmma m64n128k16)\nBytes/slot grow +20% (40 → 48 KiB) while Tensor Core MMA work/slot doubles (512 → 1,024 cycles)\nBundled with 126 CTAs, not measured separately; T = 256 err 3.65e-3 cause unchecked; T ≤ 128 unchanged","part.g5.grid":"T = 256: Split-K 7 → 5, 120 CTAs in a single wave (12 SMs idle)\nT = 8: 96 CTAs; T = 32 / 128: 108 CTAs","part.g5.weight":"T = 8 / 32: 12-bit C12 main table 28.31 MB (+ 0.07 MB side table, −25% bytes; bundled with C++, not split)\nT ≥ 128: kept in BF16 37.75 MB; data in card-wide shared HBM, stack mapping not specified","part.g5.move":"Custom TMA descriptors & barrier phases: T=8 5-slot TMA ring; T=32 10-slot C12 ring + reg decode; T=256 back to 5×40 KiB ring\nT = 32 / 128: producer warp releases readiness flag after its load loop\nT = 256: producer returns after loads; split-0 consumer thread 0 releases flag after wait_group 0 & barrier (outside async region), and split 0 runs 23/128 K-steps (others 26–27) so its loop finishes early","part.g5.mma":"Custom CUDA C++ / inline PTX: T = 8 24 rows/CTA full-K mma.sync m16n8k16 + 4 side-table outlier-correction warps (Sec. 2)\nT = 32: 2 alternating consumer warpgroups RS (A in regs) wgmma m64n32k16 + wait_group 0; T = 128: SS (A, B in SMEM) wgmma m64n64k16\nT = 256: BM = 128 × BN = 192 SS wgmma m64n192k16 (retiling & C++ rewrite not measured separately)","part.g5.reduce":"T = 8: no Split-K, writes Y directly (S = 1)\nT = 32 / 128 (S = 3) & T = 256 (Split-K 7 → 5): all slices wait on flag via C++ ld.acquire.gpu + cross-proxy fence, then stage via stmatrix & issue TMA tile reduction","grid.g0.tag":"cuBLAS internal grid not drawn separately","grid.g1a.tag":"Shown T = 128/256: 72 dark busy · 60 light idle (positions schematic)","grid.g1.tag":"Shown T=128/256: 108 dark busy · 24 light idle (1 wave, schematic)","grid.g3.tag":"No corresponding version on chain (unmeasured)","grid.g4a.tag":"Shown T=32..256: 108 dark busy · 24 light idle (1 wave, schematic)","grid.g4.tag":"Shown T = 256: 126 dark busy · 6 light idle\n(schematic; T = 32/128 stay 108)","grid.g5.tag":"Shown T = 256: 120 dark busy · 12 light idle\n(1 wave, schematic; T = 8: 96, T = 32/128: 108)","card.g0.f":"$Y = X W^\\top = \\sum_{i=1}^{S} P_i$ (at $T \\le 128$, splits $K = 8192$ to sum partial sums; at $T = 256$, a single kernel computes $Y$ directly).","card.g0.i":"$\\shape{X}{T,\\ 8192}{BF16}$; $\\shape{W}{2304,\\ 8192}{BF16}$ (37.75 MB in card-wide shared HBM; which stack holds which bytes is not specified).","card.g0.o":"$T = 8 / 32 / 128$ run the cuBLAS main GEMM kernel (writing workspace $P_i$) then a separate Split-K reduction kernel (summing into $Y$ after all main CTAs exit) in one CUDA stream; $T = 256$ writes $Y$ directly in 1 kernel.","card.g0.x":"At $T \\le 128$, the 2nd kernel launch and global workspace round-trip are handed to g1a to fold into the main kernel epilogue.","card.g0.c":"Measured 18.20 | 18.60 | 21.32 | 22.90 µs (mean of 4 run medians, reading 512 MiB beforehand to flush L2; each includes ~4.96 µs of empty-graph replay overhead).","card.g1a.f":"Still computes $Y = \\sum_{i=1}^{S} P_i$; after writing its FP32 partial sum, each CTA executes an acq_rel atomic fetch_add — the last-arriving CTA waits on nobody and reads back & sums all $S$ splits alone, while every other CTA exits at once.","card.g1a.i":"$X, W$ as in g0 ($X$ stays BF16 across all versions and stages alongside $W$). $T = 8 / 32$: swap-AB ($W$ 64 rows on $M$ side, SS wgmma m64n16k16 / m64n32k16) + cp.async commit_group / wait_group 3-slot ring, Split-K = 8, 36 × 8 = 288 CTAs (source SMEM: 76 KiB at $T = 8$, 88 KiB at $T = 32$, both $\\Rightarrow$ up to 2 CTAs/SM, ~1.1 waves = 264 + 24; actual residency unmeasured); $T = 128$ Triton kernel also uses swap-AB ($W$ 64 rows on $M$ side, $X$ 128 rows on $N$ side; Triton wgmma shape unrecorded, 36 × 2 = 72 TMA CTAs). Separately at $T = 256$: no swap — Triton kernel puts $X$ on the $M$ side (BN = 64, shape unrecorded, also 36 × 2 = 72 TMA CTAs).","card.g1a.o":"All $T$ write $Y$ in 1 kernel launch, eliminating the separate reduction kernel.","card.g1a.x":"At $T = 128 / 256$, 72 CTAs leave 60 SMs idle (idle SMs lower full-chip HBM throughput only when total bytes in flight fall below saturation; Ch. 2, Sec. 3), and 36 last-arriving CTAs serially read back 64 KiB ($T = 128$) or 128 KiB ($T = 256$) of FP32 partials per tile (relative shares unmeasured). Handed to g1.","card.g1a.c":"vs. g0: −2.39 | −0.68 | +0.25 (noise) | +10.50 µs ($T = 256$ rises to 33.39 µs, 46% slower than single-kernel cuBLAS; $T = 8 / 32$ combines 1 fewer launch and swap-AB shape, not measured separately).","card.g1.f":"At $T = 128 / 256$, Split-K = 3 ($Y = P_1 + P_2 + P_3$); all 3 split CTAs claim a ticket and spin-wait on the counter with acquire until all 3 tickets arrive (requiring all 3 CTAs co-resident), then each CTA sums its own 1/3 of the rows in parallel.","card.g1.i":"$T = 128$ switches to a Gluon kernel (tile $128 \\times 64$, 1 consumer warpgroup = 4 warps, flipping operands from g1a's swap-AB back to $X$ on the $M$ side, SS wgmma m64n64k16; operand roles match $T = 256$), $T = 256$ tile $256 \\times 64$ (2 consumer warpgroups = 8 warps, SS wgmma m64n64k16); $T = 8 / 32$ code same as g1a (still 8-split last-arriver readback).","card.g1.o":"Grid expands to $1 \\times 36 \\times 3 = 108$ CTAs (idle SMs cut from 60 to 24, 1 wave); on-chip move switches to 1 dedicated TMA producer warp + mbarrier ring (8 slots = 192 KiB at $T = 128$, 5 slots = 200 KiB at $T = 256$) + 128 B XOR swizzle, ordered per K-step as: producer waits empty[s] $\\to$ expect_tx (expected bytes) + TMA into $s$ $\\to$ full[s] flips $\\to$ consumers wgmma $\\to$ return empty[s]; each CTA reads 1/3 of rows across all 3 partials, averaging 32 KiB ($T = 128$) or 64 KiB ($T = 256$) per CTA — halving g1a's 64 / 128 KiB single-CTA readback and sharing it across 3 CTAs.","card.g1.x":"Grid expansion, TMA ring, $T = 128$ operand flip, and parallel slice reduction changed together in one version, not measured separately. $T = 128$ (18.84 µs) beats cuBLAS for the first time; $T = 256$ (25.46 µs) still trails cuBLAS, cause unmeasured (note: scalar BF16 atomic adds directly to output are 2.1–3.0× slower on the 12-bit kernel due to shared 32-bit word CAS retries). Handed to g2 for the register controlled test.","card.g1.c":"vs. g1a: +0.13 (noise) | +0.02 (noise) | −2.73 | −7.94 µs.","card.g2.f":"Computation and reduction same as g1; only adds gl.warp_specialize(..., [1], [24]) in source at $T = 128 / 256$.","card.g2.i":"Same as g1.","card.g2.o":"Requests capping the warpgroup holding the 1 TMA producer warp (warp 4 at $T = 128$, warp 8 at $T = 256$, plus pad warps if Gluon pads) at 24 registers/thread so freed registers go to consumer warpgroups inside the same CTA (total CTA registers never exceed launch allocation, Ch. 3, Sec. 8; compiled warp layout and whether SASS emitted setmaxnreg.dec 24 are unrecorded).","card.g2.x":"All four $T$ values fall inside the 0.35 µs noise band: no gain, rejected; why it yielded no gain was not measured. Reverted in g4a.","card.g2.c":"vs. g1: −0.06 | +0.03 | +0.09 | +0.18 µs, all within the 0.35 µs noise band.","card.g3.f":"No corresponding g3 version on this qkv_gate chain (unwritten, unbuilt, unmeasured).","card.g3.i":"No corresponding build.","card.g3.o":"No corresponding build (Chapter 4's single-SMSP warp scoreboard latency-hiding tricks are already superseded here by async TMA mbarrier rings and warpgroup wgmma, rather than forming a separate version).","card.g3.x":"Skips Level 4 and moves directly to g4a (improving $T = 32$ waves, on-chip ring, and reduction, while reverting g2).","card.g3.c":"No measured values (this step renders hatched empty bar slots rather than copying g2's numbers or printing 0.00 deltas).","card.g4a.f":"$T = 32$ keeps swap-AB ($Y^\\top = W X^\\top$, m64n32k16, already in place since g1a) and lowers Split-K from 8 to 3; epilogue switches from last-arriving CTA summing 8 partials alone to all 3 split CTAs claiming tickets, spinning on the counter until all 3 arrive, and each summing its 1/3 slice.","card.g4a.i":"$T = 32$ tile $64 \\times 32 \\times 128$; $T = 128 / 256$ revert g2's 24-register cap back to g1; $T = 8$ unchanged.","card.g4a.o":"$T = 32$ changes three parts at once (three-item bundle, not measured separately): replaces g1a's cp.async commit_group / wait_group 3-slot ring with 1 TMA producer warp + 9-slot mbarrier ring (216 KiB SMEM $\\Rightarrow$ 1 CTA/SM); shrinks grid from 288 CTAs (~1.1 waves) to 108 CTAs (1 wave); and switches reduction to 3 co-resident split CTAs spin-waiting then summing slices in parallel (averaging $3 \\times (1/3) \\times 32 \\times 64 \\times 4$ B = 8 KiB per CTA).","card.g4a.x":"After this step $T = 32$ reaches ~3.17 TB/s effective weight rate; remaining bottleneck unprofiled. $T = 128 / 256$ epilogue still reads/writes global workspace; handed to g4b.","card.g4a.c":"vs. g2 ($T = 32$ 3-item bundle): −0.05 (noise) | −1.11 (−1.08 vs. g1) | −0.22 (noise) | −0.34 (noise) µs.","card.g4b.f":"At $T = 128 / 256$, Slice-0 consumers first zero output tile $Y$, then each slice stages BF16 partials via stmatrix to SMEM + 1 async TMA tile reduction (Ch. 5, Sec. 8) accumulating $Y \\mathrel{+}= P_i$ in place in global memory ($T = 32$ stays on parallel slice reduction).","card.g4b.i":"FP32 accumulator partial sums in registers per split CTA, plus cross-split readiness flag guarding that $Y$ has been zeroed.","card.g4b.o":"Eliminates FP32 global workspace write and readback; Slice 0's TMA producer warp waits until consumers return empty[s] barriers (which follow Slice-0 consumers' initial zero-stores to $Y$, requiring Slice-0 K-steps > slots), then issues red.release on flag outside its load loop (outside the wgmma async region), and slices wait via atomic_add(..., acquire) + cross-proxy fence (fence.proxy.async; Ch. 3, Sec. 5 & Ch. 5, Sec. 8) before TMA tile reduction — guaranteeing $Y = 0$ precedes release while avoiding Sec. 6's ptxas serialization hint and inserted DEPBAR drains.","card.g4b.x":"$T = 256$ (23.78 µs) still trails cuBLAS (cause unmeasured), with tile width only BN = 64. Handed to g4 to widen BN and fill the wave.","card.g4b.c":"vs. g4a: +0.13 (noise) | +0.15 (noise) | −1.30 | −1.52 µs; relative L2 error vs. FP64 rises from 1.6e-3 to 2.7e-3 (well under 1e-2 limit; consistent with rounding slices to BF16 before atomic add — inference, sole cause not verified separately).","card.g4.f":"$T = 256$ route changes from $(256, 64, 64,\\ \\text{Split-K } 3,\\ 5\\text{ slots})$ to $(256, 128, 64,\\ \\text{Split-K } 7,\\ 4\\text{ slots})$.","card.g4.i":"Same as g4b ($T = 8, 32, 128$ kernels unchanged).","card.g4.o":"$T = 256$ updates 3 hardware cards together (two bundled mechanisms, not measured separately): (1) BN 64 → 128 (MMA uses m64n128k16 SS and the SMEM ring shifts from $5 \\times 40$ KiB = 200 KiB to $4 \\times 48$ KiB = 192 KiB — bytes/slot grow +20% while Tensor Core MMA work/slot doubles 512 → 1,024 cycles); (2) Split-K 3 → 7 expands the 132-SM grid from 108 to $18 \\times 7 = 126$ CTAs (idle SMs 24 → 6).","card.g4.x":"All four $T$ values beat cuBLAS g0 for the first time; however, $T = 8 / 32$ still read all 37.75 MB of 16-bit weights, handed to final version g5.","card.g4.c":"vs. g4b: −0.12 | −0.06 | −0.13 (run-to-run noise on unchanged kernels) | −1.65 µs ($T = 256$ relative L2 error rises to 3.65e-3, cause unchecked).","card.g5.f":"All $T$ rewritten in custom CUDA C++ + inline PTX building matrix descriptors, TMA tensor descriptors, and barrier phases directly; $T = 8 / 32$ compress weights to lossless 12-bit C12 decoded in registers, while $T = 128 / 256$ keep 16-bit BF16 per Sec. 4's crossover.","card.g5.i":"$T = 8 / 32$ read C12 main table 28.31 MB (+ 0.07 MB side table, 25% fewer main-table bytes); $T = 128 / 256$ read 37.75 MB BF16 $W$ (both in card-wide shared HBM; which stack holds which bytes is not specified).","card.g5.o":"$T = 8$: 5-slot TMA ring, 24 rows/CTA, 96 CTAs full-$K$ direct-write mma.sync m16n8k16 kernel (4 main C12-decode warps + 4 side-table outlier-correction warps per Sec. 2); $T = 32$: 10-slot C12 ring, Split-K = 3, 108 CTAs, 2 alternating consumer warpgroups RS ($A$ in regs) wgmma m64n32k16 + wait_group 0 + TMA tile reduction; $T = 128$: custom C++ port of 108-CTA SS ($A, B$ in SMEM) wgmma m64n64k16 ($T = 32 / 128$ both release flag from producer after load loop); $T = 256$: retiled to $\\text{BM} = 128 \\times \\text{BN} = 192$, back from $4 \\times 48$ KiB to $5 \\times 40$ KiB ring, Split-K = 5, 120-CTA single-wave SS wgmma m64n192k16: here the producer warp returns right after its load loop, Slice-0 consumer thread 0 releases flag after wait_group 0 and consumer barrier (also outside async region), and Slice 0 is assigned the shorter 23 / 128 K-step partition (others run 26–27) so its loop finishes early and releases the flag early; across $T = 32 / 128 / 256$, all slices wait via ld.acquire.gpu + cross-proxy fence then issue TMA tile reduction.","card.g5.x":"Final version. $T = 8$ saves 2.95 µs measured (~2.72 µs rough estimate scaling non-overhead time by −25% bytes after subtracting 4.96 µs empty graph); at $T = 8 / 32$ C12 byte reduction + C++ rewrite, and at $T = 256$ retiling + C++ rewrite, are bundled and not measured separately; $T = 128$ isolates the C++ port at parity with Gluon (+0.07 µs noise).","card.g5.c":"vs. g4: −2.95 | −2.65 | +0.07 (noise) | −0.77 µs. Total vs. g0: −5.31 (−29%, 1.41×) | −4.30 (−23%, 1.30×) | −3.97 (−19%, 1.23×) | −1.54 (−7%, 1.07×) µs.","card.lab.f":"Formula","card.lab.i":"Input","card.lab.o":"Output","card.lab.x":"Hand-off","card.lab.c":"Cost","chart.hd":"Measured full-graph replay latency (µs, lower is better; incl. 4.96 µs empty-graph overhead, 0.35 µs noise band)","chart.key.prev":"Prev measured version","chart.key.prevg2":"Prev measured version (g2)","chart.key.cur":"This step","chart.key.g0":"g0 (cuBLAS baseline)","chart.key.nov":"No version (unmeasured)","chart.nov":"No version (unmeasured)","chart.base":"cuBLAS baseline","chart.l1":"vs prev {d}","chart.l1g2":"vs g2 {d}","chart.l2":"vs g0 {d} ({p})","chart.noise":"noise","lg.lv.1":"Level 1: Timeline (Ch. 1)","lg.lv.2":"Level 2: Full Chip (Ch. 2)","lg.lv.3":"Level 3: Single SM (Ch. 3)","lg.lv.4":"Level 4: Single SMSP (unused here)","lg.lv.5":"Level 5: Pipelines & Tensor Core (Ch. 5)","lg.lv.6":"Level 6: Single Instructions & Bits (Ch. 6)","lg.base":"cuBLAS baseline","lg.dual":"Split header = combines two levels","lg.ink":"Black outline = selected version / step callout","lg.card":"Clear card + 'changed' tag = modified in this step (dim = unchanged, retains prev measured state; g3 shows g2 text)","lg.busy":"Dark square = SM with resident CTA (positions schematic)","lg.idle":"Light square = idle SM (positions schematic)","lg.nov":"Hatched dashed box = no version / unmeasured","lg.prev":"Prev measured latency","lg.cur":"Current step latency","lg.g0":"g0 baseline latency","lg.delta":"Green = faster, Red = slower (beyond 0.35 µs noise band), Gray = run-to-run noise within 0.35 µs","cap":"Press Play, click '‹ ›', or use the 9-segment track to step from g0 to g5, or click / Tab to any version chip or click any hardware mechanism card to jump directly to a step: clear cards tagged 'changed' highlight modified components, the step card lists the formula, input, output, hand-off, and cost, and the bar chart compares measured full-graph latency across all four T values against the previous version and g0."},"IDS":["g0","g1a","g1","g2","g3","g4a","g4b","g4","g5"],"TS":[8,32,1 mers' zero-stores to Y (requires Slice-0 K-steps > slots), ordering Y = 0 first\nProducer issues red.release outside load loop (outside async region), avoiding Sec. 6's ptxas serialization hint (DEPBAR drains)"},{"p":"mma","body":"T = 128: 1 consumer warpgroup (4 warps) flips operands from g1a swap-AB back to X on M side (Gluon SS wgmma m64n64k16; operand roles match T = 256)\nT = 256: 2 consumer warpgroups (8 warps), SS wgmma m64n64k16\nT = 8 / 32: still swap-AB m64n16k16 / m64n32k16 (four edits not measured separately)"},{"p":"reduce","body":"T = 128 / 256: Slice-0 consumers first write zeros into output tile Y\nAfter atomic_add(..., acquire) on flag + cross-proxy fence, each slice stages via stmatrix & issues 1 async TMA tile reduction adding into Y\nT=32 still slice reduce; L2 err 1.6e-3→2.7e-3 (pre-rounding inference, sole cause unverified); T=256 lag unmeasured"}],"g4":[{"p":"launch","body":"All T fused into 1 kernel launch per GEMM (separate reduction kernel removed)"},{"p":"grid","tag":"Shown T = 256: 126 dark busy · 6 light idle\n(schematic; T = 32/128 stay 108)","body":"T = 256: Split-K 3 → 7, grid expands to 18 × 7 = 126 CTAs (idle SMs 24 → 6)\nT = 32 / 128: still 108 CTAs; T = 8: still 288 CTAs"},{"p":"weight","body":"W [2304, 8192] BF16 = 37.75 MB; X [T, 8192] BF16 (X stays BF16 across all versions and stages alongside W)\nBoth reside in card-wide shared HBM; which stack holds which bytes is not specified"},{"p":"move","body":"T = 256: SMEM ring changes from 5 × 40 KiB (200 KiB) to 4 × 48 KiB (192 KiB)\nSplit-0 producer still releases flag outside async region after empty[s] returns (T = 128 stays 8 × 24 KiB as in g4b)"},{"p":"mma","body":"T = 256: widens BN 64 → 128 (SS wgmma m64n128k16)\nBytes/slot grow +20% (40 → 48 KiB) while Tensor Core MMA work/slot doubles (512 → 1,024 cycles)\nBundled with 126 CTAs, not measured separately; T = 256 err 3.65e-3 cause unchecked; T ≤ 128 unchanged"},{"p":"reduce","body":"T = 128 / 256: Slice-0 consumers first write
