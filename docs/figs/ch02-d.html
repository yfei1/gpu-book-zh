<!doctype html><html lang="en"><head><script>(()=>{
// Shared figure controls: playback speed, click-to-seek on the timeline, click a box to jump to its step, step buttons.

let speed=+(localStorage.getItem("figSpeed2")||0.25), baseN=null, baseV=0, lastN=0;
const virt=n=>{ if(baseN===null){ baseN=n; baseV=n; } lastN=n; return baseV+(n-baseN)*speed; };

  document.querySelectorAll(".spd button[data-s]").forEach(b=>b.classList.toggle("on",+b.dataset.s===s)); };

  play.after(box); setSpeed(SPEEDS.includes(speed)?speed:0.25);
  const isPlaying=()=>play.textContent.trim()==="暂停";
  const pause=()=>{ if(isPlaying()) play.click(); };
  const setT=v=>{ tIn.value=String(v); tIn.dispatchEvent(new Event("input")); };
  const lo=()=>+(tIn.min||0), hi=()=>+(tIn.max||100);
  const stepOf=()=>{ const m=(stepN&&stepN.textContent||"").match(/(\d+)/); return m?+m[1]:0; };
  const RING=".fr, #focus circle", MARK2="#algO *, .ao, .cur"; let useRing=null;
  let map=null, mapKey="";

  const centers=()=>{ const out=[]; document.querySelectorAll(useRing===false?MARK2:RING).forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width||r.height) out.push([r.left+r.width/2, r.top+r.height/2]); }); return out; };
  const stripBoxes=()=>{ const out=[]; document.querySelectorAll("#algO *, .ao, .sb.on, text.st.on").forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width&&r.height) out.push([r.left,r.top,r.right,r.bottom]); }); return out; };
  const build=()=>{ const keep=+tIn.value, a=lo(), b=hi(), N=400, steps=new Map(); let prevK=-1, prevT=a;

      prevT=t; }

  const goStep=k=>{ const m=ensure(); const i=m.findIndex(x=>x[0]===k); if(i<0) return; const t0=m[i][1].t, t1=i+1<m.length?m[i+1][1].t:hi();
    for(const f of [0.3,0.5,0.7,0.9,1]){ setT(Math.min(hi(), t0+Math.max(1e-6,(t1-t0)*f))); if(stepOf()===k) return; } setT(Math.min(hi(), t0+(t1-t0)*0.3)); };

    if(b.dataset.s) return setSpeed(+b.dataset.s);
    pause(); const m=ensure(); if(!m.length) return; const k=stepOf(), d=+b.dataset.k;
    const idx=m.findIndex(x=>x[0]===k); const nx=m[Math.max(0,Math.min(m.length-1,(idx<0?(d>0?-1:0):idx)+d))]; goStep(nx[0]); });

      cand=[...new Set(near)]; }
    cand.sort((a,b)=>a-b); if(!cand.length) return false;

  document.querySelectorAll("svg").forEach(svg=>{ svg.classList.add("seekable");
    svg.addEventListener("click",e=>{ if(e.target.closest("a")) return;

});
})();

addEventListener("DOMContentLoaded",()=>{
  const st=document.createElement("style"); st.textContent='[data-rv="0"]{visibility:hidden!important}'; document.head.appendChild(st);
  const apply=()=>{ const clipR=document.querySelector('clipPath > rect[id^="clipR"]'), cur=document.getElementById("cur"), tIn=document.getElementById("tIn");
    if(!clipR||!cur||!tIn||!clipR.parentNode.id) return;
    const c=cur.getBoundingClientRect(), cx=c.left+c.width/2, done=+tIn.value>=+tIn.max;
    const T=[...document.querySelectorAll('[clip-path="url(#'+clipR.parentNode.id+')"] text')], R=T.map(e=>e.getBoundingClientRect());
    T.forEach((e,i)=>{ const r=R[i]; if(!r.width) return;
      const inBand=r.top>=c.top-2&&r.bottom<=c.bottom+2;
      if(inBand&&!done&&r.right-0.5>cx) e.setAttribute("data-rv","0"); else e.removeAttribute("data-rv"); }); };
  new MutationObserver(apply).observe(document.body,{attributes:true,attributeFilter:["width","d"],subtree:true});
  apply();
});
