  const lo=()=>+(tIn.min||0), hi=()=>+(tIn.max||100);

addEventListener("DOMContentLoaded",()=>{
  const st=document.createElement("style"); st.textContent='[data-rv="0"]{visibility:hidden!important}'; document.head.appendChild(st);
  const apply=()=>{ const clipR=document.querySelector('clipPath > rect[id^="clipR"]'), cur=document.getElementById("cur"), tIn=document.getElementById("tIn");
    if(!clipR||!cur||!tIn||!clipR.parentNode.id) return;
    const c=cur.getBoundingClientRect(), cx=c.left+c.width/2, done=+tIn.value>=+tIn.max;
    const T=[...document.querySelectorAll('[clip-path="url(#'+clipR.parentNode.id+')"] text')], R=T.map(e=>e.getBoundingClientRect());
    T.forEach((e,i)=>{ const r=R[i]; if(!r.width) return;
      const inBand=r.top>=c.top-2&&r.bottom<=c.bottom+2;
      if(inBand&&!done&&r.right-0.5>cx) e.setAttribute("data-rv","0"); else e.removeAttribute("data-rv"); }); };

  K.innerHTML=[["公式",c.f,1],["输入",c.i],["输出",c.o],["交给下一步",c.x],["代价",c.c]].map(r=>"<div><dt>"+r[0]+"</dt><dd"+">"+r[1]+"</dd></div>").join(""); }
let mode=1, S=[], N=1, t=0, prevLit=[];
function tx(tt){ const X=MODES[mode].X, f=Math.min(Math.max(tt,0),N), k=Math.min(N-1,Math.floor(f)); return X[k]+(X[k+1]-X[k])*(f-k); }
function setMode(m){ mode=m; const d=MODES[m]; S=d.steps; N=S.length; $("tl").innerHTML=d.tl; $("tIn").max=String(N); readout.textContent=d.ro; t=Math.min(t,N); if(d.setup) d.setup(); }
function show(){
  const d=MODES[mode], f=Math.min(t,N); let k=Math.min(N-1,Math.floor(f)); const u=f>=N?1:f-k, s=S[k];
  prevLit.forEach(e=>e.classList.remove("issue","warm")); prevLit=[];
  (s.lit||[]).forEach(sel=>{ const cls=sel.startsWith("!")?"warm":"issue"; document.querySelectorAll(sel.replace(/^!/,"")).forEach(e=>{e.classList.add(cls); prevLit.push(e);}); });
  let h=""; (s.blocks?s.blocks(u):(s.mv||[]).filter(m=>u>=(m.s||0)).map(m=>({p:along(m.path,(u-(m.a||0))/((m.b||0.7)-(m.a||0))),n:m.n,l:m.l,r:m.r}))).forEach(b=>{ h+='<g><circle class="blk" cx="'+b.p[0].toFixed(1)+'" cy="'+b.p[1].toFixed(1)+'" r="'+(b.r||7)+'" fill="'+PALJ[(b.n-1)%PALJ.length]+'"/><text class="bn" x="'+b.p[0].toFixed(1)+'" y="'+(b.p[1]+3.4).toFixed(1)+'">'+(b.l||b.n)+'</text></g>'; });
  $("dots").innerHTML=h;
  $("focus").innerHTML = s.ring ? '<circle class="fr" cx="'+s.ring[0][0]+'" cy="'+s.ring[0][1]+'" r="'+(s.ring[2]||11)+'"/><text class="fn" x="'+s.ring[0][0]+'" y="'+(s.ring[0][1]-(s.ring[2]||11)-3)+'">'+s.ring[1]+'</text>' : "";
  $("algO").innerHTML = s.alg ? '<rect class="ao" x="'+s.alg[0]+'" y="'+s.alg[1]+'" width="'+s.alg[2]+'" height="'+s.alg[3]+'" rx="3"/>' : "";
  $("stepN").textContent="第 "+(k+1)+" 步"; card(s);
  const x=tx(f); $("clipR").setAttribute("width",Math.max(0,x-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+x.toFixed(1)+" "+(TLY0-4)+"V"+TLY1); $("tIn").value=String(t);
}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<N) t=Math.min(N,t+dt*0.45); else { hold+=dt; if(hold>2.5){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=N){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(true); }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? STILL_T : 0); show(); if(playing) start(); else play.textContent="播放";
