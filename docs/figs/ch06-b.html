let PXarr=[];
function pxAt(){ if(t<=PXarr[0][0]) return PXarr[0][1]; for(let i=1;i<PXarr.length;i++){ if(t<=PXarr[i][0]){ const a=PXarr[i-1],b=PXarr[i]; return a[1]+(b[1]-a[1])*(t-a[0])/(b[0]-a[0]); } } return PXarr[PXarr.length-1][1]; }
function show(){ const litB={}; let k=-1; for(let i=0;i<EV.length;i++) if(EV[i].t<=t+1e-9) k=i;
  for(let i=0;i<=k;i++) (EV[i].bits||[]).forEach(([hi,lo])=>{ for(let b=lo;b<=hi;b++) litB[b]=1; });
  for(let b=0;b<32;b++){ const el=document.querySelector('[data-bit="'+b+'"]'); if(litB[b]){ const m=meta(mode,b); tintL(el,HUE(m.j),LF[m.f]); } else tintL(el,null); }
  const regs=document.querySelector('[data-part="regs"]'), alu=document.querySelector('[data-part="int32"]'); regs.classList.toggle("issue",k>=0&&Object.keys(litB).length>0); alu.classList.toggle("issue",k>=0&&!!EV[k].alu);
  /* algorithm strip */
  const g=mode===1?1:(mode===2?2:8), w=28, gap=2; let r=""; const x=(j)=>AX+j*(w+gap);
  for(let j=0;j<16;j++){ const inR0=j<g; r+='<rect x="'+x(j)+'" y="'+AY+'" width="'+w+'" height="20" fill="'+(inR0?hsl(HUE(j%8),55,46):"var(--anatomy-face)")+'" stroke="var(--anatomy-faint)"/><text x="'+(x(j)+w/2)+'" y="'+(AY+14)+'" font-size="11" text-anchor="middle" fill="'+(inR0?"#fff":"var(--anatomy-text)")+'">'+(j+1)+'</text>'; }
  for(let q=0;q<16/g;q++){ const a=x(q*g), b=x(q*g+g-1)+w; r+='<rect x="'+a+'" y="'+(AY+30)+'" width="'+(b-a)+'" height="20" fill="'+(q===0?"var(--anatomy-hi)":"var(--anatomy-face)")+'" stroke="var(--anatomy-lo)"/><text x="'+((a+b)/2)+'" y="'+(AY+44)+'" font-size="10.5" text-anchor="middle" fill="'+(q===0?"#fff":"var(--anatomy-text)")+'">R'+q+'</text>'; }

  r+='<text class="tn" x="'+AX+'" y="'+(AY+66)+'">'+(mode===1?"16 个寄存器，每个装 1 个权重":mode===2?"8 个寄存器，每个装 2 个权重":"2 个寄存器，每个装 8 个权重")+'</text>';

const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const hsl=(h,s,l)=>"hsl("+h+" "+s+"% "+l+"%)";
function tint(el,h){ if(!el) return; const st=el.style; if(h==null){ ["face","top","shade-0","shade-1","shade-2","shade-3"].forEach(k=>st.removeProperty("--anatomy-"+k)); return; }
  st.setProperty("--anatomy-face",hsl(h,55,46)); st.setProperty("--anatomy-top",hsl(h,60,62)); for(let i=0;i<4;i++) st.setProperty("--anatomy-shade-"+i,hsl(h,50,34+i*5)); }
function along(pts,u){ const segs=[]; let Lt=0; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); Lt+=d;} let s=Math.max(0,Math.min(1,u))*Lt; for(let i=0;i<segs.length;i++){ if(s<=segs[i]){const f=segs[i]?s/segs[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];} s-=segs[i];} return pts[pts.length-1]; }
const CARD_ROWS=[["f","公式"],["i","输入"],["o","输出"],["h","交给下一步"],["k","代价"]];
function narr(EV){ let k=-1; for(let i=0;i<EV.length;i++){ if(EV[i].t<=t+1e-9) k=i; else break; }
  const n=$("stepN"), s=$("stepT"), f=$("focus"), cd=$("card");
  if(k<0){ n.textContent=""; s.textContent="按播放，或拖动时间"; f.innerHTML=""; cd.innerHTML=""; return; }
  const e=EV[k]; n.textContent="第 "+(k+1)+" 步";
  const m=/^(.*?)(?:总)?代价：(.*)$/s.exec(e.s), c=Object.assign({k:m?m[2]:""},e.c||{});
  s.textContent=m?(m[1].replace(/[。\s]+$/,"")||"合计"):e.s;
  cd.innerHTML=CARD_ROWS.filter(r=>c[r[0]]).map(r=>"<dt>"+r[1]+"</dt><dd"+(r[0]==="f"?' class="m"':"")+">"+c[r[0]]+"</dd>").join("");
  f.innerHTML = e.p ? '<circle class="fr" cx="'+e.p[0]+'" cy="'+e.p[1]+'" r="'+(e.r||9)+'"/>'+(e.n!=null?'<text class="fn" x="'+e.p[0]+'" y="'+(e.p[1]-(e.r||9)-3)+'">'+e.n+'</text>':"") : ""; }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0, SPEED=3;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*SPEED); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(!still); if(still){ t=stillT(); show(); } }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||MODE0);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? stillT() : 0); show(); if(playing) start(); else play.textContent="播放";
