  document.querySelectorAll(".spd button[data-s]").forEach(b=>b.classList.toggle("on",+b.dataset.s===s)); };

  play.after(box); setSpeed(SPEEDS.includes(speed)?speed:0.25);
  const isPlaying=()=>play.textContent.trim()==="暂停";
  const pause=()=>{ if(isPlaying()) play.click(); };
  const setT=v=>{ tIn.value=String(v); tIn.dispatchEvent(new Event("input")); };
  const lo=()=>+(tIn.min||0), hi=()=>+(tIn.max||100);
  const stepOf=()=>{ const m=(stepN&&stepN.textContent||"").match(/(\d+)/); return m?+m[1]:0; };
  const RING=".fr, #focus circle", MARK2="#algO *, .ao, .cur"; let useRing=null;
  let map=null, mapKey="";
  const keyNow=()=>{ const r=document.querySelector("input[name=mode]:checked"); return (r?r.value:"")+"|"+tIn.max; };
  const centers=()=>{ const out=[]; document.querySelectorAll(useRing===false?MARK2:RING).forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width||r.height) out.push([r.left+r.width/2, r.top+r.height/2]); }); return out; };
  const stripBoxes=()=>{ const out=[]; document.querySelectorAll("#algO *, .ao, .sb.on, text.st.on").forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width&&r.height) out.push([r.left,r.top,r.right,r.bottom]); }); return out; };
  const build=()=>{ const keep=+tIn.value, a=lo(), b=hi(), N=400, steps=new Map(); let prevK=-1, prevT=a;
    const probe=t=>{ setT(t); return stepOf(); };
    for(let i=0;i<=N;i++){ const t=a+(b-a)*i/N, k=probe(t);

  const goStep=k=>{ const m=ensure(); const i=m.findIndex(x=>x[0]===k); if(i<0) return; const t0=m[i][1].t, t1=i+1<m.length?m[i+1][1].t:hi();
    for(const f of [0.3,0.5,0.7,0.9,1]){ setT(Math.min(hi(), t0+Math.max(1e-6,(t1-t0)*f))); if(stepOf()===k) return; } setT(Math.min(hi(), t0+(t1-t0)*0.3)); };

    if(b.dataset.s) return setSpeed(+b.dataset.s);
