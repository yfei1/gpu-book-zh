    : k<5 ? "row = "+row+" · tid = "+tid+" · 第 "+r+" / 64 轮 · k = "+kidx+"\n读 W["+(row*K+kidx)+"] 与 x["+kidx+"]，各 2 B · acc 已累加 "+r+" 项"
    : k<8 ? "row = "+row+" · tid = "+tid+" · 64 / 64 轮已完成\n每个线程累加了 64 项 · 现在在共享内存里归约"
    : "row = "+row+" · tid = "+tid+" · 64 / 64 轮\n整个 kernel 实测 54.08 µs（下界 7.86 µs 只占 14.5%）";
  const x=TX(Math.min(t,TOT)); $("clipR").setAttribute("width",(x-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+x.toFixed(1)+" "+(TY0-4)+"V"+(TY0+5*28)); $("tIn").value=String(t); }

document.querySelectorAll(".cl").forEach(e=>{ const i=+e.dataset.l; e.textContent=LINES[i]; e.addEventListener("click",()=>{

const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<TOT) t=Math.min(TOT,t+dt*0.7); else { hold+=dt; if(hold>3){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); function setPlay(p){ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=TOT){t=0;hold=0;} start(); } else show(); }
play.addEventListener("click",()=>setPlay(!playing));
