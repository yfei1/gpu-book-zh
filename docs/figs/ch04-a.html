</svg><div class="nar"><div class="nh"><b id="stepN"></b><span id="stepT"></span></div><dl id="stepK" class="kard"></dl></div><svg class="flat" viewBox="0 0 640 290" role="img" aria-label="每个 warp 每个周期在做什么">

<text class="lab2" x="132" y="16">每个 warp 一行：CTA r 的 warp 读 W 的第 r 行，算 y[r]</text>

<button id="play">暂停</button><label>时间 <input id="tIn" type="range" min="0" max="1400" step="1" value="0"></label></div><div class="lg"><span><i class="k1"></i>发出一条读取（读 W 的一段）</span><span><i class="k2"></i>发出一条计算（乘加、换算、循环控制）</span><span><i class="k3"></i>能发但没被选中</span><span><i class="k4"></i>在等读取的数据回来</span></div>
<p class="cap">换一种 warp 配置，看调度器有多少周期没有 warp 可发、在途字节有多少。每一行是一个 warp，同一种颜色在槽位里是同一个 warp。</p></main><script type="module">
const esc_=(s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function splitCost(s){ const m=s.match(/(总代价|代价)：/); if(!m) return {t:s,c:"—"}; const h=s.slice(0,m.index).replace(/[。；;，\s]+$/,""); return {t:h||"总代价", c:(h?s.slice(m.index):s.slice(m.index+m[0].length)).replace(/^代价：/,"")}; }
function card(a,b){ const c=Object.assign({},a,b||{}); document.getElementById("stepT").textContent=c.t||"";
  const K=document.getElementById("stepK"); if(!c.f){ K.innerHTML=""; return; }
  K.innerHTML=[["公式",c.f,1],["输入",c.i],["输出",c.o],["交给下一步",c.x],["代价",c.c]].map(r=>"<div><dt>"+r[0]+"</dt><dd"+(r[2]?' class="m"':"")+">"+esc_(r[1])+"</dd></div>").join(""); }

const TL0=132,TL1=620,TY0=26,RH=14,LAT=600,CYC=1400;
const LSU=[223.8,101.6], SLC=[[306.4,46.9],[316,53.7],[325.7,60.4],[335.3,67.1],[344.9,73.9],[354.5,80.6],[364.2,87.4],[373.8,94.1],[383.4,100.9],[393.1,107.6],[402.7,114.4],[412.3,121.1],[422,127.9],[431.6,134.6],[441.2,141.4],[450.9,148.1]];
const GX0=132,GX1=620,GY0=26,GP=5;
const col=(n)=>"hsl("+(212+(n*29)%46)+" "+(n%2?48:62)+"% "+(n%2?62:44)+"%)";
const M={1:{w:16,n:1,b:64,t:"v1：16 个 warp，每个 warp 每轮 1 条读取（每个线程 2 字节）"},2:{w:4,n:1,b:64,t:"只有 4 个 warp，每轮 1 条读取"},3:{w:4,n:8,b:512,t:"v7：约 4 个 warp（每个 SM 17–18 个），每轮 8 条读取（每条读取每个线程 16 字节）"}};
const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const slot=[...document.querySelectorAll("[data-slot]")];
const TX=(c)=>TL0+(TL1-TL0)*c/CYC;
let mode=1, rec=[], sel=[], t=0, end=CYC, stats=null;
function sim(md){ const m=M[md]; const W=m.w; const st=[...Array(W)].map((_,i)=>({pc:0,ready:i*0,dataAt:-1,loads:0}));
  const per=m.n+m.n*6; rec=[...Array(W)].map(()=>new Array(CYC).fill(0)); sel=new Array(CYC).fill(-1); let busy=0, none=0, inflight=0, infl=[];
  const ret=[]; // return times of loads
  for(let c=0;c<CYC;c++){ // ready = waiting nothing
    let pick=-1; const rdy=[];
    for(let w=0;w<W;w++){ const s=st[w]; const waitingData = s.pc===m.n && c<s.dataAt; if(!waitingData) rdy.push(w); else rec[w][c]=3; }
    if(rdy.length){ pick=rdy.reduce((a,b)=>st[a].last<=st[b].last?a:b, rdy[0]); }
    rdy.forEach(w=>{ if(w!==pick) rec[w][c]=2; });
    if(pick>=0){ const s=st[pick]; busy++; sel[c]=pick; s.last=c;
      if(s.pc<m.n){ rec[pick][c]=1; ret.push(c+LAT); s.pc++; if(s.pc===m.n) s.dataAt=c+LAT; }
      else { rec[pick][c]=4; s.pc++; if(s.pc>=per){ s.pc=0; } } } else none++;
    infl.push(ret.filter(x=>x>c).length); }
  st.forEach(s=>s.last=0);
  const avg=infl.slice(LAT).reduce((a,b)=>a+b,0)/(CYC-LAT);
  stats={busy:busy/CYC,none:none/CYC,kib:Math.max(...infl)*m.b/1024};
}
function setMode(md){ mode=md; const m=M[md]; for(let w=0;w<16;w++) slot[w].style.fill=""; sim(md);
  readout.textContent=m.t+"\n发射槽忙 "+Math.round(100*stats.busy)+"% 的周期 · no eligible（没有可发射的 warp） "+Math.round(100*stats.none)+"% · 本 SMSP 最多同时在途 "+(stats.kib<4?stats.kib.toFixed(1):stats.kib.toFixed(0))+" KiB";
  let rows="", h=""; for(let w=0;w<16;w++){ const y=TY0+w*RH; rows+='<rect class="row" x="'+TL0+'" y="'+y+'" width="'+(TL1-TL0)+'" height="'+(RH-2)+'"'+(w>=m.w?' opacity=".25"':'')+'/>'+(w<m.w&&w%4===0?'<text class="rl" x="'+(TL0-6)+'" y="'+(y+9)+'">CTA '+w+' 的 warp</text>':''); }
  for(let w=0;w<m.w;w++){ const y=TY0+w*RH; let c=0; const r=rec[w];
    while(c<CYC){ let e=c; while(e<CYC&&r[e]===r[c]) e++; const v=r[c];
      if(v===3) h+='<rect class="wait" x="'+TX(c).toFixed(1)+'" y="'+y+'" width="'+(TX(e)-TX(c)).toFixed(1)+'" height="'+(RH-2)+'"/>';
      else if(v===2) h+='<rect class="rdy" x="'+TX(c).toFixed(1)+'" y="'+y+'" width="'+Math.max(0.5,TX(e)-TX(c)).toFixed(1)+'" height="'+(RH-2)+'"/>';
      else if(v===1||v===4) h+='<rect class="'+(v===1?"ld":"cp")+'" x="'+TX(c).toFixed(1)+'" y="'+y+'" width="'+Math.max(1,TX(e)-TX(c)).toFixed(1)+'" height="'+(RH-2)+'"/>';
      c=e; } }
  $("rows").innerHTML=rows; $("tl").innerHTML=h;
  for(let r=0;r<16;r++){ const g=$("ag"+r); g.style.fill = r<m.w ? col(r) : ""; g.style.opacity = r<m.w ? 1 : ""; }
  let ax=""; for(let c=0;c<=CYC;c+=200) ax+='<text class="tn" x="'+TX(c).toFixed(1)+'" y="'+(TY0+16*RH+12)+'" text-anchor="middle">'+c+'</text>';
  ax+='<text class="tn" x="'+TL1+'" y="'+(TY0+16*RH+26)+'" text-anchor="end">时间（时钟周期）</text>'; $("ax").innerHTML=ax;
}

function narrate(c){ const n=document.getElementById("stepN"); const m=M[mode];
  if(t<1e-9){ n.textContent=""; card({t:"按播放，或拖动时间"}); return; }
  let wait=0, rdy=0; for(let w=0;w<m.w;w++){ if(rec[w][c]===3) wait++; else if(rec[w][c]===2) rdy++; }
  if(t>=end){ n.textContent="结束"; card(splitCost("总代价：这 "+CYC+" 个周期里，发射槽忙 "+Math.round(100*stats.busy)+"%，没有 warp 可发 "+Math.round(100*stats.none)+"%；本 SMSP 最多同时在途 "+(stats.kib<4?stats.kib.toFixed(1):stats.kib.toFixed(0))+" KiB"),{f:"发射槽忙 % = 发出指令的周期数 ÷ "+CYC,i:m.w+" 个 warp 的读取与计算（调度器每周期选 1 个）",o:"y 的 "+m.w+" 个值的部分和（FP32，寄存器）",x:"在途字节越多，等数据的周期越少"}); return; }
  const p=sel[c]; n.textContent="第 "+c+" 周期";
  if(p<0){ card(splitCost("没有 warp 能发：全部 "+m.w+" 个都在等读取的数据。代价：这个周期的发射槽空着"),{f:"—（本周期没有指令发出）",i:"全部 "+m.w+" 个 warp 都在等 W 的数据（正在 HBM → L2 → SM 的途中）",o:"无；发射槽空着",x:"最早发出的读取回来后，对应 warp 变成可发射"}); return; }
  const ld=rec[p][c]===1;
  const what= ld ? "一条读取（读 W 第 "+p+" 行的下一段）。代价：1 个发射周期；数据要约 600 个周期后才回来" : "一条计算（乘加、换算或循环控制）。代价：1 个发射周期";
  card(splitCost("调度器选中 CTA "+p+" 的 warp，发出"+what+"。"+(wait?wait+" 个 warp 在等数据":"")+(rdy?(wait?"，":"")+rdy+" 个能发但没被选中":"")),
   ld?{f:"reg ← W["+p+", k : k+"+(m.b/2)+"]（LD，每线程 "+(m.b/32)+" B，共 "+m.b+" B）",i:"W 第 "+p+" 行 BF16 的 "+m.b+" B（HBM），经 LSU 发出",o:m.b+" B 在途；约 600 个周期后回到 warp "+p+" 的寄存器",x:"数据回来后 warp "+p+" 才能发计算指令"}
     :{f:"acc += W · x（FMA；也包括换算与循环控制）",i:"warp "+p+" 寄存器里已回来的 W 值 + x",o:"acc（FP32，warp "+p+" 的寄存器）",x:"这一轮算完，warp "+p+" 再发下一轮读取"}); }

function show(){ const c=Math.min(CYC-1,Math.floor(t)); const m=M[mode];
  for(let w=0;w<16;w++){ const s=slot[w]; s.style.fill = w<m.w ? col(w) : "none"; s.style.opacity = w<m.w ? (rec[w][c]===3?0.35:1) : 1; }
  const p=sel[c]; $("selm").innerHTML = p>=0 ? '<path class="selb" d="'+slot[p].getAttribute("d")+'"/>' : "";
  $("agO").innerHTML = p>=0 ? '<rect class="ago" x="'+(GX0-1)+'" y="'+(GY0+p*GP-1)+'" width="'+(GX1-GX0+2)+'" height="'+(GP+1)+'"/>' : "";
  $("focus").innerHTML = p>=0 && t>0 ? '<circle class="fr" cx="'+SLC[p][0]+'" cy="'+SLC[p][1]+'" r="7"/><text class="fn" x="'+SLC[p][0]+'" y="'+(SLC[p][1]-10)+'">'+p+'</text>' : "";
  $("agF").innerHTML = p>=0 && t>0 ? '<circle class="fr" cx="'+(GX1+10)+'" cy="'+(GY0+p*GP+GP/2)+'" r="8"/><text class="fn" x="'+(GX1+10)+'" y="'+(GY0+p*GP+GP/2+4)+'">'+p+'</text>' : "";
  const lsu=document.querySelector('[data-part="lsu"]'); if(lsu) lsu.classList.toggle("on", p>=0 && rec[p][c]===1);
  ["fp32","int32"].forEach(k=>{ const g=document.querySelector('[data-part="'+k+'"]'); if(g) g.classList.toggle("on", p>=0 && rec[p][c]===4); });
  $("clipR").setAttribute("width",(TX(Math.min(t,end))-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(Math.min(t,end)).toFixed(1)+" "+(TY0-4)+"V"+(TY0+16*RH)); $("tIn").value=String(t); narrate(c);
}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*180); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(!still); if(still){t=end;show();} }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? end : 0); show(); if(playing) start(); else play.textContent="播放";
</script><style>body{display:flow-root}.iso-page{margin:16px auto 12px!important}</style><script>(function(){function s(){var h=Math.ceil(document.body.getBoundingClientRect().height);parent.postMessage({figH:h},"*");}window.addEventListener("load",s);new ResizeObserver(s).observe(document.body);})();</script></body></html>
