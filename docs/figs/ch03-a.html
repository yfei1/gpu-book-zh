addEventListener("DOMContentLoaded",()=>{
  const st=document.createElement("style"); st.textContent='[data-rv="0"]{visibility:hidden!important}'; document.head.appendChild(st);

    const c=cur.getBoundingClientRect(), cx=c.left+c.width/2, done=+tIn.value>=+tIn.max;

vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathit">gridDim</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">132</span></span></span></span> = ⟦grid⟧</div><div data-c="rejP" data-f="i">网格只开一轮：每个 SM 正好驻留 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span> 个 CTA，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span> = ⟦N⟧</div><div data-c="rejP" data-f="o">没有第 ⟦N1⟧ 个 CTA 排队；剩下的行由已驻留的 CTA 循环领取</div><div data-c="rejP" data-f="x">驻留的 CTA 一直留在 SM 上，直到所有行做完</div><div data-c="rejP" data-f="c">CTA 不分批进驻，状态可以留在 SM 上；每个 CTA 多一层循环</div><div data-c="total" data-f="f"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi><mo>=</mo><mi>min</mi><mo>⁡</mo><mtext> ⁣</mtext><mrow><mo fence="true">(</mo><mo stretchy="false">⌊</mo><mn>64</mn><mi mathvariant="normal">/</mi><mi>w</mi><mo stretchy="false">⌋</mo><mo separator="true">,</mo><mtext> </mtext><mn>32</mn><mo separator="true">,</mo><mtext> </mtext><mo stretchy="false">⌊</mo><mn>65536</mn><mi mathvariant="normal">/</mi><mi>R</mi><mo stretchy="false">⌋</mo><mo separator="true">,</mo><mtext> </mtext><mo stretchy="false">⌊</mo><mn>228</mn><mi mathvariant="normal">/</mi><mi>S</mi><mo stretchy="false">⌋</mo><mo fence="true">)</mo></mrow></mrow><annotation encoding="application/x-tex">N=\min\!\left(\lfloor 64/w\rfloor,\ 32,\ \lfloor 65536/R\rfloor,\ \lfloor 228/S\rfloor\right)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mop">min</span><span class="mspace" style="margin-right:-0.1667em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner"><span class="mopen delimcenter" style="top:0em;">(</span><span class="mopen">⌊</span><span class="mord">64/</span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mclose">⌋</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">32</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mopen">⌊</span><span class="mord">65536/</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mclose">⌋</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mopen">⌊</span><span class="mord">228/</span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span><span class="mclose">⌋</span><span class="mclose delimcenter" style="top:0em;">)</span></span></span></span></span></div><div data-c="total" data-f="i">每个 CTA：<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>w</mi></mrow><annotation encoding="application/x-tex">w</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span></span></span></span> = ⟦w⟧ 个 warp，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span></span></span></span> = ⟦R⟧ 个寄存器，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>S</mi></mrow><annotation encoding="application/x-tex">S</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0576em;">S</span></span></span></span> = ⟦Sn⟧ KiB SMEM（含保留 1 KiB）；四个池子各能放：⟦lims⟧</div><div data-c="total" data-f="o">驻留 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>N</mi></mrow><annotation encoding="application/x-tex">N</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span></span></span></span> = ⟦N⟧ 个 CTA = ⟦Nw⟧ 个 warp；<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mrow><mi mathvariant="normal">o</mi><mi mathvariant="normal">c</mi><mi mathvariant="normal">c</mi><mi mathvariant="normal">u</mi><mi mathvariant="normal">p</mi><mi mathvariant="normal">a</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">c</mi><mi mathvariant="normal">y</mi></mrow><mo>=</mo><mi>N</mi><mi>w</mi><mi mathvariant="normal">/</mi><mn>64</mn></mrow><annotation encoding="application/x-tex">\mathrm{occupancy}=Nw/64</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.625em;vertical-align:-0.1944em;"></span><span class="mord"><span class="mord mathrm" style="margin-right:0.0139em;">occupancy</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mord">/64</span></span></span></span> = ⟦occ⟧%⟦extra⟧</div><div data-c="total" data-f="x">驻留的 warp 数决定同时能挂多少次读（第 4 章）</div><div data-c="total" data-f="c">⟦first⟧先满，再放一个 CTA 就放不下</div></template></main><script type="module">
const CARDS={}; document.getElementById("cardT").content.querySelectorAll("[data-c]").forEach(e=>{ (CARDS[e.dataset.c]=CARDS[e.dataset.c]||{})[e.dataset.f]=e.innerHTML; });
const fill=(s,v)=>s.replace(/⟦(\w+)⟧/g,(m,n)=>v[n]);
function card(title,key,v){ document.getElementById("stepT").textContent=title||"";
  const K=document.getElementById("stepK"); if(!key){ K.innerHTML=""; return; }
  const c=CARDS[key]; K.innerHTML=[["公式",c.f,1],["输入",c.i],["输出",c.o],["交给下一步",c.x],["代价",c.c]].map(r=>"<div><dt>"+r[0]+"</dt><dd"+(r[2]?' class="m"':"")+">"+fill(r[1],v)+"</dd></div>").join(""); }

const AX=96,AY=30,BX0=124,BX1=560,BY0=26,TL0=124,TL1=620,TY0=26;
const col=(n)=>"hsl("+(208+(n*37)%48)+" "+(n%2?50:60)+"% "+(n%2?62:42)+"%)";
const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const reg=[...document.querySelectorAll("[data-reg]")], slot=[...document.querySelectorAll("[data-slot]")], smc=[...document.querySelectorAll("[data-sm]")];
const POOL=[64,32,65536,228], NM=["warp 槽位","CTA 槽位","寄存器","SMEM"], ROWS=2304, NSM=132;
const FR=(x,y,n,r,inside)=>'<circle class="fr" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'"/><text class="fn" x="'+x.toFixed(1)+'" y="'+(inside?y+4:y-r-3).toFixed(1)+'">'+n+'</text>';
const fmtS=(k)=>k<1?(k*1024)+" B":k+" KiB";
let thr=128, rpt=22, smk=0.5, persist=false, N=0, end=1, t=0, need=[], lim=[], first=[], extra=0, grid=0;
function calc(){
  const w=Math.ceil(thr/32), rw=Math.ceil(rpt/8)*8*32;
  need=[w,1,rw*w,smk+1];
  lim=[Math.floor(64/w),32,Math.floor(65536/(rw*w)),Math.floor(228/(smk+1))];
  N=Math.min(...lim); end=N+1.6; first=[...lim.keys()].filter(i=>lim[i]===N);
  grid=persist?N*NSM:ROWS; extra=(!persist&&N*NSM>ROWS)?+(ROWS/NSM*w).toFixed(2):0;
  readout.textContent="每个 SM 驻留 "+N+" 个 CTA（"+(N*w)+" 个 warp）\n"+(first.length>1?"同时满的是：":"先满的是：")+first.map(i=>NM[i]).join("、")+"\n理论占用率 "+Math.round(100*N*w/64)+"%"+(extra?"\n实际每 SM 平均驻留 "+extra+" 个 warp（网格只有 2,304 个 CTA）":"")+(persist?"\n持久：网格 = "+N+" × 132 = "+(N*NSM).toLocaleString()+" 个 CTA":"");
  $("tIn").max=String(end); t=Math.min(t,end);
  $("thrO").textContent=thr; $("rptO").textContent=rpt; $("smO").textContent=fmtS(smk);
  let tl=""; const TX=(x)=>TL0+(TL1-TL0)*x/Math.max(end,8);
  for(let n=0;n<N;n++) tl+='<rect x="'+TX(n).toFixed(1)+'" y="'+(TY0+2)+'" width="'+Math.max(2,TX(n+0.8)-TX(n)).toFixed(1)+'" height="14" fill="'+col(n)+'"/>';
  if(!persist) tl+='<rect class="rej" x="'+TX(N).toFixed(1)+'" y="'+(TY0+2)+'" width="'+Math.max(4,TX(N+0.8)-TX(N)).toFixed(1)+'" height="14"/>';
  $("tl").innerHTML=tl; window.TX=TX;
}

function narrate(){ const n=$("stepN"); const k=Math.floor(t); const w=need[0], R=need[2]/w, Sx=fmtS(need[3]);
  const v={w:w,R:need[2].toLocaleString(),S:Sx,Sn:need[3],N:N,N1:N+1,Nw:N*w,occ:Math.round(100*N*w/64),first:first.map(i=>NM[i]).join("、"),grid:(N*NSM).toLocaleString(),
    lims:NM.map((x,i)=>x+" "+lim[i]).join("，"),extra:extra?"；实际每 SM 平均驻留 "+extra+" 个 warp（网格只有 2,304 个 CTA）":""};
  if(t<1e-9 && k===0){ n.textContent=""; card("按播放，或拖动时间"); return; }
  if(k<N){ n.textContent="第 "+(k+1)+" 步"; v.row=k;
    if(persist){ const rl=[]; for(let r=k;r<ROWS;r+=grid) rl.push(r); v.nr=rl.length; v.rows=rl.length>3?rl.slice(0,2).join("、")+"……"+rl[rl.length-1]:rl.join("、"); }
    card("第 "+(k+1)+" 个 CTA 进驻"+(persist?"，算 W 的一行，再回到循环开头领下一行":"，算 W 的一行"),persist?"enterP":"enter",v); return; }
  if(k>=N+1){ n.textContent="第 "+(N+2)+" 步"; card("总代价：这个 SM 同时驻留 "+N+" 个 CTA，共 "+(N*w)+" 个 warp（理论占用率 "+Math.round(100*N*w/64)+"%）","total",v); return; }
  n.textContent="第 "+(N+1)+" 步";
  if(persist) card("网格只开一轮，没有第 "+(N+1)+" 个 CTA","rejP",v);
  else card("第 "+(N+1)+" 个 CTA 放不下："+v.first+"已经用完","rej",v); }

function show(){
  const n=Math.min(N,Math.floor(t)); const w=need[0], cellsW=need[2]/w/256;
  slot.forEach(e=>e.style.fill="none"); reg.forEach(e=>e.style.fill="none"); smc.forEach(e=>e.style.fill="none");
  let us=0, ur=0;
  for(let c=0;c<n;c++){ for(let j=0;j<w;j++){ if(us<64) slot[us++].style.fill=col(c); for(let q=0;q<cellsW;q++) if(ur<256) reg[ur++].style.fill=col(c); } }
  let sm0=0; for(let c=0;c<n;c++){ const a=Math.round(sm0/4), b=Math.round((sm0+need[3])/4); for(let i=a;i<Math.min(b,57);i++) smc[i].style.fill=col(c); sm0+=need[3]; }
  const show_=Math.min(Math.max(N+1,8),32), rw_=(640-AX-20)/show_, kk=Math.floor(t);
  const loops=persist&&grid<ROWS;
  $("algSvg").setAttribute("viewBox","0 0 640 "+(persist?138:92));
  let ar=""; const R2=AY+58;
  for(let c=0;c<show_;c++){ const x=AX+c*rw_; const on=c<n, rej=(!persist&&c===N&&t>=N);
    ar+='<rect '+(on?'fill="'+col(c)+'"':(rej?'class="rej"':'class="wrow"'))+' x="'+(x+1).toFixed(1)+'" y="'+AY+'" width="'+(rw_-2).toFixed(1)+'" height="22"/>';
    if(persist&&c<N&&(c<ROWS-grid)){ ar+='<rect '+(on?'fill="'+col(c)+'"':'class="wrow"')+' x="'+(x+1).toFixed(1)+'" y="'+R2+'" width="'+(rw_-2).toFixed(1)+'" height="22"/>';
      if(on) ar+='<path class="loop" stroke="'+col(c)+'" d="M'+(x+rw_/2).toFixed(1)+' '+(AY+24)+'V'+(R2-5)+'m-3 -4l3 4l3 -4"/>'; } }
  if(persist){ ar+='<text class="rl" x="'+(AX-6)+'" y="'+(AY+15)+'">第 1 行</text><text class="rl" x="'+(AX-6)+'" y="'+(R2+15)+'">第 2 行</text>';
    ar+='<text class="tn" x="'+AX+'" y="'+(R2+38)+'">'+(loops?'每格是一个 CTA；箭头：这一行做完，不退出，回到循环开头，领 行号 + 网格大小 的那一行':'网格已覆盖全部 2,304 行，每个 CTA 只做一行，不需要循环')+'</text>'; }
  else ar+='<text class="tn" x="'+AX+'" y="'+(AY+38)+'">每格是一个 CTA（W 的一行）；有颜色 = 已进驻这个 SM，斜线 = 放不下，要等前面的 CTA 做完</text>';
  let fi=""; if(t>=1e-9 && kk<N){ if(us<64){ const bb=slot[us].getBBox(); fi=FR(bb.x+bb.width/2,bb.y+bb.height/2,kk+1,7,false); }
    if(kk<show_) ar+=FR(AX+kk*rw_+rw_/2,AY+11,kk+1,9,true); }
  else if(!persist && t>=1e-9 && kk===N && kk<show_) ar+=FR(AX+kk*rw_+rw_/2,AY+11,kk+1,9,true);
  $("focus").innerHTML=fi; $("algR").innerHTML=ar;
  let sg="", fl=""; for(let p=0;p<4;p++){ const per=need[p]/POOL[p]*(BX1-BX0); for(let c=0;c<n;c++) sg+='<rect x="'+(BX0+c*per).toFixed(1)+'" y="'+(BY0+p*24+2)+'" width="'+Math.max(0.6,per-0.6).toFixed(1)+'" height="14" fill="'+col(c)+'"/>';
    if(t>=N && lim[p]===N){ fl+='<rect class="fullb" x="'+BX0+'" y="'+(BY0+p*24)+'" width="'+(BX1-BX0)+'" height="18"/><text class="fullt" x="'+(BX1+6)+'" y="'+(BY0+p*24+13)+'">先满</text>'; } }
  $("segs").innerHTML=sg; $("full").innerHTML=fl;
  $("clipR").setAttribute("width",(TX(Math.min(t,end))-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(Math.min(t,end)).toFixed(1)+" "+(TY0-4)+"V"+(TY0+22)); $("tIn").value=String(t); narrate();
}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*4); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
