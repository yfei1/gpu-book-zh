.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}

.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}

.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}

.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

<label class="sl">每个 CTA 的 SMEM（KiB） <input id="smI" type="range" min="0" max="227" step="0.5" value="0.5"> <b id="smO">0.5</b></label>
<div class="pre"><button data-pre="128,22,0.5">gemv_kernel（22 个寄存器）</button><button data-pre="128,32,0.5">寄存器加到 32</button><button data-pre="128,64,0.5">寄存器加到 64</button><button data-pre="32,32,0.5">每个 CTA 32 线程</button><button data-pre="128,32,100">SMEM 用 100 KiB</button></div></div><div class="lg"><span><i class="k1"></i>每种颜色是一个 CTA</span><span><i class="k2"></i>先满的池子</span><span><i class="k3"></i>放不下的下一个 CTA</span></div>
<p class="cap">拖动三个滑块，看哪个池子先满、这个 SM 能放下几个 CTA。同一种颜色在算法带、SM 和池子里是同一个 CTA。</p></main><script type="module">
const AX=96,AY=30,BX0=124,BX1=560,BY0=26,TL0=124,TL1=620,TY0=26;
const col=(n)=>"hsl("+(208+(n*37)%48)+" "+(n%2?50:60)+"% "+(n%2?62:42)+"%)";
const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const reg=[...document.querySelectorAll("[data-reg]")], slot=[...document.querySelectorAll("[data-slot]")], smc=[...document.querySelectorAll("[data-sm]")];
const POOL=[64,32,65536,228];
let thr=128, rpt=32, smk=0.5, N=0, end=1, t=0, need=[], lim=[];
function calc(){
  const w=Math.ceil(thr/32), rw=Math.ceil(rpt/8)*8*32;
  need=[w,1,rw*w,smk+1];
  lim=[Math.floor(64/w),32,Math.floor(65536/(rw*w)),Math.floor(228/(smk+1))];
  N=Math.min(...lim); end=N+1.6;
  const first=[...lim.keys()].filter(i=>lim[i]===N);
  const nm=["warp 槽位","CTA 槽位","寄存器","SMEM"];
  readout.textContent="驻留 "+N+" 个 CTA，共 "+(N*w)+" 个 warp（occupancy "+Math.round(100*N*w/64)+"%）\n"+(first.length>1?"同时满的是：":"先满的是：")+first.map(i=>nm[i]).join("、");
  $("tIn").max=String(end); t=Math.min(t,end);
  $("thrO").textContent=thr; $("rptO").textContent=rpt; $("smO").textContent=smk;
  let tl=""; const TX=(x)=>TL0+(TL1-TL0)*x/Math.max(end,8);
  for(let n=0;n<N;n++) tl+='<rect x="'+TX(n).toFixed(1)+'" y="'+(TY0+2)+'" width="'+Math.max(2,TX(n+0.8)-TX(n)).toFixed(1)+'" height="14" fill="'+col(n)+'"/>';
  tl+='<rect class="rej" x="'+TX(N).toFixed(1)+'" y="'+(TY0+2)+'" width="'+Math.max(4,TX(N+0.8)-TX(N)).toFixed(1)+'" height="14"/>';
  $("tl").innerHTML=tl; window.TX=TX;
}

function narrate(){ const n=document.getElementById("stepN"), s=document.getElementById("stepT"); const k=Math.floor(t);
  const nm=["warp 槽位","CTA 槽位","寄存器","SMEM"];
  if(t<1e-9 && k===0){ n.textContent=""; s.textContent="按播放，或拖动时间"; return; }
  if(k<N){ n.textContent="第 "+(k+1)+" 步"; s.textContent="第 "+(k+1)+" 个 CTA 进驻，算 W 的一行。代价："+need[0]+" 个 warp 槽位、1 个 CTA 槽位、"+need[2].toLocaleString()+" 个寄存器、"+need[3]+" KiB SMEM（含系统保留 1 KiB）"; return; }
  const first=[...lim.keys()].filter(i=>lim[i]===N).map(i=>nm[i]).join("、");
  n.textContent="第 "+(N+1)+" 步"; s.textContent="第 "+(N+1)+" 个 CTA 放不下："+first+"已经用完。它要等前面某个 CTA 做完才能进来"; }
function show(){
  const n=Math.min(N,Math.floor(t)); const w=need[0], cellsW=need[2]/w/256;
  // hardware
  slot.forEach(e=>e.style.fill="none"); reg.forEach(e=>e.style.fill="none"); smc.forEach(e=>e.style.fill="none");
  const usedSlots=[0,0,0,0], usedRegs=[0,0,0,0];
  for(let c=0;c<n;c++){ for(let j=0;j<w;j++){ const s=(c*w+j)%4; if(usedSlots[s]<16){ slot[s*16+usedSlots[s]].style.fill=col(c); usedSlots[s]++; }
      for(let q=0;q<cellsW;q++){ if(usedRegs[s]<64){ reg[s*64+usedRegs[s]].style.fill=col(c); usedRegs[s]++; } } } }
  let sm0=0; for(let c=0;c<n;c++){ const a=Math.round(sm0/4), b=Math.round((sm0+need[3])/4); for(let i=a;i<Math.min(b,57);i++) smc[i].style.fill=col(c); sm0+=need[3]; }
  // algorithm rows
  let ar=""; const show_=Math.min(Math.max(N+1,8),32), rw_=(640-AX-20)/show_;
  for(let c=0;c<show_;c++){ const x=AX+c*rw_; const on=c<n, rej=(c===N&&t>=N);
    ar+='<rect '+(on?'fill="'+col(c)+'"':(rej?'class="rej"':'class="wrow"'))+' x="'+(x+1).toFixed(1)+'" y="'+AY+'" width="'+(rw_-2).toFixed(1)+'" height="22"/>'; }
  ar+='<text class="tn" x="'+AX+'" y="'+(AY+38)+'">每格是一个 CTA（W 的一行）；有颜色 = 已进驻这个 SM，斜线 = 放不下，要等前面的 CTA 做完</text>';
  $("algR").innerHTML=ar;
  // pools
  let sg="", fl=""; for(let p=0;p<4;p++){ const per=need[p]/POOL[p]*(BX1-BX0); for(let c=0;c<n;c++) sg+='<rect x="'+(BX0+c*per).toFixed(1)+'" y="'+(BY0+p*24+2)+'" width="'+Math.max(0.6,per-0.6).toFixed(1)+'" height="14" fill="'+col(c)+'"/>';
    if(t>=N && lim[p]===N){ fl+='<rect class="fullb" x="'+BX0+'" y="'+(BY0+p*24)+'" width="'+(BX1-BX0)+'" height="18"/><text class="fullt" x="'+(BX1+6)+'" y="'+(BY0+p*24+13)+'">先满</text>'; } }
  $("segs").innerHTML=sg; $("full").innerHTML=fl;
  $("clipR").setAttribute("width",(TX(Math.min(t,end))-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(Math.min(t,end)).toFixed(1)+" "+(TY0-4)+"V"+(TY0+22)); $("tIn").value=String(t); narrate();
}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*4); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ setPlay(false); t=+$("tIn").value; show(); });
const upd=()=>{ thr=+$("thrI").value; rpt=+$("rptI").value; smk=+$("smI").value; calc(); t=0; hold=0; setPlay(!still); if(still){t=end;show();} };
["thrI","rptI","smI"].forEach(id=>$(id).addEventListener("input",upd));
document.querySelectorAll("[data-pre]").forEach(b=>b.addEventListener("click",()=>{ const [a,b2,c]=b.dataset.pre.split(","); $("thrI").value=a; $("rptI").value=b2; $("smI").value=c; upd(); }));
const q=new URLSearchParams(location.search);
if(q.has("thr")) $("thrI").value=q.get("thr"); if(q.has("r")) $("rptI").value=q.get("r"); if(q.has("s")) $("smI").value=q.get("s");
thr=+$("thrI").value; rpt=+$("rptI").value; smk=+$("smI").value; calc();
t = q.has("t") ? +q.get("t") : (still ? end : 0); show(); if(playing) start(); else play.textContent="播放";
</script><script>(function(){function s(){var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);parent.postMessage({figH:h},"*");}window.addEventListener("load",s);new ResizeObserver(s).observe(document.body);})();</script></body></html>
