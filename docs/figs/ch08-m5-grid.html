<!doctype html><html lang="zh-Hans"><head><script>(()=>{
// Shared figure component. One file for both editions: strings follow <html lang>. Spec: UX_REDESIGN_SPEC_v2.md.
// Figures that declare FIG.timeline(...) get the step track, variant cards, ghost timeline and 1:1 plate panels.
// Figures that do not declare it keep the previous controls (legacy path at the end of this file).
const ZH=/^zh/i.test(document.documentElement.lang||""), LANG=ZH?"zh":"en";
const STR={"en": {"track.counter": "Step {k} of {M}", "track.counter_group": "Step {k} of {M} · {group}", "track.label": "Figure steps", "track.valuetext": "Step {k} of {M}: {title}", "track.preview": "Step {k}: {title}", "step.prev": "Previous step", "step.next": "Next step", "play.play": "Play", "play.pause": "Pause", "play.replay": "Replay", "hint.track": "Use ‹ › or Play, or drag the track or timeline; use ← → on the track.", "hint.track_reduced": "Use ‹ ›, or drag the track or timeline; use ← → on the track.", "end.note": "Reached the final step.", "pan.hint": "Swipe the diagram sideways to see all of it.", "strip.label": "Result across {param} (current value marked)", "strip.not_measured": "Not measured separately", "param.value": "{value} {unit}", "legacy.prev": "◀ Previous", "legacy.next": "Next ▶", "legacy.speed": "Speed"}, "zh": {"track.counter": "第 {k} / {M} 步", "track.counter_group": "第 {k} / {M} 步 · {group}", "track.label": "本图步骤", "track.valuetext": "第 {k} / {M} 步：{title}", "track.preview": "第 {k} 步：{title}", "step.prev": "上一步", "step.next": "下一步", "play.play": "播放", "play.pause": "暂停", "play.replay": "重播", "hint.track": "点 ‹ › 或播放，也可拖步骤条或时间线；选中步骤条按 ← →。", "hint.track_reduced": "点 ‹ ›，也可拖步骤条或时间线；选中步骤条按 ← →。", "end.note": "已到最后一步。", "pan.hint": "左右滑动图形，查看完整画面。", "strip.label": "随 {param} 变化的结果（已标出当前值）", "strip.not_measured": "未单测", "param.value": "{value} {unit}", "legacy.prev": "◀ 上一步", "legacy.next": "下一步 ▶", "legacy.speed": "速度"}};
const t=(id,v)=>{ const s=STR[LANG][id]; return s==null?"":(v?s.replace(/\{(\w+)\}/g,(m,k)=>v[k]!=null?v[k]:m):s); };
const $=id=>document.getElementById(id);
const R=window.requestAnimationFrame.bind(window), CAF=window.cancelAnimationFrame.bind(window);
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const D={};
const steps=()=>D.tl.steps(), endT=()=>D.tl.end(), rate=()=>typeof D.tl.rate==="function"?D.tl.rate():D.tl.rate;

const fmt=n=>(+n).toLocaleString("en-US");
window.FIG={ timeline:o=>{D.tl=o;}, variants:o=>{D.variants=o;}, param:o=>{D.param=o;}, t,
  stepLabel(){ if(!D.tl||!$("tIn")) return ""; const k=idx(+$("tIn").value), M=steps().length, g=grp(k);
    return g?t("track.counter_group",{k:k+1,M,group:steps()[k].group}):t("track.counter",{k:k+1,M}); } };

const CSS=`
.fig-prev,.fig-next,.fig-play{font:inherit;color:var(--anatomy-strong);background:var(--anatomy-card);border:1px solid var(--anatomy-lo);border-radius:8px;cursor:pointer;min-width:44px;height:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center}
.fig-prev,.fig-next{font-size:22px;line-height:1;flex:none}
.fig-prev:disabled,.fig-next:disabled{opacity:.35;cursor:default}
.fig-play{font-size:14px;font-weight:600;flex:none}
.fig-prev:focus-visible,.fig-next:focus-visible,.fig-play:focus-visible,.fig-track:focus-visible,.fig-card:has(input:focus-visible),.fig-seg label:has(input:focus-visible){outline:2px solid var(--anatomy-blue);outline-offset:2px}
.nar .nh{align-items:center;flex-wrap:wrap}.nar .nh>span{flex:1 1 12em;min-width:0}
.fig-ctl{display:flex;gap:8px;align-items:center;margin:0 8px;position:relative}

.fig-segs{display:flex;gap:2px;width:100%}

.fig-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fig-tip{position:fixed;z-index:20;pointer-events:none;max-width:min(320px,90vw);padding:6px 10px;border-radius:6px;background:var(--anatomy-strong);color:var(--anatomy-card);font-size:12px;line-height:1.4}
.fig-ghost{opacity:.3;pointer-events:none}.fig-atend .fig-ghost{display:none}
.fig-variants,.fig-param{margin:0 0 12px}

.fig-card{flex:1 1 0;min-width:0;min-height:56px;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}

.fig-card .fig-n{font-weight:600}.fig-card .fig-o{font-size:12px;font-weight:500;color:var(--anatomy-text)}
.fig-card.is-on,.fig-seg label.is-on{box-shadow:var(--anatomy-lift);border-color:var(--anatomy-blue);border-left-width:3px}
.fig-seg{display:flex;flex-wrap:wrap;gap:8px}

.fig-seg label.fig-base{margin-right:8px}
.fig-strip{display:block;width:100%;height:90px;margin-top:4px}
.fig-strip .dot{fill:var(--anatomy-card);stroke:var(--anatomy-text);stroke-width:1.5}.fig-strip .dot.on{fill:var(--anatomy-blue);stroke:var(--anatomy-blue)}
.fig-strip .base{stroke:var(--anatomy-lo);stroke-width:1}
.fig-strip .hit{fill:transparent;cursor:pointer}.fig-strip .nm,.fig-strip .vv{text-anchor:middle}.fig-strip .nm{font-size:12px;fill:var(--anatomy-muted)}.fig-strip .vv{font-size:10.5px;fill:var(--anatomy-text)}.fig-strip .vv.on{fill:var(--anatomy-strong);font-weight:600}.fig-strip .vy,.fig-strip .vz{text-anchor:start;fill:var(--anatomy-muted)}.fig-strip .vz.on{fill:var(--anatomy-strong)}
.fig-sval{font-size:12px;font-weight:500;color:var(--anatomy-text);margin:0 2px}
@media(max-width:600px){
.fig-cards{overflow-x:auto;scroll-snap-type:x mandatory}.fig-card{flex:0 0 78%;scroll-snap-align:start}
}
.fig-boot *{transition:none!important}
@media(prefers-reduced-motion:reduce){.fig-segs i{transition:none}}
`;


// Every figure page, migrated or not: plate panels at 1:1 on a phone, and plate corners that flow instead of overlapping.
const PANCSS=`
.fig-pan-hint{margin:6px 2px;font-size:12px;font-weight:500;color:var(--anatomy-muted)}
@media(max-width:600px){
.fig-pan{overflow-x:auto}.fig-pan>svg{min-width:var(--vbw)}
.iso-plate{display:flex;flex-direction:column;padding-top:16px!important;padding-bottom:16px!important}
.iso-plate>*{min-width:0}
.iso-plate-corners{display:contents}
.iso-plate-corner,.iso-plate-corner[data-corner]{position:static!important;max-width:none!important;white-space:normal!important;text-align:left!important}
.iso-plate-corner[data-corner="readout"]{white-space:pre-line!important}
.iso-plate-corner:empty{display:none}
.iso-plate-corner[data-corner="title"]{margin:4px 0 8px;line-height:1.4}
.iso-plate-corner[data-corner="readout"],.iso-plate-corner[data-corner="hint"]{order:1;margin-top:8px;font-size:12px;line-height:1.5}
}
`;
function pan(){
  const st=document.createElement("style"); st.textContent=PANCSS; document.head.appendChild(st);
  document.querySelectorAll(".iso-plate").forEach(plate=>{
    const panels=[...plate.querySelectorAll("svg[viewBox]")].filter(s=>!s.parentElement.closest("svg")).map(s=>{ const w=document.createElement("div"); w.className="fig-pan"; s.before(w); w.append(s); s.style.setProperty("--vbw",s.viewBox.baseVal.width+"px"); return w; });
    if(!panels.length) return;
    const hint=document.createElement("p"); hint.className="fig-pan-hint"; hint.textContent=t("pan.hint"); hint.hidden=true; panels[0].before(hint);
    const update=()=>{ const over=panels.find(w=>w.scrollWidth>w.clientWidth); hint.hidden=!over; if(over) over.before(hint); };
    const ro=new ResizeObserver(update); panels.forEach(w=>ro.observe(w));
  });
}

function mount(){
  const tin=$("tIn"), stepN=$("stepN"), card=stepN.closest(".nar"), plate=stepN.closest(".iso-plate"), figure=plate.closest(".iso-figure")||plate;
  const stepQ=+tin.step||0.01, lo=+tin.min||0, hi=()=>+tin.max;
  window.requestAnimationFrame=R;
  const st=document.createElement("style"); st.textContent=CSS; document.head.appendChild(st);
  const el=(tag,cls,html)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.textContent=html; return e; };
  const hide=e=>{ e.style.display="none"; const c=e.closest(".ctl"); if(c&&[...c.children].every(x=>x.style.display==="none"||x.hidden)) c.style.display="none"; };
  const clampK=k=>Math.max(0,Math.min(steps().length-1,k));
  let quiet=false, raf=0, anim=null, lastK=0, cal=[], marks=[], uid=0;

  // ---- clock: the only owner of time
  const setT=v=>{ tin.value=String(v); tin.dispatchEvent(new Event("input",{bubbles:true})); };
  const curK=()=>idx(+tin.value);
  const settled=k=>{ const S=steps(); if(k>=S.length-1) return endT(); let v=S[k+1].t-1e-6; v=lo+Math.floor((v-lo)/stepQ+1e-9)*stepQ; return +Math.max(v,S[k].t).toFixed(6); };

    raf=R(tick); sync(); }
  const jump=k=>{ halt(); setT(settled(clampK(k))); };
  const baseK=()=>anim&&anim.kind==="step"?anim.k:curK();
  const go=(k,animate)=>{ k=clampK(k); if(animate&&!RM&&!anim&&k===curK()+1) run(settled(k),rate(),"step",()=>follow(curK()),k); else jump(k); };
  const atEnd=()=>+tin.value>=endT()-1e-9;
  function play(){ if(anim&&anim.kind==="play"){ halt(); sync(); return; }
    if(atEnd()) jump(0); live.textContent=""; run(endT(),rate()*0.25,"play",()=>{ live.textContent=t("end.note"); sync(); }); }

  // ---- step track: buttons in the card header, control row after the card
  const prev=el("button","fig-prev","‹"), next=el("button","fig-next","›");
  prev.type=next.type="button"; prev.setAttribute("aria-label",t("step.prev")); next.setAttribute("aria-label",t("step.next"));
  stepN.before(prev); stepN.after(next);
  const ctl=el("div","fig-ctl"), playB=el("button","fig-play"), track=el("div","fig-track"), segs=el("div","fig-segs"), live=el("div","fig-live"), tip=el("div","fig-tip");
  playB.type="button"; tip.hidden=true; live.setAttribute("aria-live","polite");
  track.setAttribute("role","slider"); track.tabIndex=0; track.setAttribute("aria-label",t("track.label")); track.setAttribute("aria-valuemin","1");

  const hint=el("p","fig-hint",RM?t("hint.track_reduced"):t("hint.track"));
  card.after(ctl); ctl.after(hint); document.body.append(tip);
  const showTip=(text,x,y)=>{ tip.textContent=text; tip.hidden=false; tip.style.left=Math.max(4,Math.min(x+12,innerWidth-tip.offsetWidth-4))+"px"; tip.style.top=(y+16)+"px"; };
  const stepTitle=k=>steps()[k].title||"";
  const preview=(k,x,y)=>{ segs.querySelectorAll("i").forEach((s,i)=>s.classList.toggle("hot",i===k)); if(k==null||k<0){ tip.hidden=true; return; } showTip(t("track.preview",{k:k+1,title:stepTitle(k)}),x,y); };

  const follow=(k,curOnly)=>{ const into=(w,r)=>{ if(!w||w.scrollWidth<=w.clientWidth) return; const b=w.getBoundingClientRect(), L=b.left+24, R=b.right-24;
      const d=(r.right-r.left>R-L||r.left<L)?r.left-L:r.right>R?r.right-R:0;
      if(d) w.scrollTo({left:w.scrollLeft+d,behavior:RM||curOnly?"instant":"smooth"}); };
    if($("cur")) into($("cur").closest(".fig-pan"),$("cur").getBoundingClientRect());
    if(!curOnly) marks.filter(m=>m.k===k).forEach(m=>{ const e=m.n||m.g; into(e.closest(".fig-pan"),e.getBoundingClientRect()); }); };
  function sync(){ if(quiet) return; const S=steps(), M=S.length, k=curK(), moved=k!==lastK; lastK=k;
    if(segs.children.length!==M){ segs.replaceChildren(...S.map(()=>document.createElement("i"))); }
    [...segs.children].forEach((s,i)=>{ s.classList.toggle("cur",i===k); s.classList.toggle("past",i<k); });

    const lab=FIG.stepLabel(); if(stepN.textContent!==lab) stepN.textContent=lab;
    playB.textContent=anim&&anim.kind==="play"?t("play.pause"):atEnd()?t("play.replay"):t("play.play");
    document.documentElement.classList.toggle("fig-atend",atEnd());
    if(!(sk&&sk.drag)){ if(moved) follow(k); else if(anim) follow(k,true); } }
  const segAt=x=>{ const r=track.getBoundingClientRect(), M=steps().length; return Math.max(0,Math.min(M-1,Math.floor((x-r.left)/r.width*M))); };
  prev.addEventListener("click",()=>go(baseK()-1,false)); next.addEventListener("click",()=>go(baseK()+1,true)); playB.addEventListener("click",play);
  let drag=false;
  track.addEventListener("pointerdown",e=>{ if(e.button!==0) return; drag=true; track.setPointerCapture(e.pointerId); const j=segAt(e.clientX); jump(j); });
  track.addEventListener("pointermove",e=>{ if(drag){ const j=segAt(e.clientX); if(j!==curK()) jump(j); } else if(e.pointerType==="mouse") preview(segAt(e.clientX),e.clientX,e.clientY); });
  track.addEventListener("pointerup",()=>{ drag=false; }); track.addEventListener("pointercancel",()=>{ drag=false; });
  track.addEventListener("pointerleave",()=>{ if(!drag) preview(null); });
  track.addEventListener("keydown",e=>{ const k=baseK(), M=steps().length, g=grp(k); let h=true;
    if(e.key==="ArrowRight"){ if(k<M-1) go(k+1,true); } else if(e.key==="ArrowLeft"){ if(k>0) go(k-1,false); }
    else if(e.key==="Home") jump(0); else if(e.key==="End") jump(M-1);
    else if(e.key==="PageDown"&&steps().some((s,i)=>grp(i))){ const a=g?g.b+1:k+1; if(a<M) go(a,false); }
    else if(e.key==="PageUp"&&steps().some((s,i)=>grp(i))){ const a=g?g.a-1:k-1; if(a>=0){ const h2=grp(a); go(h2?h2.a:a,false); } }
    else h=false;
    if(h) e.preventDefault(); });

  const tlSvg=$("cur")?$("cur").ownerSVGElement:null;
  const visit=(fn)=>{ const keep=+tin.value; quiet=true; try{ fn(); } finally { quiet=false; setT(keep); } };
  function calibrate(){ if(!tlSvg) return; cal=[]; visit(()=>{ const sr=tlSvg.getBoundingClientRect();
    const ts=[...new Set([lo,...steps().map(s=>s.t).filter(v=>v>=lo),endT()])].sort((a,b)=>a-b);
    ts.forEach(v=>{ setT(v); const r=$("cur").getBoundingClientRect(); cal.push([v,(r.left+r.width/2-sr.left)/sr.width]); }); }); }
  const timeAt=fx=>{ if(cal.length<2) return lo; if(fx<=cal[0][1]) return cal[0][0]; for(let i=1;i<cal.length;i++){ if(fx<=cal[i][1]||i===cal.length-1){ const [t0,x0]=cal[i-1],[t1,x1]=cal[i]; return x1>x0?t0+Math.max(0,Math.min(1,(fx-x0)/(x1-x0)))*(t1-t0):t1; } } return cal[cal.length-1][0]; };
  const MARK_SEL="#focus > *, #algO > *";
  function surveyMarks(){ marks=[]; visit(()=>{ steps().forEach((s,k)=>{ setT(settled(k));
    document.querySelectorAll(MARK_SEL).forEach(m=>{ const g=m.parentNode; try{ const b=m.getBBox(); marks.push({g,b,k}); }catch(_){} });
    document.querySelectorAll(".nd.on").forEach(n=>marks.push({n,k})); }); }); }
  function stepsAt(e){ const ks=new Set(), nd=e.target.closest&&e.target.closest(".nd");
    marks.forEach(m=>{ if(m.n){ if(nd===m.n) ks.add(m.k); return; } const ctm=m.g.getScreenCTM(); if(!ctm) return; const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(ctm.inverse()), pad=22/Math.max(ctm.a,0.01);
      if(p.x>=m.b.x-pad&&p.x<=m.b.x+m.b.width+pad&&p.y>=m.b.y-pad&&p.y<=m.b.y+m.b.height+pad) ks.add(m.k); });

    const k=curK(), i=c.indexOf(k); jump(i<0?c[0]:c[(i+1)%c.length]); });

    const build=()=>{ obs.disconnect(); tlSvg.querySelectorAll(".fig-ghost").forEach(e=>e.remove());

  const claimed=D.param&&D.param.group==="mode";
  const modesBox=modeRadios.length?modeRadios[0].closest(".modes")||modeRadios[0].parentNode:null;
  const switched=aligned=>{ const kp=lastK; halt(); calibrate(); surveyMarks(); setT(settled(aligned?clampK(kp):0)); follow(curK()); };
  const markOn=(radios)=>radios.forEach(r=>r.closest("label").classList.toggle("is-on",r.checked));

    const v=D.variants||{kind:"topics",aligned:false}, id="fig-ax"+(++uid), box=el("div","fig-variants"), cards=el("div","fig-cards");

    modeRadios.forEach((r,i)=>{ const l=r.closest("label"), name=l.textContent.trim().replace(/^\d+\.\s*/,""); l.className="fig-card"; l.replaceChildren(r,el("span","fig-n",name));

    box.append(cards); figure.before(box); if(modesBox) hide(modesBox); markOn(modeRadios);

an class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌈(</span><span class="mord">8</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">32</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">127</span><span class="mclose">)</span><span class="mord">/128</span><span class="mclose">⌉</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌈</span><span class="mord">135</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">136/128</span><span class="mclose">⌉</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">1</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">056</span></span></span></span>，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>=</mo><mn>16,384</mn></mrow><annotation encoding="application/x-tex">T = 16{,}384</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">16</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">384</span></span></span></span></template><template id="c1b_0_i">所有词元的 8 个槽位都落在本卡：<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>8</mn><mi>T</mi></mrow><annotation encoding="application/x-tex">8T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord">8</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span> 个命中对，再加每个专家最多 127 行填充；分块高度 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>B</mi><mi>M</mi><mo>=</mo><mn>128</mn></mrow><annotation encoding="application/x-tex">BM = 128</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">128</span></span></span></span></template><template id="c1b_0_o">1,056 个 128 行的行分块（每块再按列切分派给 CTA）</template><template id="c1b_0_x">每个 CTA 进场后查自己的行分块有没有活</template><template id="c1b_0_c">要预先分配一块固定大小的缓冲显存，供 CUDA Graph 每次重放复用</template><template id="c1b_1_t">统计下来，77% 的行分块没有活，对应的 CTA 一进场就直接退出</template><template id="c1b_1_f">每卡平均总有 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>8</mn><mi>T</mi><mi mathvariant="normal">/</mi><mn>8</mn><mo>=</mo><mi>T</mi></mrow><annotation encoding="application/x-tex">8T / 8 = T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">8</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord">/8</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span> 个命中对（与路由是否偏斜无关）</template><template id="c1b_1_i">1,056 个行分块</template><template id="c1b_1_o">约 77% 空退出，约 23%（约 243 个行分块）有活（格子按 77% 画，是示意）</template><template id="c1b_1_x">按本卡平均命中对个数（约 T）的 2 倍截断行分块</template><template id="c1b_1_c">空块对应的 CTA 不干活，却占调度</template><template id="c1b_2_t">把主网格截断在 288 个行分块，万一超出上限则交由主 kernel 末尾的循环接管</template><template id="c1b_2_f"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>n</mi><mtext>cap</mtext></msub><mo>=</mo><mo stretchy="false">⌈</mo><mo stretchy="false">(</mo><mn>2</mn><mi>T</mi><mo>+</mo><mn>32</mn><mo>×</mo><mn>127</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>128</mn><mo stretchy="false">⌉</mo><mo>=</mo><mo stretchy="false">⌈</mo><mn>36,832</mn><mi mathvariant="normal">/</mi><mn>128</mn><mo stretchy="false">⌉</mo><mo>=</mo><mn>288</mn></mrow><annotation encoding="application/x-tex">n_{\text{cap}} = \lceil (2T + 32 \times 127) / 128 \rceil = \lceil 36{,}832 / 128 \rceil = 288</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">cap</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌈(</span><span class="mord">2</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">32</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">127</span><span class="mclose">)</span><span class="mord">/128</span><span class="mclose">⌉</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌈</span><span class="mord">36</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">832/128</span><span class="mclose">⌉</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">288</span></span></span></span></template><template id="c1b_2_i">按本卡平均命中对个数（约 T）的 2 倍作偏斜余量，再加每个专家最多 127 行填充</template><template id="c1b_2_o">主网格上限设为 288 个行分块（gemm2 共 288 × 32 = 9,216 个 CTA）；超出上限的分块由 gemm1 与 gemm2 各自的尾部循环处理</template><template id="c1b_2_x">只在 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>&gt;</mo><mn>3,012</mn></mrow><annotation encoding="application/x-tex">T &gt; 3{,}012</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7224em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">3</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">012</span></span></span></span> 打开</template><template id="c1b_2_c">gemm1 2,905 → 2,831 µs，gemm2 1,406 → 1,376 µs（单层快 1.07%）。测试里没有溢出。“2 hnormal">c</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">264</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">528</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner">…</span></span></span></span> 块</template><template id="c2b_0_i">9,216 个分块（288 个行分块 × 32 个 128 列分块）</template><template id="c2b_0_o">每个 CTA 一串固定的分块</template><template id="c2b_0_x">各分块完成时间参差不齐，固定步长没法把活从慢 SM 挪给快 SM</template><template id="c2b_0_c">kernel 内 SM 空闲 60.3 µs（剖析读数）；挂在后面的归一化 kernel 在 PDL 等待里空等约 118 µs</template><template id="c2b_1_t">改成 9,216 个普通 CTA：硬件块调度器把下一块派给最先空出来的 SM</template><template id="c2b_1_f"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>288</mn><mo>×</mo><mn>32</mn><mo>=</mo><mn>9,216</mn></mrow><annotation encoding="application/x-tex">288 \times 32 = 9{,}216</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">288</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">32</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">9</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">216</span></span></span></span> 个 CTA，一个 CTA 一个分块</template><template id="c2b_1_i">9,216 个分块</template><template id="c2b_1_o">最先空出来的 SM 先拿到下一块</template><template id="c2b_1_x">任务长、数量多时，硬件块调度器就是零屏障的动态领活</template><template id="c2b_1_c">kernel 内 SM 空闲压到 18.6 µs；每个 CTA 都要重新进场，每块的启动开销没有单独测</template><template id="c2b_2_t">总代价：SM 空闲 60.3 → 18.6 µs</template><template id="c2b_2_f"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>60.3</mn><mo>−</mo><mn>18.6</mn><mo>=</mo><mn>41.7</mn><mtext> </mtext><mi>μ</mi><mtext>s</mtext></mrow><annotation encoding="application/x-tex">60.3 - 18.6 = 41.7\ \mu\text{s}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">60.3</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">18.6</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">41.7</span><span class="mspace"> </span><span class="mord mathnormal">μ</span><span class="mord text"><span class="mord">s</span></span></span></span></span> 空闲</template><template id="c2b_2_i">同一个 gemm2，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>=</mo><mn>16,384</mn></mrow><annotation encoding="application/x-tex">T = 16{,}384</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">16</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">384</span></span></span></span></template><template id="c2b_2_o">gemm2 单个 kernel 1,468.96 → 1,443.17 µs，省 25.8 µs（另一次测量）</template><template id="c2b_2_x">kernel 内用原子加动态领活，在这个 kernel 上没有测</template><template id="c2b_2_c">空闲差 41.7 µs 与 kernel 耗时差 25.8 µs 不一致，原因未查明</template></main><script type="module">const CARDS_N={"1b":3,"2b":3};
const PAL={"k1":"#3e63dd","k2":"#d9822b","k3":"#2f9e6b","k4":"#8a5cd0","kr":"#d64545","kw":"#9aa0a6","kd":"#2a2a2e","kl":"#cfd6f5","km":"#8ea2ea"};

const rect=(x,y,w,h,c,extra)=>'<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+c+'"'+(extra||"")+'/>';
const txt=(x,y,s,cls,a)=>'<text class="'+(cls||"tn")+'" x="'+x+'" y="'+y+'"'+(a?' text-anchor="'+a+'"':"")+'>'+s+'</text>';
// ---- schematic simulation for mode 2 (tile times vary; same 9216 tiles for both ways)
let seed=7; const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
const DUR=Array.from({length:9216},()=>0.5+1.5*Math.pow(rnd(),3));
function simulate(){
  const Fp=new Float64Array(264); DUR.forEach((d,i)=>{ Fp[i%264]+=d; });
  const smP=[...Array(132).keys()].map(s=>Math.max(Fp[2*s],Fp[2*s+1]));
  const Fd=new Float64Array(264); for(let i=0;i<9216;i++){ let j=0; for(let s=1;s<264;s++) if(Fd[s]<Fd[j]) j=s; Fd[j]+=DUR[i]; }
  const smD=[...Array(132).keys()].map(s=>Math.max(Fd[2*s],Fd[2*s+1]));
  const norm=(a)=>{ const m=Math.max(...a); return a.map(v=>10*v/m); };
  return {p:norm(smP),d:norm(smD)}; }
const SIM=simulate();
const TOPY=40;
function gridCells(x0,y0,cols,n,pitch,size,colorOf){ let h=""; for(let i=0;i<n;i++){ const c=i%cols, r=(i-c)/cols; h+=rect(x0+c*pitch,y0+r*pitch,size,size,colorOf(i),' stroke="#9aa0a6" stroke-width=".4"'); } return h; }

    return {ro:"网格行分块：1,056 → 288（超出上限的分块由主 kernel 尾部循环处理）\n空退出比例：77%\nSM 空闲时间：本模式不涉及（看模式 2）", end:13, tend:13, still:12, tlTitle:"左：改前的行分块；右：改后的行分块。横轴只表示先后，长度示意", axis:[[0,"改前"],[8,"改后"]],
      rows:["有活（约 23%）","空退出（约 77%）","截断后：主网格"],

      init(){ $("algT").textContent="算法：128 行的词元行分块上限（每次重放都用录图时定下的上限）";

      paint(t){ let h=txt(18,18,"原上限：1,056 个行分块（每格一个）","lab2")+txt(300,18,"截断后：288 个行分块","lab2");

    const order=(a)=>a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]);
    return {ro:"网格 CTA：264（持久）→ 9,216（普通）\n空退出比例：不涉及\nSM 空闲时间：60.3 → 18.6 µs（剖析读数）", end:10, tend:10, still:9.8, curH:200, steps,

      flat(){ const f=$("flat"), H=TY0+200+34; f.setAttribute("viewBox","0 0 640 "+H);
        let h='<text class="lab2" x="'+TL0+'" y="'+(TY0-10)+'">横轴只表示先后，红色宽度是示意（132 个 SM 按结束先后排）</text>';
        const lbl=(y0,title)=>txt(TL0-8,y0+44,title[0],"rl")+txt(TL0-8,y0+58,title[1],"rl")+'<rect class="row" x="'+TL0+'" y="'+y0+'" width="'+(TL1-TL0)+'" height="92"/>';
        const panel=(y0,title,fin)=>{ let g="";

        f.innerHTML=h; },
