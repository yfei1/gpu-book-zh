  play.after(box); setSpeed(SPEEDS.includes(speed)?speed:0.25);
  const isPlaying=()=>play.textContent.trim()==="暂停";

  const setT=v=>{ tIn.value=String(v); tIn.dispatchEvent(new Event("input")); };

  const stepOf=()=>{ const m=(stepN&&stepN.textContent||"").match(/(\d+)/); return m?+m[1]:0; };
  const RING=".fr, #focus circle", MARK2="#algO *, .ao, .cur"; let useRing=null;
  let map=null, mapKey="";

  const centers=()=>{ const out=[]; document.querySelectorAll(useRing===false?MARK2:RING).forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width||r.height) out.push([r.left+r.width/2, r.top+r.height/2]); }); return out; };
  const stripBoxes=()=>{ const out=[]; document.querySelectorAll("#algO *, .ao, .sb.on, text.st.on").forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width&&r.height) out.push([r.left,r.top,r.right,r.bottom]); }); return out; };

  h+='<clipPath id="clipT"><rect id="clipR" x="'+TL0+'" y="'+(TY0-4)+'" width="0" height="'+(R*24+8)+'"/></clipPath><g clip-path="url(#clipT)">';
  sc.segs.forEach(s=>{ const x=TX(s.a), w=Math.max(1,TX(s.b)-x-1), yy=TY0+s.r*24+2;
    h+='<rect fill="'+s.col+'" x="'+x.toFixed(1)+'" y="'+yy+'" width="'+w.toFixed(1)+'" height="14"/>';
    if(s.txt && w>12) h+='<text class="sn" x="'+(x+w/2).toFixed(1)+'" y="'+(yy+10.5)+'">'+s.txt+'</text>'; });
  h+='</g><path id="cur" class="cur" d=""/>'; f.innerHTML=h; }
function regs(){ const a=sc.regs(t); return a; }
function setScene(){ sc=SCENE(way); end=sc.T; buildFlat(); $("tIn").max=String(end); t=Math.min(t,end);
  document.querySelectorAll("[data-way]").forEach(e=>{ e.style.display=(e.dataset.way===String(way)?"":"none"); }); }
function chips(list,col){ let s=""; list.forEach(c=>{ s+='<circle class="dot" cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="4" fill="'+col+'"/>'; }); return s; }
function show(){
  const g=sc.regs(t), rp=g.rp, rc=g.rc, nP=128*rp, nC=128*rc, alloc=nP+2*nC, free=Math.max(0,CAP-alloc), over=Math.max(0,alloc-CAP);
  let b=poly(BAR.x0,xr(CAP),BAR.y0,BAR.y1,BAR.z-0.1).replace(/^/,'<path class="cellp" d="')+'"/>';
  const seg=(a,c,cls)=>c>a?'<path class="'+cls+'" d="'+poly(xr(a),xr(c),BAR.y0,BAR.y1,BAR.z)+'"/>':"";
  b+=seg(0,nP,"rP")+seg(nP,nP+nC,"rC1")+seg(nP+nC,alloc,"rC2");
  if(free>0) b+=seg(alloc,CAP,"rfree");
  if(over>0) b+='<path class="rOv" d="'+poly(xr(CAP),xr(alloc),BAR.y0-1,BAR.y1+1,BAR.z+0.4)+'"/>';
  b+='<path class="rcap" d="M'+Pt(xr(CAP),BAR.y0-6,BAR.z+0.5).map(v=>v.toFixed(1)).join(" ")+'L'+Pt(xr(CAP),BAR.y1+6,BAR.z+0.5).map(v=>v.toFixed(1)).join(" ")+'"/>';
  $("pool").innerHTML=b;
  [["tP",rp],["tC1",rc],["tC2",rc]].forEach(([id,v])=>{ $(id).textContent="每线程 "+Math.round(v)+" 个寄存器"; });
  $("tot").textContent="已分出 "+fmt(alloc)+" / "+fmt(CAP);
  let dots="";
  if(sc.moves){ sc.moves.forEach(m=>{ if(t>=m.a&&t<=m.b){ const p=(t-m.a)/(m.b-m.a), L=[];
      const fz=Pt(xr((Math.min(alloc,CAP)+CAP)/2),(BAR.y0+BAR.y1)/2,BAR.z+2);
      for(let i=0;i<6;i++){ const f=Math.max(0,Math.min(1,p*1.5-i*0.1)); if(f<=0||f>=1) continue;
        L.push(m.dir==="out"?lerp(m.from[0],fz,f):lerp(fz,m.to[i%m.to.length],f)); }
      dots+=chips(L,m.col); } }); }
  $("dots-sm").innerHTML=dots;
  const al=sc.algo; let a='<text class="lab2" x="'+AX+'" y="16">'+al.title+'</text>'; const n=al.cells.length, w=(640-AX-14)/n;
  al.cells.forEach((c,i)=>{ const x=AX+i*w, v=i===0?rp:rc;
    a+='<rect fill="'+c.col+'" stroke="#222" stroke-width=".8" x="'+(x+1).toFixed(1)+'" y="26" width="'+(w-2).toFixed(1)+'" height="22" rx="3"/>';
    a+='<text class="cn" x="'+(x+w/2).toFixed(1)+'" y="41" fill="#fff">'+c.lab+'</text><text class="tn" x="'+(x+w/2).toFixed(1)+'" y="62" text-anchor="middle">'+c.sub+" · 每线程 "+Math.round(v)+" 个"+'</text>'; });
  $("alg").innerHTML=a;
  let k=-1; for(let i=0;i<sc.steps.length;i++){ if(sc.steps[i].t<=t+1e-9) k=i; else break; }
  const nb=$("stepN"), st=$("stepT"), rw=$("stepR"); let f="";
  if(k<0){ nb.textContent=""; st.textContent="按播放，或拖动时间"; rw.innerHTML=""; } else { const e=sc.steps[k]; nb.textContent="第 "+(k+1)+" 步"; st.textContent=e.x;
    rw.innerHTML=[["公式",e.fm],["输入",e.in],["输出",e.out],["交给下一步",e.nx],["代价",e.c]].map(r=>'<dt'+(r[0]==="代价"?' class="cost"':'')+'>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join("");
    readout.textContent="合计 "+fmt(alloc)+(alloc>CAP?" > ":" ≤ ")+"65,536 · 剩余 "+(free>0||over===0?fmt(free):"−"+fmt(over))+"\n"+e.ro;
    if(e.f) f='<circle class="fr" cx="'+e.f[0]+'" cy="'+e.f[1]+'" r="'+(e.rr||10)+'"/>'+(e.n!=null?'<text class="fn" x="'+e.f[0]+'" y="'+(e.f[1]-(e.rr||10)-3)+'">'+e.n+'</text>':""); }
  $("focus-sm").innerHTML=f;
  const R=sc.rows.length; const cxp=TX(Math.min(t,end)); $("clipR").setAttribute("width",(cxp-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+cxp.toFixed(1)+" "+(TY0-4)+"V"+(TY0+R*24)); $("tIn").value=String(t); }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*end/14); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
$("g1").innerHTML=WAYS.map((o,i)=>'<label><input type="radio" name="mode" value="'+(i+1)+'"'+(i+1===way?" checked":"")+'>'+o+'</label>').join("");

$("g1").querySelectorAll("input").forEach(r=>r.addEventListener("change",()=>{ way=+r.value; again(); }));
const q=new URLSearchParams(location.search); way=+(q.get("w")||q.get("m")||1);
$("g1").querySelectorAll("input")[way-1].checked=true; setScene();
t = q.has("t") ? +q.get("t") : (still ? end*0.6 : 0); show(); if(playing) start(); else play.textContent="播放";
