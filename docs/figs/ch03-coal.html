    wh+=R(AX+c0*CW, AY+row*RH, Math.max(nc*CW, mode===1?3:CW), RH, on?"":"pend", ' fill="'+col(l)+'"');

  if(mode===1) for(let l=0;l<32;l++) yh+=R(AX+NC*CW+14, AY+l*RH, 8, RH, arrived.has(l)?"":"pend", ' fill="'+col(l)+'"');
  else yh+=R(AX+NC*CW+14, AY, 8, RH, arrived.size===32?"":"pend", ' fill="'+col(0)+'"');
  const n=Sx.length, perRow= n>16?16:n, BW=32, gap= mode===1?4:0, rowY=(i)=>SY0+Math.floor(i/perRow)*30;
  Sx.forEach(c=>{ const x0=SX0+(c.i%perRow)*(BW+gap+ (mode===1?1:0)), y0=rowY(c.i), on=t>=c.arr, sw=BW/16;
    sh+=R(x0,y0,BW,22,"sbox");
    if(mode===1){ sh+=R(x0+sw,y0,BW-sw,22,on?"waste":"waste pend"); sh+=R(x0,y0,sw,22,on?"":"pend",' fill="'+col(c.lanes[0])+'"'); }
    else c.lanes.forEach((l,j)=>{ const per=16/c.lanes.length; sh+=R(x0+j*per*sw,y0,per*sw,22,on?"":"pend",' fill="'+col(l)+'"'); });
    sh+=R(x0,y0,BW,22,"sedge");
  });
  if(mode===1) sh+='<text class="tn" x="'+SX0+'" y="'+(SY0+68)+'">相邻两格不连续：地址相差一整行（8192 × 2 字节）</text>';
  else if(mode===2) sh+='<text class="tn" x="'+SX0+'" y="'+(SY0+40)+'">2 个扇区连续，32 个线程各占 2 字节</text>';
  else sh+='<text class="tn" x="'+SX0+'" y="'+(SY0+40)+'">16 个扇区连续，每个扇区装 2 个线程的 16 字节</text>';
  $("wHi").innerHTML=wh; $("xHi").innerHTML=xh; $("yHi").innerHTML=yh; $("secs").innerHTML=sh; $("dots").innerHTML=dots;
  if(lsuG) lsuG.classList.toggle("busy",inflight); if(regG) regG.classList.toggle("busy",arrived.size===32);
  $("clipR").setAttribute("width",(TX(Math.min(t,end))-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(Math.min(t,end)).toFixed(1)+" "+(TY0-4)+"V"+(TY0+3*24)); $("tIn").value=String(t); narrate();
}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*6); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ setPlay(false); t=+$("tIn").value; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(true); }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||2);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? end : 0); show(); if(playing) start(); else play.textContent="播放";
