  const setT=v=>{ tIn.value=String(v); tIn.dispatchEvent(new Event("input")); };
  const lo=()=>+(tIn.min||0), hi=()=>+(tIn.max||100);
  const stepOf=()=>{ const m=(stepN&&stepN.textContent||"").match(/(\d+)/); return m?+m[1]:0; };
  const RING=".fr, #focus circle", MARK2="#algO *, .ao, .cur"; let useRing=null;
  let map=null, mapKey="";

  const centers=()=>{ const out=[]; document.querySelectorAll(useRing===false?MARK2:RING).forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width||r.height) out.push([r.left+r.width/2, r.top+r.height/2]); }); return out; };
  const stripBoxes=()=>{ const out=[]; document.querySelectorAll("#algO *, .ao, .sb.on, text.st.on").forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width&&r.height) out.push([r.left,r.top,r.right,r.bottom]); }); return out; };
  const build=()=>{ const keep=+tIn.value, a=lo(), b=hi(), N=400, steps=new Map(); let prevK=-1, prevT=a;

.f5d .nar{margin:2px 8px 8px;min-height:16em;font-size:12.5px;line-height:1.45;color:var(--anatomy-strong)}.f5d .nar b{display:inline-block;min-width:4.2em;margin:0 0 4px;padding:1px 8px;border-radius:10px;background:var(--anatomy-blue);color:#fff;font-weight:600;font-size:12px;text-align:center}
.f5d .cd{display:block;border:1px solid var(--anatomy-lo);border-radius:6px;padding:4px 10px 6px;background:var(--anatomy-card)}
.f5d .cd .hd{display:block;font-weight:600;padding:2px 0 4px}
.f5d .cd .rw{display:grid;grid-template-columns:5.6em 1fr;gap:8px;padding:2px 0;border-top:1px dotted var(--anatomy-lo)}
.f5d .cd .rw i{font-style:normal;font-weight:700;color:var(--anatomy-blue)}
.f5d .cd code,.f5d .cd .fm{font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:14px 2px 6px;font-size:13.5px;color:var(--anatomy-strong)}
.ctl .modes{display:flex;flex-wrap:wrap;gap:6px}.ctl .modes label{border:1px solid var(--anatomy-lo);border-radius:6px;padding:3px 10px;cursor:pointer;background:var(--anatomy-card)}.ctl .modes input{margin-right:5px}
.ctl input[type=range]{width:200px;accent-color:var(--anatomy-hi)}
.ctl button{font:inherit;padding:3px 12px;border-radius:6px;border:1px solid var(--anatomy-lo);background:var(--anatomy-card);color:var(--anatomy-strong);cursor:pointer}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 2px;font-size:12.5px;color:var(--anatomy-text)}
.lg i{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:-1px;border:1px solid var(--anatomy-lo)}
.cap{margin:8px 2px 0;font-size:13px;line-height:1.65;color:var(--anatomy-text)}

const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*M.speed); else { hold+=dt; if(hold>2){hold=0;t=-1;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=-1;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=-1; hold=0; setPlay(!still); if(still){t=end;show();} }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? end : -1); show(); if(playing) start(); else play.textContent="播放";
