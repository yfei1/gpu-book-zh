<!doctype html><html lang="en"><head><script>(()=>{

let speed=+(localStorage.getItem("figSpeed2")||0.25), baseN=null, baseV=0, lastN=0;

  document.querySelectorAll(".spd button[data-s]").forEach(b=>b.classList.toggle("on",+b.dataset.s===s)); };
addEventListener("DOMContentLoaded",()=>{
  const play=document.getElementById("play"), tIn=document.getElementById("tIn"), cur=document.getElementById("cur"), stepN=document.getElementById("stepN");

  document.head.appendChild(st);
  const box=document.createElement("span"); box.className="spd";

  play.after(box); setSpeed(SPEEDS.includes(speed)?speed:0.25);
  const isPlaying=()=>play.textContent.trim()==="暂停";
  const pause=()=>{ if(isPlaying()) play.click(); };
  const setT=v=>{ tIn.value=String(v); tIn.dispatchEvent(new Event("input")); };
  const lo=()=>+(tIn.min||0), hi=()=>+(tIn.max||100);
  const stepOf=()=>{ const m=(stepN&&stepN.textContent||"").match(/(\d+)/); return m?+m[1]:0; };
  const RING=".fr, #focus circle", MARK2="#algO *, .ao, .cur"; let useRing=null;
  let map=null, mapKey="";
  const keyNow=()=>{ const r=document.querySelector("input[name=mode]:checked"); return (r?r.value:"")+"|"+tIn.max; };
  const centers=()=>{ const out=[]; document.querySelectorAll(useRing===false?MARK2:RING).forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width||r.height) out.push([r.left+r.width/2, r.top+r.height/2]); }); return out; };
  const stripBoxes=()=>{ const out=[]; document.querySelectorAll("#algO *, .ao, .sb.on, text.st.on").forEach(el=>{ const r=el.getBoundingClientRect(); if(r.width&&r.height) out.push([r.left,r.top,r.right,r.bottom]); }); return out; };
  const build=()=>{ const keep=+tIn.value, a=lo(), b=hi(), N=400, steps=new Map(); let prevK=-1, prevT=a;
    const probe=t=>{ setT(t); return stepOf(); };
    for(let i=0;i<=N;i++){ const t=a+(b-a)*i/N, k=probe(t);

  const goStep=k=>{ const m=ensure(); const i=m.findIndex(x=>x[0]===k); if(i<0) return; const t0=m[i][1].t, t1=i+1<m.length?m[i+1][1].t:hi();

});

.f3 .ao{fill:none;stroke:var(--anatomy-red);stroke-width:2.2}
.f3 .mvc{stroke:var(--anatomy-card);stroke-width:1}.f3 .mvt{font-size:8.5px;fill:#fff;text-anchor:middle;font-weight:700}
.f3 .fr{fill:none;stroke:var(--anatomy-red);stroke-width:1.8}.f3 .fn{font-size:12px;font-weight:700;fill:var(--anatomy-red);text-anchor:middle;paint-order:stroke;stroke:var(--anatomy-card);stroke-width:3px}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:14px 2px 6px;font-size:13.5px;color:var(--anatomy-strong)}
.ctl .modes{display:flex;flex-wrap:wrap;gap:6px}
.ctl .modes label{border:1px solid var(--anatomy-lo);border-radius:6px;padding:3px 10px;cursor:pointer;background:var(--anatomy-card)}
.ctl .modes input{margin-right:5px}
.ctl input[type=range]{width:200px;accent-color:var(--anatomy-hi)}
.ctl button{font:inherit;padding:3px 12px;border-radius:6px;border:1px solid var(--anatomy-lo);background:var(--anatomy-card);color:var(--anatomy-strong);cursor:pointer}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 2px;font-size:12.5px;color:var(--anatomy-text)}
.lg i{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:-1px;border:1px solid var(--anatomy-lo);border-radius:2px}
.lg i.k1{background:#3e63dd}.lg i.k2{background:#d9822b}.lg i.k3{background:#2f9e6b}.lg i.k4{background:#8a5cd0}.lg i.kr{background:#d64545}.lg i.kw{background:#9aa0a6}.lg i.kd{background:#2a2a2e}.lg i.kl{background:#cfd6f5}.lg i.km{background:#8ea2ea}
.lg i.wait{background:repeating-linear-gradient(45deg,var(--anatomy-red) 0 1px,transparent 1px 4px);border-color:var(--anatomy-red)}
.lg i.free{background:color-mix(in srgb,var(--anatomy-green) 28%,transparent)}
.cap{margin:8px 2px 0;font-size:13px;line-height:1.65;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="readout"]{white-space:pre-line;text-align:right;line-height:1.55}.iso-plate-corner,.iso-plate-corner[data-corner]{text-transform:none !important}
.nar .nh{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}.nar .nh b{white-space:nowrap;flex:none}
.kard{margin:0;display:grid;grid-template-columns:5.4em minmax(0,1fr);gap:3px 10px;font-size:12px;line-height:1.5;color:var(--anatomy-text)}
.kard>div{display:contents}.kard dt{font-weight:600;color:var(--anatomy-muted)}.kard dd{margin:0}
.kard dd.m{font-family:var(--anatomy-mono);font-size:11.5px;color:var(--anatomy-strong);overflow-wrap:anywhere}
.iso-plate{padding-bottom:58px}
.iso-plate-corner[data-corner="title"]{white-space:normal;max-width:calc(100% - 64px);text-align:right;line-height:1.35}
.iso-plate-corner[data-corner="readout"]{max-width:100%;text-wrap:balance}
@media(max-width:700px){.iso-plate{padding-left:12px;padding-right:12px}.iso-plate-corners{inset:18px 12px}}
.f3 .nar{margin:14px 8px 8px;min-height:15em;font-size:13px;line-height:1.5;color:var(--anatomy-strong)}.f3 .nar b{display:inline-block;min-width:4.2em;margin-right:8px;padding:1px 8px;border-radius:10px;background:var(--anatomy-blue);color:#fff;font-weight:600;font-size:12px;text-align:center}

on></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathrm">partial</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mrel">:</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mopen">[</span><span class="mord">4</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">64</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1024</span><span class="mclose">]</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord text" style="color:#6b7280;"><span class="mord textsf katex-sizing reset-size6 size4" style="color:#6b7280;">FP32</span></span></span></span></span> = 1 MiB，在全局内存（经 L2）</template><template id="c1_0_x">写完后，每个 CTA 给计数器加 1</template><template id="c1_0_c">每个 CTA 写 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>64</mn><mo>×</mo><mn>1024</mn><mo>×</mo><mn>4</mn><mtext> B</mtext></mrow><annotation encoding="application/x-tex">64 \times 1024 \times 4\ \text{B}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">64</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">1024</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord">4</span><span class="mspace"> </span><span class="mord text"><span class="mord">B</span></span></span></span></span> = 256 KiB</template><template id="c1_1_t">每个 CTA 用 acq_rel 给计数器加 1，拿到旧值 3 的是后到者</template><template id="c1_1_f"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>=</mo><mrow><mi mathvariant="monospace">f</mi><mi mathvariant="monospace">e</mi><mi mathvariant="monospace">t</mi><mi mathvariant="monospace">c</mi><mi mathvariant="monospace">h</mi><mi mathvariant="monospace">_</mi><mi mathvariant="monospace">a</mi><mi mathvariant="monospace">d</mi><mi mathvariant="monospace">d</mi></mrow><mo stretchy="false">(</mo><mrow><mi mathvariant="normal">c</mi><mi mathvariant="normal">n</mi><mi mathvariant="normal">t</mi></mrow><mo separator="true">,</mo><mtext> </mtext><mn>1</mn><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">n = \mathtt{fetch\_add}(\mathrm{cnt},\ 1)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathtt">fetch_add</span></span><span class="mopen">(</span><span class="mord"><span class="mord mathrm">cnt</span></span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">1</span><span class="mclose">)</span></span></span></ const TL0=132,TL1=620,TY0=26,RH=24;
let mode=1,M=null,end=1,tend=1,t=0;
const AXMAP=(v)=>{ const m=M.map; if(!m) return v; if(v<=m[0][0]) return m[0][1]; for(let i=1;i<m.length;i++){ if(v<=m[i][0]){ const f=(v-m[i-1][0])/(m[i][0]-m[i-1][0]||1); return m[i-1][1]+(m[i][1]-m[i-1][1])*f; } } return m[m.length-1][1]; };
const TX=(v)=>TL0+(TL1-TL0)*v/end;
function drawFlat(){
  const n=M.rows.length, H=TY0+n*RH+(M.axis?22:8), f=$("flat"); f.setAttribute("viewBox","0 0 640 "+H);
  let h='<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" class="hl"/></pattern></defs>';
  h+='<text class="lab2" x="'+TL0+'" y="'+(TY0-10)+'">'+esc_(M.tlTitle)+'</text>';
  M.rows.forEach((r,i)=>{ h+='<text class="rl" x="'+(TL0-8)+'" y="'+(TY0+i*RH+13)+'">'+esc_(r)+'</text><rect class="row" x="'+TL0+'" y="'+(TY0+i*RH)+'" width="'+(TL1-TL0)+'" height="18"/>'; });
  if(M.axis) M.axis.forEach(a=>{ h+='<path class="axl" d="M'+TX(a[0]).toFixed(1)+' '+(TY0-2)+'V'+(TY0+n*RH-4)+'"/><text class="ax" x="'+TX(a[0]).toFixed(1)+'" y="'+(TY0+n*RH+10)+'">'+esc_(a[1])+'</text>'; });
  h+='<clipPath id="clipT"><rect id="clipR" x="'+TL0+'" y="'+(TY0-4)+'" width="0" height="'+(n*RH+8)+'"/></clipPath><g clip-path="url(#clipT)">';
  M.bars.forEach(b=>{ const y=TY0+b.r*RH, x0=TX(b.a), w=b.b>b.a?TX(b.b)-x0:2.2;
    h+='<rect class="bar b-'+b.c+'" x="'+x0.toFixed(1)+'" y="'+(y+2)+'" width="'+w.toFixed(1)+'" height="14"/>';
    if(b.l&&w>=18) h+='<text class="bt'+(b.d?" d":"")+'" x="'+(x0+w/2).toFixed(1)+'" y="'+(y+12.5)+'">'+esc_(b.l)+'</text>'; });
  h+='</g><path id="cur" class="cur" d=""/>';
  f.innerHTML=h; }
function splitCard(a){ document.getElementById("stepT").innerHTML=a.h||"";
  const K=$("stepK"); if(!a.f){ K.innerHTML=""; return; }
  K.innerHTML=[["公式",a.f],["输入",a.i],["输出",a.o],["交给下一步",a.x],["代价",a.c]].map(r=>"<div><dt>"+r[0]+"</dt><dd>"+r[1]+"</dd></div>").join(""); }
function narrate(){ const S=M.steps; let k=-1; for(let i=0;i<S.length;i++){ if(S[i].t<=t+1e-9) k=i; else break; }
  const n=$("stepN");
  if(k<0){ n.textContent=""; splitCard({h:"按播放，或拖动时间"}); $("focus").innerHTML=""; $("algO").innerHTML=""; return; }
  n.textContent="第 "+(k+1)+" 步"; const s=S[k]; splitCard(s);
  $("focus").innerHTML = s.focus ? '<circle class="fr" cx="'+s.focus[0].toFixed(1)+'" cy="'+s.focus[1].toFixed(1)+'" r="7.5"/><text class="fn" x="'+s.focus[0].toFixed(1)+'" y="'+(s.focus[1]-11).toFixed(1)+'">'+esc_(s.n||String(k+1))+'</text>' : "";
  if(s.alg!=null){ const b=ALGBOX(s.alg); $("algO").innerHTML='<rect class="ao" x="'+(b[0]-1.5)+'" y="'+(b[1]-1.5)+'" width="'+(b[2]+3)+'" height="'+(b[3]+3)+'" rx="3"/>'; } else $("algO").innerHTML=""; }
function show(){ const e=AXMAP(Math.min(t,tend));
  $("clipR").setAttribute("width",Math.max(0,TX(e)-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(e).toFixed(1)+" "+(TY0-4)+"V"+(TY0+M.rows.length*RH)); $("tIn").value=String(t);
  if(M.paint) M.paint(t); else paint(t); narrate(); }
function setMode(md){ mode=md; M=MODES[md]; end=M.end; tend=M.tend||M.end; $("tIn").max=String(tend); drawFlat(); readout.textContent=M.ro; t=Math.min(t,tend); if(typeof M_links!=="undefined") M_links(); if(M.init) M.init(); }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<tend) t=Math.min(tend,t+dt*(typeof SPEED!=="undefined"?SPEED:2.5)); else { hold+=dt; if(hold>3){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=tend){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(true); }));
const q=new URLSearchParams(location.search); const m0=+(q.get("mode")||q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? M.still : 0); show(); if(playing) start(); else play.textContent="播放";
</script><style>body{display:flow-root}.iso-page{margin:16px auto 12px!important}</style><link rel="stylesheet" href="../vendor/katex/katex.min.css"><script>(function(){function s(){var h=Math.ceil(document.body.getBoundingClientRect().height);parent.postMessage({figH:h},"*");}window.addEventListener("load",s);new ResizeObserver(s).observe(document.body);})();</script></body></html>
