<button id="play">暂停</button><label>时间 <input id="tIn" type="range" min="0" max="40" step="0.001" value="0"></label></div><div class="lg"><span><i class="kd"></i>一块数据，数字 = 阶段号（颜色同算法带和时间线）</span><span>着色的 HBM 栈 / SM 个数 = 这一步用掉的带宽 / 算力份额（上限）</span><span><i class="ks"></i>蓝色 SM = 本来空闲、被改造用上的 SM</span></div>
<p class="cap">选一个 T，播放或拖动时间，看每个阶段是算力还是显存先到头。换 T 后，对比 HBM 栈与 SM 哪边亮得多，以及每个专家分到的词元数。</p></main><script type="module">const HW={"stack":[[282.9,54.2],[236.6,80.1],[190.2,106],[449.8,147.5],[403.4,173.4],[357.1,199.3]],"l2":[320,135.3],"top":[347.8,119.8],"bot":[288.5,153]};

const G0=["同一层，换 T"];
const G1=[["Decode：T = 1","多轮追加 Prefill：T = 753","多轮追加 Prefill：T = 3,012","首轮分块 Prefill：T = 16,384"]];
const PEAK=989e12, BWD=4.8e12, WEXP=28311552;
const hsl=(h,s,l)=>"hsl("+h+" "+s+"% "+l+"%)";
const HUE=[0,212,168,30,330,262,140,190,45];
const C=HUE.map((h,i)=>i?hsl(h,60,42):null);
const NM=[null,"qkv_gate","注意力","o","router","pooler","专家","unpooler","调度"];
const f0=(x)=>Math.round(x).toLocaleString("en-US");
const f1=(x)=>x.toFixed(1);
const us=(x)=>x<0.01?"<0.01":x>=100?f0(x):x>=10?f1(x):x.toFixed(x>=1?1:2);
const gf=(x)=>x<1e9?(x/1e6).toFixed(1)+" MFLOP":(x>=1e11?f0(x/1e9):(x/1e9).toFixed(1))+" GFLOP";
const bs=(b)=>b<1e6?f0(b)+" B":(b/1e6).toFixed(1)+" MB";
const stp=(t,x,fm,inn,out,nx,c,ring,rn,tg)=>({t:t,x:x,fm:fm,in:inn,out:out,nx:nx,c:c,f:ring,n:rn,tg:tg});
const smSel=(a,b)=>{ const o=[]; for(let i=a;i<b;i++) o.push('[data-sm="'+i+'"]'); return o.join(","); };
const hbSel=(n)=>{ const o=[]; for(let i=0;i<n;i++) o.push('[data-hbm="'+i+'"]'); return o.join(","); };
const CFG={1:{L:1,B:1,ctx:80000,floor:"44.2",shape:"decode 1 · 全长层 ctx = 80,000"},753:{L:753,B:1,ctx:80000,floor:"496.7",shape:"turn 1 · 全长层 ctx = 80,000"},3012:{L:753,B:4,ctx:80000,floor:"1,992.4",shape:"turn 4 · 全长层 ctx = 80,000"},16384:{L:16384,B:1,ctx:65536,floor:"9,847.7",shape:"first turn · 全长层 ctx = 65,536"}};
function calc(T){ const g=CFG[T], st=[null];
  const dense=(N,K,wb,ob)=>{ const flop=2*T*N*K, w=N*K*wb, a=T*K*2+T*N*ob; return {flop:flop,w:w,a:a,I:flop/(w+a),tc:flop/PEAK*1e6,tm:(w+a)/BWD*1e6}; };
  st[1]=dense(2304,8192,2,2); 
  const vis=g.L*g.ctx+g.L*(g.L+1)/2, aflop=4096*vis*g.B, akv=g.B*(g.ctx+g.L)*256;
  st[2]={flop:aflop,w:0,a:akv,I:aflop/akv,tc:aflop/PEAK*1e6,tm:akv/BWD*1e6,kv:akv,vis:vis};
  st[3]=dense(8192,1024,2,2); st[4]=dense(256,8192,4,4); st[5]=dense(4096,8192,2,2);
  const un=T<=8?1024:8192; st[7]=dense(un,4096,2,2); st[7].N=un;
  const mf=T*100663296, mw=T===1?53e6:32*WEXP;
  st[6]={flop:mf,w:mw,a:0,I:T===1?3.56:2*(T/32)/0.5625,tc:mf/PEAK*1e6,tm:mw/BWD*1e6,tpe:T/32};
  st.forEach((s,i)=>{ if(!s) return; s.bound=s.I<206?"显存":"算力"; s.top=Math.max(s.tc,s.tm); });
  return st; }
function SCENE(a,b){ return scene([1,753,3012,16384][b-1]); }
function scene(T){ const st=calc(T), g=CFG[T], Tf=f0(T);
  const maxv=Math.max(...st.slice(1).map(s=>Math.max(s.tc,s.tm)));
  const sc={view:"pkg",T:9,axis:"每格一个阶段（只表示先后）；条长 = 该阶段下界，按本档最大值归一（µs，派生）",rows:["算力下界","显存下界","调度（µs）"],slots:["1","2","3","4","5","6","7","调","合"],segs:[],dots:[],lit:[],steps:[],algo:{title:"算法：这一批 "+Tf+" 个词元依次流过七个阶段，末格是这一档上的调度改造（"+g.shape+"）",cells:[]}};
  for(let j=0;j<7;j++){ const s=st[j+1], col=C[j+1], colm="hsla("+HUE[j+1]+" 60% 42% / .5)";
    sc.segs.push({r:0,a:j+0.05,b:j+0.05+Math.max(0.03,0.9*s.tc/maxv),col:col,lbl:us(s.tc)},{r:1,a:j+0.05,b:j+0.05+Math.max(0.03,0.9*s.tm/maxv),col:colm,lbl:us(s.tm)});
    const nh=Math.max(1,Math.ceil(6*s.tm/s.top-1e-9)), ns=Math.max(1,Math.ceil(132*s.tc/s.top-1e-9));
    sc.lit.push({sel:hbSel(nh),a:j,b:j+1,cls:"lit",h:HUE[j+1]},{sel:smSel(0,ns),a:j,b:j+1,cls:"lit",h:HUE[j+1]});
    const stk=[0,1,2,3,4,5][(j*2)%6];
    for(let i=0;i<3;i++) sc.dots.push({a:j+0.08+i*0.25,b:j+0.08+i*0.25+0.55,path:[HW.stack[(stk+i)%6],HW.bot],col:col,n:j+1,r:6});
    sc.algo.cells.push({lab:(j+1)+" "+NM[j+1],sub:(j===5&&T===753)?"显存（过渡区）":s.bound+"主导",col:col,a:j,b:j+1}); }
  sc.algo.cells.push({lab:"调度改造",sub:"本档的尾波 / 旁路",col:C[8],a:7,b:8});
  const ex=st[6];
  const stg=(j,x,fm,inn,out,nx,ring,tg)=>{ const s=st[j]; const c="FLOP "+gf(s.flop)+"；读写 "+bs(s.w+s.a)+"；强度 "+(s.I>=100?f0(s.I):s.I.toFixed(s.I>=10?0:1))+" FLOP/B（平衡点 206）；算力下界 "+us(s.tc)+" µs，显存下界 "+us(s.tm)+" µs → "+s.bound+"主导";
    return stp(j-1+0.03,x,fm,inn,out,nx,c,ring,j,tg); };
  const act=(n,k)=>"BF16 <code>["+Tf+", "+k+"]</code> = "+bs(T*k*2);
  sc.steps.push(
   stg(1,"阶段 1：qkv_gate 把 x 乘上权重，得到 q | k | v | gate","<code>qkv = x · W_qkvᵀ</code>","<code>x</code> "+act(0,8192)+"（HBM / L2）；<code>W_qkv</code> BF16 <code>[2304, 8192]</code> = 37.7 MB（HBM）","<code>qkv</code> "+act(0,2304)+"，写到 HBM / L2","阶段 2 的注意力读 q、k、v、gate",st[1].I<206?HW.stack[0]:HW.top,st[1].I<206?"读权重 37.7 MB":"算力主导"),
   stg(2,"阶段 2：注意力，读 KV 缓存算 softmax(q·Kᵀ)V，再按门控输出","<code>out = rmsnorm(softmax(q·Kᵀ/8)·V) ⊙ σ(gate)</code>；每个词元看 "+(g.L===1?"全部 "+f0(g.ctx)+" 个历史词":"历史词和块内前序词（块内下三角）"),"<code>qkv</code> "+act(0,2304)+"；KV 缓存 FP8 E4M3，"+(g.B>1?g.B+" 个请求 × ":"")+f0(g.ctx+g.L)+" 个词 × 256 B = "+bs(st[2].kv)+"（HBM）","<code>out</code> "+act(0,1024)+"，写到 HBM / L2；新 k、v 以 FP8 写进缓存","阶段 3 的 o 投影读 out",st[2].I<206?HW.stack[1]:HW.top,st[2].I<206?"读 KV "+bs(st[2].kv):"算力主导"),
   stg(3,"阶段 3：o 投影，再做第一道门控残差和归一化","<code>a = out · Woᵀ</code>；之后 <code>stream1 = α₁·stream0 + β₁·rmsnorm(a)</code>，<code>h = rmsnorm(stream1)·(1 + w)</code>","<code>out</code> "+act(0,1024)+"；<code>W_o</code> BF16 <code>[8192, 1024]</code> = 16.8 MB（HBM）","<code>a</code> "+act(0,8192)+"，写到 HBM / L2","<code>h</code> 分叉：阶段 4 的 router 与阶段 5 的 pooler 都读它",st[3].I<206?HW.stack[2]:HW.top,st[3].I<206?"读权重 16.8 MB":"算力主导"),
   stg(4,"阶段 4：router 打分并选出每个词元的 8 个专家","<code>s = σ(0.17677 · h · Rᵀ)</code>；<code>ids = top8(s + bias)</code>","<code>h</code> "+act(0,8192)+"；<code>R</code> FP32 <code>[256, 8192]</code> = 8.4 MB（HBM）","<code>s</code> FP32 <code>["+Tf+", 256]</code> = "+bs(T*1024)+"；<code>topk_ids</code> int32 <code>["+Tf+", 8]</code> = "+bs(T*32),"阶段 6 的专家读 <code>topk_ids</code>",st[4].I<206?HW.stack[3]:HW.top,st[4].I<206?"读权重 8.4 MB":"算力主导"),
   stg(5,"阶段 5：pooler 把 h 从 8192 维压到 4096 维","<code>x₂ = h · poolerᵀ</code>，再乘 <code>(1 + w)</code> 并归一化","<code>h</code> "+act(0,8192)+"；<code>W_pooler</code> BF16 <code>[4096, 8192]</code> = 67.1 MB（HBM）","<code>x₂</code> "+act(0,4096)+"，写到 HBM / L2","阶段 6 的专家读 <code>x₂</code>",st[5].I<206?HW.stack[4]:HW.top,st[5].I<206?"读权重 67.1 MB":"算力主导"),
   (()=>{ const s=ex; const tpe=T===1?"1.87 个专家被选中（53 MB）":"每个专家平均 "+f0(s.tpe)+" 个词元（"+(s.tpe<58?"< 58，没过平衡点":"> 58，过了平衡点")+"）";
     const c="FLOP "+gf(s.flop)+"；"+tpe+"；每专家权重强度 "+(s.I>=100?f0(s.I):s.I.toFixed(1))+" FLOP/B（平衡点 206）；算力下界 "+us(s.tc)+" µs，读权重下界 "+us(s.tm)+" µs"+(T===1?"":"（32 个专家全读的上限）")+" → "+(T===753?"显存为主（过渡区）":s.bound+"主导");
     return stp(5.03,"阶段 6："+(T===1?"被选中的专家做矩阵乘":"32 个本地专家各自处理分到的词元"),"<code>h13 = x₂ · W13ᵀ</code>；<code>inter = silu(h13[:, :4096]) ⊙ h13[:, 4096:]</code>；<code>y = inter · W2ᵀ</code>；<code>m = Σ wₑ · norm(yₑ)</code>","<code>x₂</code> "+act(0,4096)+"；<code>topk_ids</code> int32 <code>["+Tf+", 8]</code>；<code>w13[e]</code> uint8 <code>[8192, 2048]</code>、<code>w2[e]</code> uint8 <code>[4096, 2048]</code>，每专家 28.3 MB（NVFP4，HBM）","<code>m</code> "+act(0,4096)+"，写到 HBM / L2","阶段 7 的 unpooler 读 <code>m</code>",c,T===1?HW.stack[5]:(s.I<206?HW.stack[5]:HW.top),6,T===1?"读 53 MB":(s.tpe<58?"每专家 "+f0(s.tpe)+" 词元":"每专家 "+f0(s.tpe)+" 词元")); })(),
