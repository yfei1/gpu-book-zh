<p class="cap">切换两种写法，看一行的部分和怎样加成一个数、每一步花多少周期、用不用 SMEM。</p></main><script type="module">
const esc_=(s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function splitCost(s){ const m=s.match(/(总代价|代价)：/); if(!m) return {t:s,c:"—"}; const h=s.slice(0,m.index).replace(/[。；;，\s]+$/,""); return {t:h||"总代价", c:(h?s.slice(m.index):s.slice(m.index+m[0].length)).replace(/^代价：/,"")}; }
function card(a,b){ const c=Object.assign({},a,b||{}); document.getElementById("stepT").textContent=c.t||"";
  const K=document.getElementById("stepK"); if(!c.f){ K.innerHTML=""; return; }
  K.innerHTML=[["公式",c.f,1],["输入",c.i],["输出",c.o],["交给下一步",c.x],["代价",c.c]].map(r=>"<div><dt>"+r[0]+"</dt><dd"+(r[2]?' class="m"':"")+">"+esc_(r[1])+"</dd></div>").join(""); }

const TX0=40,LW=17.6,TY=40,LH=30,TL0=132,TL1=620,TY0=26;
const SHFL=24,ADD=4,BAR=20.4,PAT=50.3; // H200 实测：__syncthreads() 128 线程 20.4 clk；STS + 屏障 + LDS 50.3 clk
const col=(i)=>"hsl("+(222-50*i/31).toFixed(0)+" 62% "+(48-8*i/31).toFixed(0)+"%)";
const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
let mode=2, EV=[], end=1, t=0;
function plan(md){ const E=[]; let c=0;
  if(md===1){ E.push({t:0,d:1,lvl:0,s:"128 个线程各把自己的部分和写进 SMEM。代价：每个线程 1 条写指令"}); c=1;
    E.push({t:c,d:PAT-1,lvl:1,s:"__syncthreads()：等 4 个 warp 都写完。代价：H200 实测一次屏障 "+BAR+" 个周期（128 线程，每个 SM 1 个 CTA，4 个 warp 同时到达）；连同前面的写和后面第一次读，实测 "+PAT+" 个周期。先写完的 warp 还要等最晚到的那个 warp，这个等待另算"}); c+=PAT-1;
    for(let i=0;i<128;i++){ E.push({t:c,d:ADD,lvl:2,i,s:"线程 0 读第 "+(i+1)+" 个部分和，加到总和上。代价：1 次 SMEM 读（约 23 个周期，H200 实测 23.06，可提前发）+ 1 次加法；这次加法要等上一次加完（4 个周期）"}); c+=ADD; }
    E.push({t:c,d:1,lvl:3,s:"线程 0 写出 y[r]。总代价：写 + 屏障 + 第一次读 "+PAT+"（H200 实测）+ 128 次串行加法 "+(128*ADD)+" + 写出 1，至少约 "+Math.round(c+1)+" 个周期；这段时间里另外 127 个线程闲着"}); c+=1; }
  else { const off=[16,8,4,2,1]; off.forEach((o,j)=>{ E.push({t:c,d:SHFL+ADD,lvl:j+1,o,s:"第 "+(j+1)+" 层：每个线程从相隔 "+o+" 的线程拿来部分和，加到自己身上（还剩 "+o+" 个有用的和）。代价：1 条 shuffle（延迟约 24 个周期）+ 1 次加法"}); c+=SHFL+ADD; });
    E.push({t:c,d:1,lvl:6,s:"线程 0 手里就是整行的和，写出 y[r]。总代价：5 层，约 "+(c+1)+" 个周期；不碰 SMEM，不用屏障"}); c+=1; }
  end=c; return E; }
function anat(e){ const OUT="y[r] BF16 [1]（2 B），写回 HBM";
  if(mode===2){ if(e.lvl===6) return {f:"y[r] = v[0]（线程 0 手里的整行和）",i:"v[0] FP32（线程 0 的寄存器）",o:OUT,x:"y[r] 交给下一阶段"};
    const o=e.o, live=o;
    return {f:"v[i] += __shfl_down_sync(0xffffffff, v[i], "+o+")，i = 0…"+(o-1),i:"上一层 "+(2*o)+" 个线程的部分和（FP32，寄存器；相隔 "+o+" 的线程互相交换）",o:"线程 0…"+(o-1)+" 的新部分和 FP32（寄存器，不碰 SMEM）",x:e.lvl<5?"第 "+(e.lvl+1)+" 层把相隔 "+(o/2)+" 的两个再相加":"线程 0 手里就是整行的和"}; }
  if(e.lvl===0) return {f:"smem[tid] = acc，tid = 0…127",i:"128 个部分和 FP32（每线程 1 个，寄存器；共 512 B）",o:"SMEM FP32 [128]（512 B）",x:"__syncthreads() 之后线程 0 才能读"};
  if(e.lvl===1) return {f:"__syncthreads()",i:"4 个 warp 的 SMEM 写入",o:"SMEM 里 128 个部分和全部可见",x:"线程 0 开始一个一个读、一个一个加"};
  if(e.lvl===2) return {f:"total += smem["+e.i+"]",i:"smem["+e.i+"]（FP32，SMEM）；total（线程 0 的寄存器）",o:"total FP32（寄存器）",x:"加 smem["+(e.i+1)+"]：要等这次加完（4 个周期）"};
  return {f:"y[r] = total",i:"total FP32（线程 0 的寄存器，已加完 128 个）",o:OUT,x:"y[r] 交给下一阶段"}; }
function drawTree(lv,num){ let h="";
  if(mode===2){ const off=[16,8,4,2,1];
    for(let L=0;L<=5;L++){ const y=TY+L*LH; const live=32>>L; if(L>lv) break;
      for(let i=0;i<32;i++){ const on=i<live; h+='<rect class="ln" x="'+(TX0+i*LW)+'" y="'+y+'" width="'+(LW-2)+'" height="14"'+(on?' style="fill:'+col(i)+'"':'')+(on?'':' opacity=".35"')+'/>'; }
      h+='<text class="tn" x="'+(TX0-4)+'" y="'+(y+11)+'" text-anchor="end">'+(L===0?"开始":"第 "+L+" 层")+'</text>';
      if(L>=1){ const o=off[L-1]; for(let i=0;i<o;i++){ const x1=TX0+(i+o)*LW+LW/2-1, x2=TX0+i*LW+LW/2-1, y1=y-LH+14, y2=y; h+='<path class="ar" stroke="'+col(i+o)+'" d="M'+x1+' '+y1+'Q'+((x1+x2)/2)+' '+(y1+8)+' '+x2+' '+y2+'"/>'; } } } }
  else { const y=TY; for(let w=0;w<4;w++) for(let i=0;i<32;i++){ const n=w*32+i; const x=TX0+i*LW, yy=y+w*18; const read= lv>=2 && n<curI;
      h+='<rect class="ln" x="'+x+'" y="'+yy+'" width="'+(LW-2)+'" height="14"'+(lv>=0?' style="fill:'+col(i)+'"':'')+(read?' opacity=".25"':'')+'/>'; }
    h+='<text class="tn" x="'+(TX0-4)+'" y="'+(y+11)+'" text-anchor="end">SMEM</text>';
    if(lv>=2){ const n=Math.min(127,curI); const x=TX0+(n%32)*LW+LW/2, yy=y+Math.floor(n/32)*18+7; h+='<circle class="acc" cx="'+x+'" cy="'+(yy)+'" r="4"/>';
      h+='<text class="tn" x="'+TX0+'" y="'+(y+4*18+24)+'">红点：线程 0 正在加的那一个；已经加过的变淡。只有线程 0 在干活</text>'; } }
  const FR=(x,y,n,r)=>'<circle class="fr" cx="'+x+'" cy="'+y+'" r="'+r+'"/><text class="fn" x="'+x+'" y="'+(y+4)+'">'+n+'</text>';
  if(mode===2 && lv>=1){ const o=lv<=5?[16,8,4,2,1][lv-1]:1, L=lv<=5?lv:5; h+=FR(TX0+o*LW/2-1,TY+L*LH+7,num,8); }
  else if(mode===1 && lv>=0){ if(lv<2) h+=FR(TX0+16*LW-1,TY+34,num,9); else if(curI<128){ const n=Math.min(127,curI); const cx=TX0+(n%32)*LW+LW/2-1, cy=TY+Math.floor(n/32)*18+7; h+='<circle class="fr" cx="'+cx+'" cy="'+cy+'" r="7"/><text class="fn" x="'+cx+'" y="'+(cy-10)+'">'+(n+1)+'</text>'; } }
  $("tr").innerHTML=h; }
let curI=0;
function setMode(md){ mode=md; EV=plan(md); $("tIn").max=String(end); t=Math.min(t,end);
  $("trT").textContent= md===1 ? "写法 1（v1）：128 个部分和先写进 SMEM，再由线程 0 一个一个加" : "写法 2（v8）：32 个线程用 shuffle 两两相加，5 层树";
  readout.textContent=(md===1?"写法 1：128 次串行加法 + 1 次屏障（H200 实测 "+BAR+" 个周期）\n写 + 屏障 + 读合计实测 "+PAT+" · 至少约 "+Math.round(end)+" 个周期 · 用到 SMEM":"写法 2：5 层 shuffle\n至少约 "+Math.round(end)+" 个周期 · 不用 SMEM");
  const TX=(x)=>TL0+(TL1-TL0)*x/Math.max(end,1); let h="";
  EV.forEach((e,j)=>{ if(e.lvl===1&&mode===1) h+='<rect x="'+TX(e.t).toFixed(1)+'" y="'+(TY0+2)+'" width="3" height="14" fill="var(--anatomy-red)"/>'; if(e.d>2) h+='<rect x="'+TX(e.t).toFixed(1)+'" y="'+(TY0+2)+'" width="'+Math.max(0.6,TX(e.t+e.d)-TX(e.t)-0.4).toFixed(1)+'" height="14" fill="'+(md===1?(e.lvl===1?"var(--anatomy-red)":col((e.i||0)%32)):col(j*6))+'"/>'; });
  $("tl").innerHTML=h; let ax=""; const stp=md===1?100:20; for(let u=0;u<=end;u+=stp) ax+='<text class="tn" x="'+TX(u).toFixed(1)+'" y="'+(TY0+32)+'" text-anchor="middle">'+u+'</text>'; $("ax").innerHTML=ax; window.TX=TX; }
function show(){ const TX=window.TX; let k_=-1; for(let i=0;i<EV.length;i++){ if(EV[i].t<=t+1e-9) k_=i; else break; }
  const e=k_>=0?EV[k_]:null; curI = e && e.i!=null ? e.i : (e && e.lvl===3 ? 128 : 0);
  drawTree(e? (mode===1 ? (e.lvl>=2?2:e.lvl) : e.lvl) : -1, k_+1);
  const smem=document.querySelector('[data-part="smem"]'); if(smem) smem.classList.toggle("on", mode===1 && e && e.lvl<=2);
  const reg=document.querySelector('[data-smsp="0"] [data-part="regs"]'); if(reg) reg.classList.toggle("on", mode===2 && !!e);
  const n=$("stepN"); if(!e){ n.textContent=""; card({t:"按播放，或拖动时间"}); } else { n.textContent="第 "+(k_+1)+" 步"; card(splitCost(e.s),anat(e)); }
  $("clipR").setAttribute("width",(TX(Math.min(t,end))-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(Math.min(t,end)).toFixed(1)+" "+(TY0-4)+"V"+(TY0+22)); $("tIn").value=String(t); }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*end/8); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(!still); if(still){t=end;show();} }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||2);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? end : 0); show(); if(playing) start(); else play.textContent="播放";
</script><style>body{display:flow-root}.iso-page{margin:16px auto 12px!important}</style><link rel="stylesheet" href="../vendor/katex/katex.min.css"><script>(function(){function s(){var h=Math.ceil(document.body.getBoundingClientRect().height);parent.postMessage({figH:h},"*");}window.addEventListener("load",s);new ResizeObserver(s).observe(document.body);})();</script></body></html>
