// Row labels. A <text data-rowlabel> that is a direct child of a panel svg keeps its left edge inside the pan box while the pan scrolls (<= 600 px).
// It sits on a plate-coloured chip, and follow() keeps the cursor clear of the chips (scroll-padding-left). data-rowlabel="head" marks a heading with nothing under it: no chip, no clearance.

（2 个消费者 warpgroup = 8 个 warp，SS wgmma m64n64k16）；$T = 8 / 32$ 代码同 g1a（仍为 8 份末号读回）。","card.g1.o":"网格扩至 $1 \\times 36 \\times 3 = 108$ 个 CTA（闲置 SM 从 60 降到 24，1 波次）；片上搬运换 1 个专职 TMA 生产者 warp + mbarrier 环（$T = 128$ 为 8 槽 192 KiB，$T = 256$ 为 5 槽 200 KiB）+ 128 B XOR 交错，每个 K 步按序执行：生产者等 empty[s] $\\to$ expect_tx（登记期望字节）+ TMA 装入槽 $s$ $\\to$ full[s] 相位翻转 $\\to$ 消费者 wgmma $\\to$ 归还 empty[s]；每 CTA 各读 3 份部分和的 1/3 行，均读 32 KiB（$T = 128$）或 64 KiB（$T = 256$），较 g1a 末号单 CTA 读回 64 / 128 KiB 减半且 3 个 CTA 并行分担。","card.g1.x":"扩网格、TMA 环、$T = 128$ 操作数翻转与并行切片归约在同一版一起换，未拆开测。$T = 128$（18.84 µs）首次快过 cuBLAS；$T = 256$（25.46 µs）仍慢于 cuBLAS，原因未测（注：若直接对 BF16 输出做标量原子加，共享 32 位字的比较交换重试在 12 位核上慢 2.1–3.0×）。交给 g2 做寄存器受控实验。","card.g1.c":"较 g1a：+0.13（噪声） | +0.02（噪声） | −2.73 | −7.94 µs。","card.g2.f":"计算与归约同 g1，仅在 $T = 128 / 256$ 源码加入 gl.warp_specialize(..., [1], [24])。","card.g2.i":"同 g1。","card.g2.o":"请求把 1 个 TMA 生产者 warp 所在 warpgroup（$T = 128$ 为 warp 4、$T = 256$ 为 warp 8，若 Gluon 补齐则含填充 warp）上限压到 24 个寄存器，把省出的寄存器让给同 CTA 的消费者 warpgroup（全 CTA 总寄存器数不超过启动分配，见第 3 章第 8 节；编译后的 warp 排布与是否实际发出 setmaxnreg.dec 24 未记录）。","card.g2.x":"四档都在 0.35 µs 噪声带内，无收益、未采用；为什么没收益未测。后续在 g4a 撤回此改动。","card.g2.c":"较 g1：−0.06 | +0.03 | +0.09 | +0.18 µs，四档全部落在 0.35 µs 噪声带内。","card.g3.f":"这条 qkv_gate 演进链上无 g3 版本（未编写、未构建、未测）。","card.g3.i":"无对应构建。","card.g3.o":"无对应构建（第 4 章单个 SMSP 内的 warp 记分牌藏延迟手法，在这里已由异步 TMA mbarrier 环与 warpgroup 级 wgmma 跨过，不单独占一版）。","card.g3.x":"跳过第 4 级，直接进入 g4a（改进 $T = 32$ 的波次、片上搬运环与归约，并撤回 g2）。","card.g3.c":"无实测数值（本步柱状图留空画斜线，不沿用 g2 读数，也不标 0.00 差值）。","card.g4a.f":"$T = 32$ 保持交换 A/B（$Y^\\top = W X^\\top$，m64n32k16，自 g1a 起已有），把 Split-K 从 8 降到 3；尾声由末号 CTA 独自读回 8 份改为 3 个分片 CTA 取号后在计数器上自旋等齐 3 张票，再各加 1/3 分块。","card.g4a.i":"$T = 32$ 分块 $64 \\times 32 \\times 128$；$T = 128 / 256$ 撤掉 g2 的 24 寄存器上限回到 g1；$T = 8$ 不变。","card.g4a.o":"$T = 32$ 三处同时改变（三项合测未拆开测）：把 g1a 的 cp.async commit_group / wait_group 3 槽环换成 1 个 TMA 生产者 warp + 9 槽 mbarrier 环（216 KiB SMEM $\\Rightarrow$ 1 CTA/SM）；网格从 288 个 CTA（约 1.1 波次）缩到 108 个 CTA（1 波次跑完）；归约改为 3 个分片 CTA 同时驻留自旋等待后并行切片相加（每 CTA 均读 $3 \\times (1/3) \\times 32 \\times 64 \\times 4$ B = 8 KiB）。","card.g4a.x":"改后 $T = 32$ 有效权重速率约 3.17 TB/s，后续瓶颈未剖析。$T = 128 / 256$ 尾声仍在读写全局工作区，交给 g4b。","card.g4a.c":"较 g2（$T = 32$ 三项合测）：−0.05（噪声） | −1.11（较 g1 为 −1.08） | −0.22（噪声） | −0.34（噪声） µs。","card.g4b.f":"$T = 128 / 256$ 尾声由 0 号分片消费者先把输出分块 $Y$ 写成 0，各分片改用 stmatrix 落 SMEM + 1 条异步 TMA 块归约（第 5 章第 8 节）在全局内存原地累加 $Y \\mathrel{+}= P_i$（$T = 32$ 仍跑并行切片归约）。","card.g4b.i":"各切分 CTA 寄存器内的 FP32 累加器部分和，及守卫“$Y$ 已清零”的跨分片就绪标志 flag。","card.g4b.o":"省去 FP32 全局工作区写回与再读回；0 号分片的 TMA 生产者 warp 等到消费者归还空槽 empty[s]（排在消费者初始清零 $Y$ 之后，故要求 0 号分片 K 步数多于槽数）后，在装载循环外（wgmma 异步区外）发 red.release 置 flag，各分片经 atomic_add(..., acquire) 加跨代理栅栏（fence.proxy.async，第 3 章第 5 节、第 5 章第 8 节）等到标志后再发 TMA 块归约，既保证写 0 在前，又避开本章第 6 节触发 ptxas 串行化提示并插 DEPBAR 排空。","card.g4b.x":"$T = 256$（23.78 µs）仍慢于 cuBLAS（原因未测），且分块列宽仅 BN = 64。交给 g4 加宽分块并填满波次。","card.g4b.c":"较 g4a：+0.13（噪声） | +0.15（噪声） | −1.30 | −1.52 µs；与 FP64 相比相对 L2 误差从 1.6e-3 升至 2.7e-3（远低于 1e-2 门槛；与先舍入 BF16 再原子加相符，系推断，未单独验证唯一原因）。","card.g4.f":"$T = 256$ 路由从 $(256, 64, 64,\\ \\text{Split-K } 3,\\ 5\\text{ slots})$ 改为 $(256, 128, 64,\\ \\text{Split-K } 7,\\ 4\\text{ slots})$。","card.g4.i":"同 g4b（$T = 8, 32, 128$ kernel 未改）。","card.g4.o":"$T = 256$ 同时改 3 张硬件卡（背后是两项合测机制，未拆开测）：(1) BN 64 → 128（矩阵乘换 m64n128k16 SS，片上环随之由 $5 \\times 40$ KiB = 200 KiB 改为 $4 \\times 48$ KiB = 192 KiB——每槽字节仅增 +20%，每槽喂给 Tensor Core 的计算量翻倍 512 → 1,024 周期）；(2) Split-K 3 → 7 把 132 SM 网格从 108 扩至 $18 \\times 7 = 126$ 个 CTA（闲置 SM 从 24 降到 6）。","card.g4.x":"四个 $T$ 档位首次全部快过 cuBLAS g0；但 $T = 8 / 32$ 仍在读完整的 37.75 MB 16 位权重，交给终版 g5。","card.g4.c":"较 g4b：−0.12 | −0.06 | −0.13（未改档位运行间噪声） | −1.65 µs（$T = 256$ 相对 L2 误差升至 3.65e-3，原因未查明）。","card.g5.f":"全档改用自写 CUDA C++ + 内联 PTX 自建矩阵描述符、TMA 张量描述符与屏障相位；$T = 8 / 32$ 权重压成 12 位无损 C12 在寄存器解码，$T = 128 / 256$ 遵循第 4 节分界保持 16 位 BF16。","card.g5.i":"$T = 8 / 32$ 读 C12 主表 28.31 MB（另 0.07 MB 侧表，主表少读 25% 字节）；$T = 128 / 256$ 读 37.75 MB BF16 $W$（均驻全卡共享 HBM，哪一叠存哪些字节未规定）。","card.g5.o":"$T = 8$ 为 5 槽 TMA 环、每 CTA 24 行
