function drawChart(k,e){
  const B=D.BAR, id=D.IDS[k], cur=D.US[id], prev=k>0?D.US[D.IDS[k-1]]:null, g0=D.US.g0, sc=(B.bot-B.top)/B.max, nov=id==="g3";

    const yc=B.bot-cv*sc; h+='<rect class="b1'+(nov?" nov":"")+'" x="'+xc+'" y="'+yc.toFixed(1)+'" width="'+bw+'" height="'+(cv*sc).toFixed(1)+'"/><text class="bv'+(nov?"":" w")+'" x="'+(xc+bw/2)+'" y="'+(B.bot-5)+'">'+f2(cv)+'</text>';

      h+='<text class="dl'+cl+'" x="'+cx+'" y="'+(B.bot+28)+'">较上一步 '+sg(d)+(isN&&Math.abs(d)>=0.004?"（噪声）":"")+'</text>';
      const d0v=d0(k,j), p0=k===8?D.BOOK_PCT[j]:Math.round(100*d0v/g0[j]); h+='<text class="dl'+(Math.abs(d0v)<0.004?"":d0v>0?" up":" dn")+'" x="'+cx+'" y="'+(B.bot+42)+'">较 g0 '+sg(d0v)+'（'+(p0>0?"+":p0<0?"\u2212":"")+Math.abs(p0)+'%）</text>'; }
    else h+='<text class="dl" x="'+cx+'" y="'+(B.bot+28)+'">基线</text>';
  });
  $("chart").innerHTML=h;
}
function show(){
  const k=Math.max(0,Math.min(NS-1,Math.floor(t+1e-9))); const e=ease((t-k)/0.6);
  if(k!==lastK){ lastK=k; drawParts(k); $("stepN").textContent="第 "+(k+1)+" 步"; }
  drawChart(k,e); $("cur").setAttribute("d","M"+(t*D.PITCH).toFixed(1)+" "+(D.CY+D.CH+4)+"V"+(D.CY+D.CH+14)); $("tIn").value=String(t);
}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<END) t=Math.min(END,t+dt*SPEED); else { hold+=dt; if(hold>3){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
