  document.querySelectorAll(".spd button").forEach(b=>b.classList.toggle("on",+b.dataset.s===s)); };
addEventListener("DOMContentLoaded",()=>{
  const play=document.getElementById("play"), tIn=document.getElementById("tIn"), cur=document.getElementById("cur");
  if(!play||!tIn||!cur) return;
  const st=document.createElement("style");
  st.textContent=".spd{display:inline-flex;gap:2px;align-items:center;margin-left:8px;font-size:12px;color:#555}.spd button{font:inherit;padding:1px 6px;border:1px solid #bbb;background:#fff;border-radius:3px;cursor:pointer}.spd button.on{background:#333;color:#fff;border-color:#333}svg.seekable{cursor:pointer}";

const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
