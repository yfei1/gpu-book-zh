// ---- draw ----
const parts=(key)=>[0,1,2,3].map(i=>document.querySelector('[data-smsp="'+i+'"] [data-part="'+key+'"]'));
const PS={sched:parts("sched"),regs:parts("regs"),tc:parts("tc"),int32:parts("int32"),fp32:parts("fp32"),sfu:parts("sfu")};
const tmaG=document.querySelector('[data-part="tma"]'); const cellG=[...document.querySelectorAll("[data-cell]")];
let mode=1, S=null, t=0, curK=-1;
const along=(pts,u)=>{ const a=pts[0],b=pts[1]; return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u]; };
function tok(p,cls,i,hot){ const h=TK, x=(p[0]-h/2).toFixed(1), y=(p[1]-h/2).toFixed(1);
  return '<g class="tk '+cls+(hot?" hot":"")+' k'+(i%4)+'"><rect x="'+x+'" y="'+y+'" width="'+h+'" height="'+h+'" rx="2"/><text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.4).toFixed(1)+'">'+(cls==="D"?"D":(i+1))+'</text></g>'; }
function drawAlg(){ const n=S.n, ax=18, aw=150, ay=34, ah=96, bx=196, bw=52, dx=282, dw=n===4?52:30;
  const hue=["#3e63dd","#2f9e6b","#d9822b","#8e4ec6"]; let h="";
  h+='<text class="lab2" x="18" y="15">算法：'+S.A.replace("（SMEM）","").replace("（寄存器）","")+" × "+S.Bl.replace("（SMEM）","")+" → "+S.Dl+"，按 k16 切片逐片累加；块号 = 切片号</text>";
  const cw=aw/n, rh=ah/n;
  for(let j=0;j<n;j++){ const c=hue[j%4];
    h+='<rect id="ac'+j+'" class="ab" x="'+(ax+j*cw)+'" y="'+ay+'" width="'+cw+'" height="'+ah+'" fill="'+c+'"/><text class="an" x="'+(ax+j*cw+cw/2)+'" y="'+(ay+ah/2+3.5)+'">'+(j+1)+'</text>';
    h+='<rect id="bc'+j+'" class="ab" x="'+bx+'" y="'+(ay+j*rh)+'" width="'+bw+'" height="'+rh+'" fill="#fff" stroke="'+c+'" stroke-width="1.6"/><text class="bn" fill="'+c+'" x="'+(bx+bw/2)+'" y="'+(ay+j*rh+rh/2+3.4)+'">'+(j+1)+'</text>'; }
  h+='<text class="lab2" x="'+(ax+aw+8)+'" y="'+(ay+ah/2+4)+'">×</text><text class="lab2" x="'+(bx+bw+8)+'" y="'+(ay+ah/2+4)+'">=</text>';
  h+='<rect class="dbox" id="dbox" x="'+dx+'" y="'+ay+'" width="'+dw+'" height="'+ah+'"/><text class="lab3" x="'+dx+'" y="'+(ay+ah+13)+'">'+S.Dl+'</text>';
  h+='<text class="lab3" x="'+ax+'" y="'+(ay+ah+13)+'">A：64 行 × '+(n*16)+' 列</text><text class="lab3" x="'+bx+'" y="'+(ay+ah+13)+'">B：'+(n*16)+' × '+(n===4?64:32)+'</text>';
  S.side.forEach((s,i)=>{ h+='<text class="lab3" x="358" y="'+(ay+12+i*16)+'">'+s+'</text>'; });
  $("algG").innerHTML=h; S.ag={ax,aw,ay,ah,bx,bw,dx,dw,cw,rh}; }
function setMode(md){ mode=md; S=mk(md); drawAlg(); readout.textContent=S.ro; $("tIn").max=String(S.end); t=Math.min(t,S.end);
  let h=""; const bar=(a,b,row,c)=>'<rect class="'+c+'" x="'+TX(a).toFixed(1)+'" y="'+(TY0+row*24+2)+'" width="'+Math.max(1.5,TX(b)-TX(a)).toFixed(1)+'" height="14"/>';
  S.steps.forEach(s=>s.bars.forEach(b=>{ h+=bar(s.t0+(b[2]||0), b[3]!=null?s.t0+b[3]:s.t1, b[0], b[1]); }));
  S.hold.forEach(b=>{ h+=bar(b[2],b[3],b[0],b[1]); });
  $("tl").innerHTML=h; curK=-1; }
function ringHtml(r){ let p,lab=r.lab; if(r.kind==="cell") p=CELL[r.v]; else if(r.kind==="slot") p=SLOT[r.v]; else p=PART[r.v];
  return '<circle class="fr" cx="'+p[0]+'" cy="'+p[1]+'" r="'+(r.kind==="part"?11:8)+'"/><text class="fn" x="'+p[0]+'" y="'+(p[1]-(r.kind==="part"?14:10))+'">'+lab+'</text>'; }
function narrate(){ let k=-1; for(let i=0;i<S.steps.length;i++){ if(S.steps[i].t0<=t+1e-9) k=i; else break; }
  const n=$("stepN"); const ao=$("algO");
  if(k<0){ n.textContent=""; card({t:"按播放，或拖动时间"}); $("focus").innerHTML=""; ao.innerHTML=""; return; }
  const s=S.steps[k]; n.textContent="第 "+(k+1)+" 步"; card(s); $("focus").innerHTML=ringHtml(s.ring);
  const g=S.ag; let a=""; if(s.slice!=null){ a='<rect class="ao" x="'+(g.ax+s.slice*g.cw)+'" y="'+g.ay+'" width="'+g.cw+'" height="'+g.ah+'"/><rect class="ao" x="'+g.bx+'" y="'+(g.ay+s.slice*g.rh)+'" width="'+g.bw+'" height="'+g.rh+'"/>'; }
  else if(k===S.steps.length-1) a='<rect class="ao" x="'+g.dx+'" y="'+g.ay+'" width="'+g.dw+'" height="'+g.ah+'"/>';
  ao.innerHTML=a; }
function show(){
  let dots="";
  S.regs.forEach(r=>{ if(t>=r.t && !(r.te&&t>=r.te)){ const dec=t>=r.td; dots+=tok(SLOT[r.i],dec?"A":"C",r.i); } });
  const dh=(S.dhot||[]).some(w=>t>=w[0]&&t<w[1]); dots+=tok(DSLOT,"D",0,dh);
  S.moves.forEach(m=>{ if(t>=m.t0&&t<m.t1){ const p=along(m.p,(t-m.t0)/(m.t1-m.t0)); dots+=tok(p,m.k,m.i); } });
  $("dots").innerHTML=dots;
  const on={}; S.pulses.forEach(p=>{ if(t>=p.t0&&t<p.t1) p.k.forEach(x=>{ on[x]=1; }); });
  ["sched","tc","int32","fp32","sfu"].forEach(key=>PS[key].forEach(g=>g&&g.classList.toggle("issue",!!on[key])));
  PS.regs.forEach(g=>g&&g.classList.toggle("busy",!!on.regs)); if(tmaG) tmaG.classList.toggle("busy",!!on.tma);
  cellG.forEach((g,i)=>{ [0,1,2,3].forEach(h=>g.classList.remove("h"+h)); g.classList.remove("used"); });
  S.cells.forEach(c=>{ if(t>=c.t){ const g=cellG[c.c]; g.classList.add("h"+(c.h%4)); if(t>=c.u) g.classList.add("used"); } });
  const e=Math.min(t,S.end); $("clipR3").setAttribute("width",(TX(e)-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(e).toFixed(1)+" "+(TY0-4)+"V"+(TY0+5*24)); $("tIn").value=String(t); narrate(); }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<S.end) t=Math.min(S.end,t+dt*3); else { hold+=dt; if(hold>2.5){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=S.end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(true); }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? S.end : 0); show(); if(playing) start(); else play.textContent="播放";
