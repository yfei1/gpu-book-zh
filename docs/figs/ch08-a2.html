   st(B0+NB,SCH[1],"1,2,3","改后做完。","（无计算）","静态指令数：不上抬路径每分块 284 条","同左","→ 归一化融合同轮合并测试","总代价（改后）：304 → 284 条（−20，是 UR / 外提与栅栏改为按 warp 到达两项合计；分析预估目标约 269 条）；与归一化融合同轮合并测试，比上一步提速 0.60%（比更早的统一注意力版本 1.35%）"));
  return {end:B0+NB+30,speed:95,shot:B0+120,
   ro:"UR：不上抬路径每分块指令 304 → 284 条（预估目标约 269）\n与归一化融合同轮合并：比上一步提速 0.60%，比更早的统一注意力版本提速 1.35%",
   axis:"时间（只表示先后）；条长 = 静态指令数，斜线 = 重建变量约 51 条",
   strip:{title:"算法：P5 全长注意力消费者循环，每分块要推进 3 个全 warp 相同的变量",cells:[{a:"1",b:["环槽号","ring slot"],c:B1,t0:0,t1:B0+NB+30},{a:"2",b:["相位位","phase"],c:B2,t0:0,t1:B0+NB+30},{a:"3",b:["矩阵描述符","descriptor"],c:B3,t0:0,t1:B0+NB+30}]},
   blocks:bl,lights,cells:[],tags:[{p:[480,60],s:"UR：每个 warp 1 份",t0:B0,t1:B0+NB+30}],links:[],rows:["改前：每分块指令","改后：每分块指令","UR 更新"],bars,steps,divs:[B0-20],labels:["指令","输入","输出","交给下一步","代价"]}; };
const MODES={1:M1,2:M2};

const st=(t,f,n,s,fm,i,o,x,c,r)=>({t,f,n,s,fm,i,o,x,c,r});
const TL0=132,TL1=620,TY0=26,RH=22;
const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const hsl=(c,dl=0)=>"hsl("+c[0]+" "+c[1]+"% "+Math.max(8,c[2]+dl)+"%)";
function along(pts,u){ const segs=[]; let Lt=0; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); Lt+=d;} let s=Math.max(0,Math.min(1,u))*Lt; for(let i=0;i<segs.length;i++){ if(s<=segs[i]){const f=segs[i]?s/segs[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];} s-=segs[i];} return pts[pts.length-1]; }
let mode=1, C=null, end=1, t=0; const TX=(x)=>TL0+(TL1-TL0)*x/end;
const tint=(el,c)=>{ if(!el) return; if(!c){ ["--anatomy-face","--anatomy-top","--anatomy-shade-0","--anatomy-shade-1","--anatomy-shade-2","--anatomy-shade-3","--anatomy-hi"].forEach(v=>el.style.removeProperty(v)); return; }
  el.style.setProperty("--anatomy-face",hsl(c)); el.style.setProperty("--anatomy-top",hsl(c,8)); [-14,-8,-2,4].forEach((d,i)=>el.style.setProperty("--anatomy-shade-"+i,hsl(c,d))); el.style.setProperty("--anatomy-hi",hsl(c,-18)); };
const bar=(b)=>{ if(b.k==="txt") return '<text class="bt d" x="'+(TX(b.a)+2).toFixed(1)+'" y="'+(TY0+b.r*RH+RH/2-2)+'">'+b.s+'</text>'; const rh=b.sub!=null?[ -1,0 ]:null; const y=TY0+b.r*RH; let yy=y+2, hh=RH-8; if(b.sub!=null){ hh=(RH-8)/(b.subs||2); yy=y+2+b.sub*hh; }
  const x=TX(b.a), w=Math.max(b.k==="tick"?2.5:1.5,TX(b.b)-TX(b.a)-(b.k==="blk"?0.6:0)); let s="";
  if(b.k==="tick") return '<rect class="tick" x="'+x.toFixed(1)+'" y="'+(y+1)+'" width="'+w.toFixed(1)+'" height="'+(RH-6)+'"/>';
  s+='<rect '+(b.k==="blk"?'fill="'+hsl(b.c)+'"':'class="'+b.k+'"')+' x="'+x.toFixed(1)+'" y="'+yy+'" width="'+w.toFixed(1)+'" height="'+hh+'"/>';
  if(b.s && w>14) s+='<text class="bt'+(b.k==="blk"?"":" d")+'" x="'+(x+3).toFixed(1)+'" y="'+(yy+hh/2).toFixed(1)+'">'+b.s+'</text>'; return s; };
function setMode(md){ mode=md; C=MODES[md](); end=C.end; readout.textContent=C.ro; $("stripT").textContent=C.strip.title; $("axisT").textContent=C.axis;
  const H=TY0+C.rows.length*RH+10; $("flat").setAttribute("viewBox","0 0 640 "+H); $("clipR").setAttribute("height",C.rows.length*RH+8);
  $("rowsG").innerHTML=C.rows.map((r,i)=>'<text class="rl" x="'+(TL0-8)+'" y="'+(TY0+i*RH+13)+'">'+r+'</text><rect class="row" x="'+TL0+'" y="'+(TY0+i*RH)+'" width="'+(TL1-TL0)+'" height="'+(RH-4)+'"/>').join("");
  $("tl").innerHTML=C.bars.map(bar).join("")+(C.divs||[]).map(d=>'<path class="cur" style="stroke-dasharray:3 3;opacity:.5" d="M'+TX(d).toFixed(1)+' '+(TY0-4)+'V'+(TY0+C.rows.length*RH)+'"/>').join("");
  $("links").innerHTML=(C.links||[]).map(r=>'<path class="lk" d="M'+r.map(p=>p[0]+" "+p[1]).join("L")+'"/>').join("");
  $("tIn").max=String(end); t=Math.min(t,end); C.steps.sort((a,b)=>a.t-b.t); }
let litSel=new Set();
function show(){ let dots="", tags="";
  C.blocks.forEach(b=>{ let p=null, op=1; if(t<b.t0){ if(b.home) { p=b.route[0]; op=0.35; } } else if(t<b.t1) p=along(b.route,(t-b.t0)/(b.t1-b.t0)); else if(b.stay && (b.until==null||t<b.until)) p=b.route[b.route.length-1];
    if(p) dots+='<g opacity="'+op+'"><circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="6.5" fill="'+hsl(b.c)+'"/><text class="dn" x="'+p[0].toFixed(1)+'" y="'+p[1].toFixed(1)+'">'+b.n+'</text></g>'; });
  $("dots").innerHTML=dots;
  (C.tags||[]).forEach(g=>{ if(t>=g.t0&&t<g.t1) tags+='<text class="tg" x="'+g.p[0]+'" y="'+g.p[1]+'" text-anchor="'+(g.a||"middle")+'">'+g.s+'</text>'; }); $("tags").innerHTML=tags;
  const want=new Map(); (C.lights||[]).forEach(l=>{ const on=t>=l.t0&&t<l.t1; document.querySelectorAll(l.sel).forEach(e=>{ if(on) want.set(e,l.cls||"busy"); }); });
  litSel.forEach(e=>{ if(!want.has(e)){ e.classList.remove("busy","issue"); } }); want.forEach((c,e)=>e.classList.add(c)); litSel=new Set(want.keys());
  document.querySelectorAll("[data-cell]").forEach(e=>tint(e,null)); (C.cells||[]).forEach(c=>{ if(t>=c.t) tint(document.querySelector('[data-cell="'+c.i+'"]'),c.c); });
  const cells=C.strip.cells, n=cells.length, W=(640-40)/n; let sv="";
  cells.forEach((c,i)=>{ const x=20+i*W, st=t>=c.t1?"done":(t>=c.t0?"act":"fut"), col=hsl(c.c);
    sv+='<rect class="sc" x="'+(x+2).toFixed(1)+'" y="26" width="'+(W-4).toFixed(1)+'" height="24" rx="4" fill="'+(st==="fut"?"var(--anatomy-card)":col)+'" opacity="'+(st==="done"?0.45:1)+'" stroke="'+col+'" stroke-width="'+(st==="act"?2.5:1)+'"/><text class="sa" style="fill:'+(st==="fut"?col:"#fff")+'" x="'+(x+W/2).toFixed(1)+'" y="38">'+c.a+'</text>';
    (Array.isArray(c.b)?c.b:[c.b]).forEach((ln,j)=>{ sv+='<text class="sb" x="'+(x+W/2).toFixed(1)+'" y="'+(62+j*12)+'">'+ln+'</text>'; }); });
  $("strip").innerHTML=sv;
  const te=Math.min(t,end); $("clipR").setAttribute("width",(TX(te)-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(te).toFixed(1)+" "+(TY0-4)+"V"+(TY0+C.rows.length*RH)); $("tIn").value=String(t);
  let k_=-1; for(let i=0;i<C.steps.length;i++){ if(C.steps[i].t<=t+1e-9) k_=i; else break; }
  const nN=$("stepN"), nT=$("stepT"), cr=$("cardRows"); let f="";
  if(k_<0){ nN.textContent=""; nT.textContent="按播放，或拖动时间"; cr.innerHTML=""; } else { const e=C.steps[k_]; nN.textContent="第 "+(k_+1)+" 步"; nT.textContent=e.s;
    const LB=C.labels||["公式","输入","输出","交给下一步","代价"]; cr.innerHTML=[[LB[0],e.fm,""],[LB[1],e.i,""],[LB[2],e.o,""],[LB[3],e.x,""],[LB[4],e.c,"c"]].map(r=>'<dt>'+r[0]+'</dt><dd class="'+r[2]+'">'+r[1]+'</dd>').join("");
    if(e.f) f='<circle class="fr" cx="'+e.f[0]+'" cy="'+e.f[1]+'" r="'+(e.r||9)+'"/>'+(e.n!=null?'<text class="fn" x="'+e.f[0]+'" y="'+(e.f[1]-(e.r||9)-3)+'">'+e.n+'</text>':''); }
  $("focus").innerHTML=f; }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*(C.speed||end/10)); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(!still); if(still){ t=C.shot??end*0.6; show(); } }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? (C.shot??end*0.6) : 0); show(); if(playing) start(); else play.textContent="播放";
</script><style>body{display:flow-root}.iso-page{margin:16px auto 12px!important}</style><script>(function(){function s(){var h=Math.ceil(document.body.getBoundingClientRect().height);parent.postMessage({figH:h},"*");}window.addEventListener("load",s);new ResizeObserver(s).observe(document.body);})();</script></body></html>
