const RY0=40, RH=26, TX0=196, TC=20, PX=372, VX=478, TL0=132, TL1=620, TY0=26;
const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const sub=(n)=>String(n).split("").map(c=>SUBS[+c]).join("");
let K=3, t=0;
const N=()=>K+1, TX=(x)=>TL0+(TL1-TL0)*x/N();
const stepOf=()=>Math.min(N(), Math.floor(t+1e-9)+1), frac=()=>Math.min(1, t-Math.floor(t+1e-9));
const verdictShown=()=>t>=N()-1e-9 || frac()>=0.35;
function cardOf(i){ const p=PIECES[i-1], last=i===N(); let s,o,x;
 if(!last){ s="第 "+i+" 行的预测与位置 "+(6+i)+" 的草稿比较：一致，接受这个草稿。"; o=p.oa; x=p.xa; }
 else if(K<7){ s="第一个不一致：采用大模型自己的预测，停止。"; o=p.os; x="已确认长度前进 k + 1 = "+N()+"，下一趟从这里接着走"; }
 else { s="7 个草稿全部一致：第 8 行的预测没有草稿可比，直接采用，停止。"; o=p.ol; x="已确认长度前进 k + 1 = 8，下一趟从这里接着走"; }
 const c="本趟固定读取 9.0 GB 已付；每多接受 1 个，每个词元分摊变为 9.0 ÷ (k + 1) GB。到这一步已确认 "+i+" 个词元，每个摊 "+SHARE[i-1]+" GB。";
 $("stepT").textContent=s;
 $("stepK").innerHTML=[["公式",p.f],["输入",p.i],["输出",o],["交给下一步",x],["代价",c]].map(r=>"<div><dt>"+r[0]+"</dt><dd>"+r[1]+"</dd></div>").join(""); }

function drawStrip(){ const st=stepOf(), vs=verdictShown(), last=st===N(); let h="";
 h+='<text class="lab2" x="8" y="16">输入（8 行）</text><text class="lab2" x="'+TX0+'" y="16">行 i 只看行 1 … i</text><text class="lab2" x="'+PX+'" y="16">第 i 行输出 = 位置 6 + i 的预测</text>';
 for(let j=1;j<=8;j++) h+='<text class="tm" x="'+(TX0+(j-1)*TC+TC/2)+'" y="34" text-anchor="middle">'+j+'</text>';
 for(let r=1;r<=8;r++){ const y=RY0+(r-1)*RH, cur=r===st;
  h+='<rect class="ib'+(r===1?" kn":"")+'" x="8" y="'+y+'" width="170" height="'+(RH-4)+'" rx="4"/><text class="tc" x="16" y="'+(y+(RH-4)/2+4)+'">行 '+r+' · 位置 '+(5+r)+' · '+(r===1?"词元 6（已知）":"草稿 d"+sub(5+r))+'</text>';
  for(let c=1;c<=8;c++){ const vis=c<=r; h+= vis? '<rect class="cs'+(cur?" on":"")+'" x="'+(TX0+(c-1)*TC)+'" y="'+y+'" width="'+(TC-1)+'" height="'+(RH-4)+'"/>' : '<rect class="cz" x="'+(TX0+(c-1)*TC)+'" y="'+y+'" width="'+(TC-1)+'" height="'+(RH-4)+'"/>'; }
  h+='<rect class="pb" x="'+PX+'" y="'+y+'" width="100" height="'+(RH-4)+'" rx="4"/><text class="tc" x="'+(PX+8)+'" y="'+(y+(RH-4)/2+4)+'">预测 ŷ'+sub(6+r)+'（位置 '+(6+r)+'）</text>';
  let cls="vb", txt="";
  const rest=r>N();
  if(r<st){ cls="vb ok"; txt= "= d"+sub(6+r)+" ✓ 接受"; }
  else if(r===st && vs){ if(!last){ cls="vb ok"; txt="= d"+sub(6+r)+" ✓ 接受"; } else if(K<7){ cls="vb no"; txt="≠ d"+sub(6+r)+" ✗ 停止"; } else { cls="vb own"; txt="无草稿，直接采用"; } }
  else if(r>st){ txt= r<8? "待比较 d"+sub(6+r) : "无草稿可比"; if(rest && last && vs) { cls="vb unused"; txt="不再比较"; } }
  else txt= r<8? "比较 d"+sub(6+r)+" …" : "…";
  h+='<rect class="'+cls+'" x="'+VX+'" y="'+y+'" width="150" height="'+(RH-4)+'" rx="4"/><text class="tc" x="'+(VX+8)+'" y="'+(y+(RH-4)/2+4)+'">'+txt+'</text>';
  if(cur){ const cy=y+(RH-4)/2;
   h+='<rect class="fr" x="'+(PX-4)+'" y="'+(y-3)+'" width="'+(VX+150-PX+8)+'" height="'+(RH+2)+'" rx="7"/><circle class="rb" cx="'+(PX-4)+'" cy="'+(y-3)+'" r="8.5"/><text class="rn" x="'+(PX-4)+'" y="'+(y+0.6)+'">'+st+'</text>'; } }
 const by=RY0+8*RH+14; h+='<text class="lab2" x="8" y="'+by+'">本趟产出的词元（位置 7 起）</text>';
 const have= st-1+(vs?1:0);
 for(let q=1;q<=8;q++){ let cls="sl", txt="位置 "+(6+q);
  if(q<=have){ if(q<=K){ cls="sl ok"; txt="d"+sub(6+q); } else { cls="sl own"; txt="ŷ"+sub(6+q); } }
  h+='<rect class="'+cls+'" x="'+(8+(q-1)*78)+'" y="'+(by+8)+'" width="72" height="22" rx="4"/><text class="tc" x="'+(8+(q-1)*78+36)+'" y="'+(by+23)+'" text-anchor="middle">'+txt+'</text>'; }
 $("strip").innerHTML=h; }

function drawTL(){ let h=""; const w=(TL1-TL0)/N();
 for(let i=1;i<=N();i++){ const x=TL0+(i-1)*w, lastS=i===N(); const col= !lastS?"var(--ok)":(K<7?"var(--anatomy-red)":"var(--anatomy-blue)");
  h+='<rect x="'+(x+1).toFixed(1)+'" y="'+(TY0+3)+'" width="'+(w-2).toFixed(1)+'" height="12" fill="'+col+'"/><text class="tn" x="'+(x+w/2).toFixed(1)+'" y="'+(TY0+13)+'" text-anchor="middle" style="fill:#fff;font-weight:700">'+i+'</text>';
  h+='<rect x="'+(x+1).toFixed(1)+'" y="'+(TY0+24+17-2*i)+'" width="'+(w-2).toFixed(1)+'" height="'+(2*i)+'" fill="var(--anatomy-blue)"/>';
  const g=16*(8.996/i)/9; h+='<rect x="'+(x+1).toFixed(1)+'" y="'+(TY0+48+17-g).toFixed(1)+'" width="'+(w-2).toFixed(1)+'" height="'+g.toFixed(1)+'" fill="var(--anatomy-mid)"/>'; }
 $("tl").innerHTML=h; }

function show(){ const st=stepOf();
 $("stepN").textContent="第 "+st+" 步"; cardOf(st); drawStrip();
 const x=TX(Math.min(t,N())); $("clipR").setAttribute("width",(x-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+x.toFixed(1)+" "+(TY0-4)+"V"+(TY0+NR_*24)); $("tIn").value=String(t); }
const NR_=3;
function setK(v){ K=v; $("kv").textContent=v; $("kIn").value=String(v); $("tIn").max=String(N());
 readout.textContent="本趟产出 k + 1 = "+N()+" 个词元\n每个词元摊 9.0 ÷ (k + 1) = "+SHARE[K]+" GB"; drawTL(); }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<N()) t=Math.min(N(),t+dt*1.2); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=N()){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
$("kIn").addEventListener("input",()=>{ setK(+$("kIn").value); t=0; hold=0; setPlay(!still); if(still){ t=1.5; show(); } });
const q=new URLSearchParams(location.search);
setK(q.has("k")?+q.get("k"):3);
t = q.has("t") ? +q.get("t") : (still ? 1.5 : 0); show(); if(playing) start(); else play.textContent="播放";
