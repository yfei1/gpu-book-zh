const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*0.8); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
