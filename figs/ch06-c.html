    let fr=""; rows.forEach((r,i)=>{ fr+='<text class="rl" x="'+(TL0-8)+'" y="'+(TY0+i*24+13)+'">'+r+'</text><rect class="row" x="'+TL0+'" y="'+(TY0+i*24)+'" width="'+(TL1-TL0)+'" height="18"/>'; }); $("frm").innerHTML=fr;
    let h=""; const blk=(x)=>{ const y=TY0+(x.pipe==="A"?0:24), w=TX(2)-TX(0);
      return '<rect x="'+TX(x.t0).toFixed(1)+'" y="'+(y+1)+'" width="'+(w-1).toFixed(1)+'" height="16" fill="'+hsl(HUE[x.k],55,x.name==="LOP3"?40:(x.name==="HMUL2"?34:52))+'"/><text class="tb" x="'+(TX(x.t0)+w/2).toFixed(1)+'" y="'+(y+13)+'">'+x.n+' '+(x.name==="IMAD.SHL"?"IMAD":x.name)+'</text>'; };
    INS.forEach(x=>{ h+=blk(x); if(x.name==="LOP3"||x.name==="HMUL2") h+='<rect x="'+TX(x.t0+2).toFixed(1)+'" y="'+(TY0+48+1)+'" width="'+(x.name==="HMUL2"?9:5)+'" height="16" fill="'+hsl(HUE[x.k],55,x.name==="LOP3"?52:34)+'"/>'+(x.name==="HMUL2"?'<text class="tb" x="'+(TX(x.t0+2)+4.5).toFixed(1)+'" y="'+(TY0+48+12)+'" style="font-size:9px">✓</text>':''); });
    $("tl").innerHTML=h; let ax=""; for(let u=0;u<=20;u+=2) ax+='<text class="tn" x="'+TX(u).toFixed(1)+'" y="'+(TY0+3*24+14)+'" text-anchor="middle">'+u+'</text>'; $("ax").innerHTML=ax; }
  $("tIn").max=String(end); t=Math.min(t,end); }
function show(){ let k_=-1; for(let i=0;i<EV.length;i++) if(EV[i].t<=t+1e-9) k_=i;
  const alu=document.querySelector('[data-part="int32"]'), fma=document.querySelector('[data-part="fp32"]'), regs=document.querySelector('[data-part="regs"]');
  let r="", aOn=null, fOn=null, dots="", lk="";
  if(mode>=3){ INS.forEach(x=>{ if(t>=x.t0&&t<x.t0+2){ if(x.pipe==="A") aOn=x.k; else fOn=x.k; const tgt=x.pipe==="A"?ALUC:FMAC; const u=(t-x.t0)/2; const p=u<0.5?along([REGC,tgt],u*2):along([tgt,REGC],(u-0.5)*2); dots+='<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5" fill="'+hsl(HUE[x.k],55,46)+'"/>'; } });
    alu.classList.toggle("busy",aOn!=null); tint(alu,aOn!=null?HUE[aOn]:null); fma.classList.toggle("busy",fOn!=null); tint(fma,fOn!=null?HUE[fOn]:null); regs.classList.toggle("busy",aOn!=null||fOn!=null);
    lk='<path class="lk" d="M'+REGC+'L'+ALUC+'"/><path class="lk" d="M'+REGC+'L'+FMAC+'"/>';
    /* algorithm strip: source, mask, D0..D3, S */
    $("aTitle").textContent="算法：专家权重每轮循环解码 8 个。源寄存器 R 的 8 个权重（编号 0–7）变成 4 个目标寄存器 D0–D3，每个装 2 个";
    r+=lbl(SX-22,SY+12,"源 R")+srcRow(SY);
    r+=lbl(SX-22,DY0-6,"掩码")+cellsOf(DY0-14,(bit,x,y)=>'<rect class="'+(MASK.includes(bit)?"mk":"zero")+'" x="'+x+'" y="'+y+'" width="'+(CWID-1)+'" height="8"/>')+'<text class="tn" x="'+(SX+32*CWID+8)+'" y="'+(DY0-6)+'">0x81C081C0</text>';
    for(let kk=0;kk<4;kk++){ const y=DY0+kk*DSTEP; const lop=INS.find(x=>x.name==="LOP3"&&x.k===kk), hm=INS.find(x=>x.name==="HMUL2"&&x.k===kk); const placed=t>=lop.t0+2, scaled=t>=hm.t0+2;
      r+=lbl(SX-22,y+12,"D"+kk);
      r+=cellsOf(y,(bit,x,yy)=>{ const mi=MASK.indexOf(bit); if(mi<0) return zeroCell(x,yy,CWID,"0"); const f=["S","E","E","M"][mi%4], wn=mi<4?kk+4:kk; if(!placed) return zeroCell(x,yy,CWID,"",true);
        return '<rect x="'+x+'" y="'+yy+'" width="'+(CWID-1)+'" height="16" fill="'+hsl(HUE[kk],55,LF[f])+'"/>'+(f==="S"?num(x,yy,wn):'<text class="cc" x="'+(x+CWID/2-0.5)+'" y="'+(yy+12)+'" fill="'+(f==="M"?"#14233f":"#fff")+'">'+"seem"[mi%4]+'</text>'); });
      r+=scaled?'<text class="tn" x="'+(SX+32*CWID+8)+'" y="'+(y+12)+'" fill="var(--anatomy-green)" font-weight="700">× S ✓</text>':(placed?'<text class="tn" x="'+(SX+32*CWID+8)+'" y="'+(y+12)+'">待乘 S</text>':''); }
    r+='<text class="tn" x="'+(SX-22)+'" y="'+(DY0+4*DSTEP+14)+'" text-anchor="end">S</text><rect x="'+SX+'" y="'+(DY0+4*DSTEP+3)+'" width="'+(32*CWID-1)+'" height="14" fill="var(--anatomy-face)" stroke="var(--anatomy-lo)"/><text class="tn" x="'+(SX+16*CWID)+'" y="'+(DY0+4*DSTEP+14)+'" text-anchor="middle">缩放寄存器：解包后的块缩放因子（BF16x2）</text>';
    const e=Math.min(t,end); $("clipR").setAttribute("width",(TX(e)-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(e).toFixed(1)+" "+(TY0-4)+"V"+(TY0+3*24)); }
  else { const pipe=k_>=0?EV[k_].pipe:null; alu.classList.toggle("busy",pipe==="A"); tint(alu,pipe==="A"?HUE[0]:null); fma.classList.toggle("busy",false); tint(fma,null); regs.classList.toggle("busy",pipe==="R"||pipe==="A");
    if(k_>=0&&pipe==="A") lk='<path class="lk" d="M'+REGC+'L'+ALUC+'"/>';
    if(mode===1){ r=stripE(k_); $("frm").innerHTML=flatE(k_); } else { r=stripRaw(k_); $("frm").innerHTML=flatRaw(k_); }
    const PB=mode===1?118:98, px=TL0+(TL1-TL0)*Math.min(1,t/end); $("frm").innerHTML+='<rect x="'+TL0+'" y="'+PB+'" width="'+(TL1-TL0)+'" height="4" rx="2" fill="var(--anatomy-faint)"/>';
    $("clipR").setAttribute("width",0); $("cur").setAttribute("d","M"+px.toFixed(1)+" "+(PB-5)+"V"+(PB+9)); }
  $("links").innerHTML=lk; $("dots").innerHTML=dots; $("algR").innerHTML=r; $("tIn").value=String(t);
  narr(EV); }

const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const hsl=(h,s,l)=>"hsl("+h+" "+s+"% "+l+"%)";
function tint(el,h){ if(!el) return; const st=el.style; if(h==null){ ["face","top","shade-0","shade-1","shade-2","shade-3"].forEach(k=>st.removeProperty("--anatomy-"+k)); return; }
  st.setProperty("--anatomy-face",hsl(h,55,46)); st.setProperty("--anatomy-top",hsl(h,60,62)); for(let i=0;i<4;i++) st.setProperty("--anatomy-shade-"+i,hsl(h,50,34+i*5)); }
function along(pts,u){ const segs=[]; let Lt=0; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); Lt+=d;} let s=Math.max(0,Math.min(1,u))*Lt; for(let i=0;i<segs.length;i++){ if(s<=segs[i]){const f=segs[i]?s/segs[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];} s-=segs[i];} return pts[pts.length-1]; }
const CARD_ROWS=[["f","公式"],["i","输入"],["o","输出"],["h","交给下一步"],["k","代价"]];
function narr(EV){ let k=-1; for(let i=0;i<EV.length;i++){ if(EV[i].t<=t+1e-9) k=i; else break; }
  const n=$("stepN"), s=$("stepT"), f=$("focus"), cd=$("card");
  if(k<0){ n.textContent=""; s.textContent="按播放，或拖动时间"; f.innerHTML=""; cd.innerHTML=""; return; }
  const e=EV[k]; n.textContent="第 "+(k+1)+" 步";
  const m=/^(.*?)(?:总)?代价：(.*)$/s.exec(e.s), c=Object.assign({k:m?m[2]:""},e.c||{});
  s.textContent=m?(m[1].replace(/[。\s]+$/,"")||"合计"):e.s;
  cd.innerHTML=CARD_ROWS.filter(r=>c[r[0]]).map(r=>"<dt>"+r[1]+"</dt><dd"+""+">"+c[r[0]]+"</dd>").join("");
  f.innerHTML = e.p ? '<circle class="fr" cx="'+e.p[0]+'" cy="'+e.p[1]+'" r="'+(e.r||9)+'"/>'+(e.n!=null?'<text class="fn" x="'+e.p[0]+'" y="'+(e.p[1]-(e.r||9)-3)+'">'+e.n+'</text>':"") : ""; }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0, SPEED=3;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*SPEED); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(!still); if(still){ t=stillT(); show(); } }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||MODE0);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? stillT() : 0); show(); if(playing) start(); else play.textContent="播放";
</script></body></html>
