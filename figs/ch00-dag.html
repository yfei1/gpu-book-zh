.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}

.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

"rg" cx="105" cy="203" r="12.5"/></g><g class="nd" data-n="5"><rect class="nb" x="208" y="202" width="112" height="36" rx="5" style="stroke:#d6409f"/><text class="nt" x="269" y="216">pooler</text><text class="nt" x="269" y="229">+ pre_expert_norm</text><circle cx="209" cy="203" r="8.5" fill="#d6409f"/><text class="bn" x="209" y="206.4">5</text><circle class="rg" cx="209" cy="203" r="12.5"/></g><g class="nd" data-n="6"><rect class="nb" x="144" y="268" width="140" height="30" rx="5" style="stroke:#2f9e44"/><text class="nt" x="219" y="286.5">experts（两路都到才开始）</text><circle cx="145" cy="269" r="8.5" fill="#2f9e44"/><text class="bn" x="145" y="272.4">6</text><circle class="rg" cx="145" cy="269" r="12.5"/></g><g class="nd" data-n="7"><rect class="nb" x="144" y="318" width="140" height="30" rx="5" style="stroke:#8a6d3b"/><text class="nt" x="219" y="336.5">unpooler</text><circle cx="145" cy="319" r="8.5" fill="#8a6d3b"/><text class="bn" x="145" y="322.4">7</text><circle class="rg" cx="145" cy="319" r="12.5"/></g><g class="nd" data-n="8"><rect class="nb" x="144" y="368" width="140" height="38" rx="5" style="stroke:#5b6b7f"/><text class="nt" x="219" y="382">post_ffn_norm + 残差 2</text><text class="nt" x="219" y="395">+ 下一层预归一化</text><circle cx="145" cy="369" r="8.5" fill="#5b6b7f"/><text class="bn" x="145" y="372.4">8</text><circle class="rg" cx="145" cy="369" r="12.5"/></g></svg><div class="nar"><div class="nh"><b id="stepN"></b><span id="stepT"></span></div><dl id="stepK" class="kard"></dl></div></div></div></figure><div class="ctl"><button id="play">暂停</button><label>步骤 <input id="sIn" type="range" min="1" max="9" step="1" value="4"></label></div><p class="cap">拖动步骤或播放，按依赖顺序走一遍：红色是这一步涉及的边，变淡的边表示它的内容还没有算出。绿色的权重读取不依赖上一阶段，每一步都可以进行；硬件怎样利用这一点，见第 9 章。</p></main><script type="module">const DATA={"STG":[{"nm":"qkv_gate","act":"qkv_gate 用 x_in 乘 W_qkv_gate，算出 q、k、v、gate","f":"[q_in | k_in | v_in | gate] = x_in · W_qkv_gateᵀ","i":"x_in BF16 [T, 8192]（T × 16,384 B，HBM / L2）；W_qkv_gate BF16 [2304, 8192]（37,748,736 B = 37.7 MB，HBM）","o":"qkv BF16 [T, 2304]（每词 4,608 B：q 1024 + k 128 + v 128 + gate 1024 列），写回 HBM / L2","x":"qkv 交给阶段 2（e1）","c":"T = 1：读 37,765,120 B（W 37,748,736 + x_in 16,384）；写 4,608 B"},{"nm":"attention","act":"attention 读 qkv 与 KV 缓存，写出 o_attn，并把新 K、V 写进缓存","f":"o_attn = rmsnorm(softmax(q · K_visᵀ · 5.473 / 8) · V_vis) ⊙ sigmoid(gate)；K_cache[loc] = FP8(k)，V_cache[loc] = FP8(v)","i":"qkv BF16 [T, 2304]（HBM / L2）；page_table int32 [B, max_pages]；K_cache、V_cache FP8 E4M3 [pages, 1, 2, 64]（每历史词 256 B，HBM）","o":"o_attn BF16 [T, 1024]（每词 2,048 B，写回 HBM / L2）；新 K、V 行原地写进缓存（HBM）","x":"o_attn 交给阶段 3（e2）；新写入的 K、V 留给之后的 step（图中的水平边）","c":"T = 1、历史 80,000 词的全长层：读 20,484,608 B（缓存 20,480,000 + qkv 4,608）；写 2,304 B（o_attn 2,048 + 新 K、V 256）。滑窗层只看 2,048 词，读 528,896 B"},{"nm":"o + 残差 1 + pre_ffn_norm","act":"o 投影、第一道门控残差与 pre_ffn_norm 写出 stream_1 和 h","f":"a = o_attn · W_oᵀ；stream_1 = α₁ ⊙ stream_0 + β₁ ⊙ rmsnorm(a)（α₁、β₁ 是 FP32 [8192] 逐通道向量）；h = rmsnorm(stream_1) · (1 + w_pre_ffn)","i":"o_attn BF16 [T, 1024]；W_o BF16 [8192, 1024]（16,777,216 B = 16.8 MB，HBM）；stream_0 FP32 [T, 8192]（每词 32 KiB，HBM；第 l − 1 层写出，e0）","o":"stream_1 FP32 [T, 8192]（HBM）；h BF16 [T, 8192]（每词 16,384 B，HBM / L2）；T ≤ 8 时另写 h 的 FP32 副本（每词 32,768 B）供 router 读","x":"h 同时交给阶段 4 和阶段 5（e3、e4）；stream_1 留到阶段 8（e9，图左的长边）","c":"T = 1：读 16,812,032 B（W_o 16,777,216 + stream_0 32,768 + o_attn 2,048）；写 81,920 B（stream_1 32,768 + h 16,384 + h 的 FP32 副本 32,768）"},{"nm":"router","act":"router 用 h 给 256 个专家打分，选出 8 个","f":"logits = h · W_routerᵀ（GEMM 只写原始分数）；路由核：scores = sigmoid(0.1767767 · logits)；topk_ids = argtop8(scores + b)；topk_weights = scores[ids] / Σ","i":"h：T ≤ 8 读 FP32 副本 FP32 [T, 8192]（每词 32 KiB），T > 8 读 BF16 [T, 8192]（每词 16 KiB）（HBM / L2）；W_router FP32 [256, 8192]（8,388,608 B = 8.4 MB，HBM）；b_router FP32 [256]","o":"topk_ids int32 [T, 8]；topk_weights FP32 [T, 8]（每词各 32 B，写回 HBM / L2）","x":"(topk_ids, topk_weights) 交给阶段 6（e5），与阶段 5 的 p 汇合","c":"T = 1：读 8,421,376 B（W 8,388,608 + h 的 FP32 副本 32,768，不含 b_router 这类小向量）；写 64 B"},{"nm":"pooler + pre_expert_norm","act":"pooler 把 h 从 8192 维压到 4096 维，再做 pre_expert_norm","f":"p = rmsnorm(h · W_poolerᵀ) · (1 + w_pre_expert)","i":"h BF16 [T, 8192]（HBM / L2）；W_pooler BF16 [4096, 8192]（67,108,864 B = 67.1 MB，HBM）","o":"p BF16 [T, 4096]（每词 8,192 B，写回 HBM / L2）","x":"p 交给阶段 6（e6），与阶段 4 的 (topk_ids, topk_weights) 汇合","c":"T = 1：读 67,125,248 B（W 67,108,864 + h 16,384）；写 8,192 B"},{"nm":"experts","act":"专家等 p 与 topk_ids 都到齐，只算本卡命中的专家","f":"h13 = p · dequant(W13[e])ᵀ；inter = silu(h_gate) ⊙ h_up；y = inter · dequant(W2[e])ᵀ；m += w · norm(y)","i":"p BF16 [T, 4096]；topk_ids int32 [T, 8]；topk_weights FP32 [T, 8]；W13 uint8 [32, 8192, 2048]、W2 uint8 [32, 4096, 2048]（E2M1 × 2，本卡 32 个专家，HBM，每个专家 28.3 MB）","o":"m BF16 [T, 4096]（每词 8,192 B，写回 HBM / L2）","x":"m 交给阶段 7（e7）","c":"T = 1：读约 53 MB 专家权重（平均命中约 1.87 个本卡专家 × 28.3 MB）+ p 8,192 B + topk 64 B；写 8,192 B。每个 (词, 专家) 对运算 100.7 MFLOP"},{"nm":"unpooler","act":"unpooler 把 m 从 4096 维升回 8192 维","f":"f = m · W_unpoolerᵀ（T ≤ 8 只算前 1024 列，其余填 0）","i":"m BF16 [T, 4096]；W_unpooler BF16 [8192, 4096]（全矩阵 67.1 MB；T ≤ 8 只读 [1024, 4096] = 8,388,608 B，HBM）","o":"f BF16 [T, 8192]（每词 16,384 B，写回 HBM / L2）","x":"f 交给阶段 8（e8）","c":"T = 1：读 8,396,800 B（W 8,388,608 + m 8,192）；写 16,384 B"},{"nm":"post_ffn_norm + 残差 2 + 下一层预归一化","act":"post_ffn_norm、第二道门控残差与下一层预归一化写出 x_next 和 stream_2","f":"stream_2 = α₂ ⊙ stream_1 + β₂ ⊙ rmsnorm(f · (1 + w_post_ffn))（α₂、β₂ 是 FP32 [8192] 逐通道向量）；x_next = rmsnorm(stream_2) · (1 + w_next_pre_attn)","i":"f BF16 [T, 8192]；stream_1 FP32 [T, 8192]（每词 32 KiB）；w_post_ffn、w_next_pre_attn BF16 [8192]（各 16 KiB，HBM）","o":"stream_2 FP32 [T, 8192]（每词 32 KiB）；x_next BF16 [T, 8192]（每词 16 KiB），都写回 HBM","x":"(x_next, stream_2) 成为第 l + 1 层阶段 1 与阶段 3 的输入（e10）","c":"T = 1：读 81,920 B（f 16,384 + stream_1 32,768 + 两个向量 32,768）；写 49,152 B（stream_2 32,768 + x_next 16,384）"}],"TOTAL":{"t":"整层走完。8 个阶段中只有激活边必须等，权重读取在每一步都可以进行。","f":"阶段 1 → 2 → 3 → (4 ‖ 5) → 6 → 7 → 8","i":"第 l − 1 层的 (x_in BF16 [T, 8192], stream_0 FP32 [T, 8192])；每个阶段的权重和 KV 历史都在 HBM，不依赖上一阶段的数据","o":"(x_next BF16 [T, 8192], stream_2 FP32 [T, 8192])，写在 HBM","x":"交给第 l + 1 层的阶段 1 与阶段 3；62 层严格串行。阶段 2 新写的 K、V 留给之后的 step","c":"T = 1、全长层：读权重和缓存约 211.9 MB（滑窗层 191.9 MB）；激活与残差流读写合计 292,224 B，约占 0.14 %。小向量除阶段 8 的两个以外不计"},"COL":["#3e63dd","#0b9f8c","#8e4ec6","#d98200","#d6409f","#2f9e44","#8a6d3b","#5b6b7f"],"RW":[["第 l − 1 层的 x_in","权重读取不用等"],["阶段 1 的 qkv","权重和 KV 历史读取不用等"],["阶段 2 的 o_attn","权重读取不用等"],["阶段 3 的 h","与阶段 5 互不依赖，权重读取不用等"],["阶段 3 的 h","与阶段 4 互不依赖，权重读取不用等"],["阶段 4 的 topk 和阶段 5 的 p，两路都到才开始","权重读取不用等"],["阶段 6 的 m","权重读取不用等"],["阶段 7 的 f（stream_1 早已写出）","权重读取不用等"]]};

const D=DATA,$=(id)=>document.getElementById(id),readout=document.querySelector("[data-readout]");
const esc_=(s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const nodes=[...document.querySelectorAll(".nd")], eds=[...document.querySelectorAll(".ed")], trs=[...document.querySelectorAll(".tr")];
const N=9, STEP_MS=4000;
const readoutOf=(s)=>{
  if(s===N) return "整层走完：激活只有一条必须串行的主链\n加一处分叉（h → 阶段 4 ‖ 5）、一处汇合（阶段 6）";
  return "阶段 "+s+"："+D.STG[s-1].nm+"\n要等："+D.RW[s-1][0]+"；"+D.RW[s-1][1];
};
function card(c){ $("stepT").textContent=c.t; $("stepK").innerHTML=[["公式",c.f,1],["输入",c.i],["输出",c.o],["交给下一步",c.x],["代价",c.c]].map(r=>"<div><dt>"+r[0]+"</dt><dd"+(r[2]?' class="m"':"")+">"+esc_(r[1])+"</dd></div>").join(""); }
function show(s){
  const K=s===N?0:s;
  $("stepN").textContent=s===N?"总结":"第 "+s+" 步"; $("stepN").style.background=K?D.COL[K-1]:"";
  if(K){ const g=D.STG[K-1]; card({t:"阶段 "+K+"："+g.act+"。",f:g.f,i:g.i,o:g.o,x:g.x,c:g.c}); } else card(D.TOTAL);
  nodes.forEach(g=>{ const q=+g.dataset.n; g.classList.toggle("pend",K>0&&q>K&&!(q===5&&K===4)); g.classList.toggle("cur",q===K); g.classList.toggle("on",q===K); });
  eds.forEach(g=>{ const a=g.dataset.s, d=g.dataset.d; const isW=a==="w";
    const hot=K>0&&(isW?(+d===K):(+a===K||+d===K||(d==="k"&&K===2)));
    g.classList.toggle("hot",hot);
    g.classList.toggle("late",K>0&&!isW&&d!=="k"&&+a>K); });
  const hotIds=new Set(eds.filter(g=>g.classList.contains("hot")&&g.dataset.id).map(g=>g.dataset.id));
  const lateIds=new Set(eds.filter(g=>g.classList.contains("late")&&g.dataset.id).map(g=>g.dataset.id));
  trs.forEach(r=>{ r.classList.toggle("hot",hotIds.has(r.dataset.id)); r.classList.toggle("late",lateIds.has(r.dataset.id)); });
  readout.textContent=readoutOf(s); $("sIn").value=String(s);
}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let step=1, playing=!still, timer=0;
const play=$("play");
function tick(){ step=step%N+1; show(step); }
function setPlay(p){ playing=p; play.textContent=p?"暂停":"播放"; clearInterval(timer); if(p) timer=setInterval(tick,STEP_MS); }
play.addEventListener("click",()=>setPlay(!playing));
$("sIn").addEventListener("input",()=>{ setPlay(false); step=+$("sIn").value; show(step); });
const q=new URLSearchParams(location.search);
step = q.has("s") ? +q.get("s") : (still ? 4 : 4);
show(step); setPlay(playing && !q.has("s"));
</script></body></html>
