lass="nw">线程束</span>）<span class="nw">发出</span><span class="nw">指令，</span><span class="nw">才能</span>藏住<span class="nw">等数据</span>的<span class="nw">时间？</span></span><span class="ch">第 4 章</span></div></li><li class="lv-wrap" style="--d:4"><div class="zm" aria-hidden="true"><span class="zm-ln"></span><span class="zm-tx">放大 ↓</span></div><div class="lv" data-i="4" data-hw="lv:5"><span class="no">第 5 级</span><span class="nm">执行管线</span><span class="qq">指令发出去之后，进哪条<span class="nw">算术</span><span class="nw">执行</span><span class="nw">通道</span><span class="nw">计算？</span></span><span class="ch">第 5 章</span></div></li><li class="lv-wrap" style="--d:5"><div class="zm" aria-hidden="true"><span class="zm-ln"></span><span class="zm-tx">放大 ↓</span></div><div class="lv" data-i="5" data-hw="lv:6"><span class="no">第 6 级</span><span class="nm">指令与比特</span><span class="qq">一行代码怎样变成机器指令和寄存器里的<span class="nw">比特？</span></span><span class="ch">第 6 章</span></div></li></ol></div></div></figure><p class="cap">每一级把上一级当成盒子的地方拆开，回答一个问题；第 1–6 级对应第 1–6 章（缩进与“放大 ↓”表示逐级放大的顺序，不按耗时或容量比例）。本章先站在最外层的第 1 级：时间线。</p></main><script type="module">
