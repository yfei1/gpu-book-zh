      sc.dots.push({a:f2-0.3,b:f2,path:[HW.tileL[i%6],B[i]],col:RQ[1],n:"+1",r:5});
      sc.dots.push({a:0.5+0.15*i,b:0.8+0.15*i,path:[HW.tileL[5],B[i]],col:GR,n:"0",r:5}); sc.dots.push({a:6+0.15*i,b:6.3+0.15*i,path:[HW.tileL[5],A[i]],col:GR,n:"0",r:5}); }
    else { sc.paints.push({sel:'[data-led="A-'+i+'"]',t:5.5+0.12*i,fill:"#fff"}); sc.paints.push({sel:'[data-led="A-'+i+'"]',t:f2,fill:RQ[1]}); sc.dots.push({a:5.8+0.12*i,b:6.1+0.12*i,path:[HW.tileL[5],A[i]],col:GR,n:"0",r:5}); sc.dots.push({a:f2-0.3,b:f2,path:[HW.tileL[i%6],A[i]],col:RQ[1],n:"+1",r:5}); } }
  const FM="<code>done = atomicAdd(&doneA[ledger·1024 + tile], 1)</code>";
  const IN="<code>doneA</code> int32 <code>[2048]</code> = 8,192 B（2 × 1,024 × 4，派生）；每本 1,024 个字 = 4,096 B，位置：全局内存（经 L2）";
  if(two){ sc.segs.push({r:1,a:0.5,b:3,col:GR,txt:"清零奇本"},{r:1,a:6,b:8.5,col:GR,txt:"清零偶本"});
    sc.steps=[
     stp(0.2,"重放 1：各 SM 上的持久 CTA 每做完一个工作分块，就给偶账本的对应格加 1",FM+"，<code>ledger = 重放序号 mod 2 = 0</code>",IN,"偶账本 <code>doneA[0..1023]</code> 里对应格 +1","后继分块的 CTA 读这些计数，知道依赖是否完成","每个分块 1 次 L2 原子加（本图画 16 格示意）",HW.ledA[0],1),
     stp(0.5,"同时，后台 1 个 warp 把奇账本逐格清零，供下一次重放用","<code>for (j = lane; j &lt; 1024; j += 32) doneA[1024 + j] = 0</code>","奇账本 <code>doneA[1024..2047]</code>（上一次重放留下的计数）","奇账本全 0","重放 2 用奇账本","1 个 warp、每个 lane 32 次写，共 1,024 次写（派生）；没有额外 kernel 启动",HW.ledB[0],"零"),
     stp(5.5,"重放 2：持久 CTA 改给奇账本加 1；后台 warp 清零偶账本","<code>ledger = 重放序号 mod 2 = 1</code>；偶账本 <code>= 0</code>",IN,"奇账本对应格 +1；偶账本清零","重放 3 回到偶账本","同样没有额外启动",HW.ledB[3],1),
     stp(T-0.05,"两次重放完成","同上","—","—","—","总代价：0 个额外 kernel 启动；每次重放多 1 个后台 warp 的 1,024 次清零写。P2 实测删掉退出链后省 0.286 µs（verify 16）/ 0.331 µs（verify 32）",HW.ledA[15],16)];
    sc.ro="奇偶双账本：0 个额外 kernel 启动\n后台 warp 清零 1,024 个字"; }
  else { sc.segs.push({r:1,a:5.5,b:7.5,col:GR,txt:"清零 kernel"},{r:1,a:5,b:5.5,cls:"unk"});
    sc.steps=[
     stp(0.2,"重放 1：持久 CTA 每做完一个工作分块，就给账本的对应格加 1",FM+"，只有 1 本账本",IN.replace("2 × 1,024 × 4","此处只用 1 本"),"账本里对应格 +1","后继分块的 CTA 读这些计数","每个分块 1 次 L2 原子加（本图画 16 格示意）",HW.ledA[0],1),
     stp(5.5,"重放 1 结束，必须先把整本账本清零，重放 2 才能用","<code>doneA[0..1023] = 0</code>（清零 kernel）","账本里重放 1 留下的计数","账本全 0","重放 2 开始","多 1 个 kernel 启动 + 1 个节点切换空隙（第 1 章第 1 节）",HW.ledA[5],"零"),
     stp(8.2,"重放 2：持久 CTA 重新给账本加 1","同上","同上","账本对应格 +1","—","清零结束之前，SM 不能开始重放 2",HW.ledA[3],1),
     stp(T-0.05,"两次重放完成","同上","—","—","—","总代价：每轮多 1 个清零 kernel 和 1 个节点切换空隙（对照基线）",HW.ledA[15],16)];
    sc.ro="清零 kernel：每轮多 1 次 kernel 启动\n作为双账本的对照基线"; }
  return sc; }

const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const TL0=132,TL1=620,TY0=26,AX=70;
let g0=1,g1=1,sc=null,t=0,end=1,prevLit=[];
const TX=(x)=>TL0+(TL1-TL0)*x/sc.T;
function along(pts,u){ const segs=[]; let Lt=0; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); Lt+=d;} let s=Math.max(0,Math.min(1,u))*Lt; for(let i=0;i<segs.length;i++){ if(s<=segs[i]){const f=segs[i]?s/segs[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];} s-=segs[i];} return pts[pts.length-1]; }
const pd=(pts)=>"M"+pts.map(p=>p[0]+" "+p[1]).join("L");
function buildFlat(){ const R=sc.rows.length, H=TY0+R*24+10; const f=$("flat"); f.setAttribute("viewBox","0 0 640 "+H);
  let h='<defs><pattern id="hatchg" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" stroke="#777" stroke-width="1" opacity=".7"/></pattern><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" class="hl"/></pattern></defs>';
  h+='<text class="lab2" x="'+TL0+'" y="'+(TY0-10)+'">'+sc.axis+'</text>';
  sc.rows.forEach((r,i)=>{ h+='<text class="rl" x="'+(TL0-8)+'" y="'+(TY0+i*24+13)+'">'+r+'</text><rect class="row" x="'+TL0+'" y="'+(TY0+i*24)+'" width="'+(TL1-TL0)+'" height="18"/>'; });
  h+='<clipPath id="clipT"><rect id="clipR" x="'+TL0+'" y="'+(TY0-4)+'" width="0" height="'+(R*24+8)+'"/></clipPath><g clip-path="url(#clipT)">';
  sc.segs.forEach(s=>{ const y=TY0+s.r*24, x=TX(s.a), w=Math.max(1,TX(s.b)-x-(s.gap||0)); const yy=y+(s.y0!=null?s.y0:2), hh=(s.h!=null?s.h:14);
    h+='<rect '+(s.cls?'class="'+s.cls+'"':'fill="'+s.col+'"')+' x="'+x.toFixed(1)+'" y="'+yy+'" width="'+w.toFixed(1)+'" height="'+hh+'"/>';
    if(s.txt && w>12) h+='<text class="sn" x="'+(x+w/2).toFixed(1)+'" y="'+(yy+hh/2+3.5)+'">'+s.txt+'</text>'; });
  h+='</g><path id="cur" class="cur" d=""/>'; f.innerHTML=h; }
function setScene(){ sc=SCENE(g0,g1); end=sc.T; buildFlat();
  (sc.lit||[]).forEach(l=>{ l.els=[...document.querySelectorAll(l.sel)]; }); (sc.paints||[]).forEach(p=>{ p.els=[...document.querySelectorAll(p.sel)]; });
  document.querySelectorAll("[data-w]").forEach(e=>{ e.style.display=(e.dataset.w.split(",").includes(sc.wkey||String(g1))?"":"none"); });
  document.querySelectorAll("[data-view]").forEach(v=>v.style.display=(v.dataset.view===sc.view?"":"none"));
  prevLit.forEach(e=>e.classList.remove("busy","issue","got")); prevLit=[];
  readout.textContent=sc.ro; $("tIn").max=String(end); t=Math.min(t,end); }
function show(){ const v=sc.view; let dots="";
  sc.dots.forEach(d=>{ if(t>=d.a && (t<d.b||(d.keep&&t<(d.until||1e9)))){ const p=along(d.path,(t-d.a)/(d.b-d.a)); dots+='<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(d.r||6.5)+'" fill="'+d.col+'"/><text class="dn" x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.2).toFixed(1)+'">'+(d.n==null?"":d.n)+'</text>'; } });
  $("dots-"+v).innerHTML=dots;
  const cur=[]; (sc.lit||[]).forEach(l=>{ l.els.forEach(e=>{ if(t>=l.a && t<l.b){ e.classList.add(l.cls||"busy"); cur.push(e);} else if(!cur.includes(e)) e.classList.remove(l.cls||"busy"); }); });
  prevLit=prevLit.filter(e=>cur.includes(e)).concat(cur.filter(e=>!prevLit.includes(e)));
  (sc.paints||[]).forEach(p=>{ p.els.forEach(e=>{ e.style.fill=""; }); });
  (sc.paints||[]).forEach(p=>{ if(t>=p.t && (p.u==null||t<p.u)) p.els.forEach(e=>{ e.style.fill=p.fill; }); });
  const al=sc.algo; let a='<text class="lab2" x="'+AX+'" y="16">'+al.title+'</text>'; const n=al.cells.length, w=(640-AX-14)/n;
  al.cells.forEach((c,i)=>{ const x=AX+i*w, st=t>=c.b?"done":(t>=c.a?"fly":"wait");
    a+='<rect '+(st==="fly"?'fill="'+c.col+'" stroke="#222" stroke-width=".8"':'class="'+(st==="done"?"wdone":"wrow")+'"')+' x="'+(x+1).toFixed(1)+'" y="26" width="'+(w-2).toFixed(1)+'" height="22" rx="3"/>';
    a+='<text class="cn" x="'+(x+w/2).toFixed(1)+'" y="41" fill="'+(st==="fly"?"#fff":"var(--anatomy-strong)")+'">'+c.lab+'</text>'; if(c.sub) a+='<text class="tn" x="'+(x+w/2).toFixed(1)+'" y="62" text-anchor="middle">'+c.sub+'</text>'; });
  $("alg").innerHTML=a;
  let k=-1; for(let i=0;i<sc.steps.length;i++){ if(sc.steps[i].t<=t+1e-9) k=i; else break; }
  const nb=$("stepN"), st=$("stepT"), rw=$("stepR"); let f="";
  if(k<0){ nb.textContent=""; st.textContent="按播放，或拖动时间"; rw.innerHTML=""; } else { const e=sc.steps[k]; nb.textContent="第 "+(k+1)+" 步"; st.textContent=e.x;
    rw.innerHTML=[["公式",e.fm],["输入",e.in],["输出",e.out],["交给下一步",e.nx],["代价",e.c]].map(r=>'<dt'+(r[0]==="代价"?' class="cost"':'')+'>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join("");
    if(e.f) f='<circle class="fr" cx="'+e.f[0]+'" cy="'+e.f[1]+'" r="'+(e.rr||10)+'"/>'+(e.n!=null?'<text class="fn" x="'+e.f[0]+'" y="'+(e.f[1]-(e.rr||10)-3)+'">'+e.n+'</text>':""); }
  $("focus-"+v).innerHTML=f;
  const R=sc.rows.length; const cx=TX(Math.min(t,end)); $("clipR").setAttribute("width",(cx-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+cx.toFixed(1)+" "+(TY0-4)+"V"+(TY0+R*24)); $("tIn").value=String(t); }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*end/14); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
function radios(id,name,opts,sel,cb){ $(id).innerHTML=opts.map((o,i)=>'<label><input type="radio" name="'+name+'" value="'+(i+1)+'"'+(i+1===sel?" checked":"")+'>'+o+'</label>').join(""); $(id).querySelectorAll("input").forEach(r=>r.addEventListener("change",()=>cb(+r.value))); }
function again(){ setScene(); t=0; hold=0; setPlay(!still); if(still){ t=end*0.6; show(); } }
function build1(){ radios("g1","way",G1[g0-1],g1,(v)=>{ g1=v; again(); }); }
const q=new URLSearchParams(location.search); g0=+(q.get("m")||1); g1=+(q.get("w")||1);
radios("g0","scene",G0,g0,(v)=>{ g0=v; g1=Math.min(g1,G1[g0-1].length); build1(); again(); }); build1(); if(G0.length<2){ $("g0").style.display="none"; $("gl0").style.display="none"; } setScene();
t = q.has("t") ? +q.get("t") : (still ? end*0.6 : 0); show(); if(playing) start(); else play.textContent="播放";
</script></body></html>
