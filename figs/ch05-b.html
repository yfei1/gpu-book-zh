const cl=(v,a,b)=>Math.max(a,Math.min(b,v)); let T=8, IN=[], Nn=8;
function plan(md){ IN=[]; const tabs=md===3?RS:SS;

  else if(md===4){ Nn=128; IN.push({i:0,n:1,s:-1,ts:0,te:tabs[128],u:[0,1,2,3].map(s=>cl(T-16*s,0,16)/16),all:true,r:0}); }
  else { Nn=Math.max(8,T); const pc=tabs[Nn]; for(let j=0;j<2;j++) IN.push({i:j,n:j+1,s:-1,ts:j*pc,te:(j+1)*pc,u:[1,1,1,1].map(()=>T/Nn),all:true,r:j}); }
  end=Math.max(...IN.map(x=>x.te)); }
const total=()=>end, useful=()=>T/end;
const pct=(v)=>(v*100).toFixed(v*100<10?1:0).replace(/\.0$/,"")+"%";
function events(md){ const E=[]; const reg4=md===1?"每个线程放 A 4 个 + B 2 个 + D 4 个 = 10 个寄存器":"";
  if(md===1){ const R=IN[IN.length-1].r+1; for(let r=0;r<R;r++){ const grp=IN.filter(x=>x.r===r); E.push({t:r*HMMA,f:[...TCP[0],grp[0].n,11],s:"第 "+(r+1)+" 轮：4 个 warp 各发 1 条 mma.sync（权重行块 "+grp.map(x=>x.n).join("、")+"），A、B 先经 ldmatrix 进各自寄存器。代价：每条占本 SMSP 张量管线 "+HMMA+" 周期；"+reg4+"；另有 2 条 ldmatrix 读 SMEM"}); }
    E.push({t:end,s:"总代价："+IN.length+" 条 mma.sync（每个 SMSP "+IN.length/4+" 条），张量管线 "+end+" 周期，有用算力 "+pct(useful())+"（上限约 67%）；A、B 都要先经 LSU 读进寄存器"}); }
  else { IN.forEach(x=>{ const pc=x.te-x.ts, A=md===3?"A 取自寄存器":"A 取自 SMEM";
      E.push({t:x.ts,f:[...SMEM,x.n,10],s:"warpgroup 的 4 个 warp 同时发第 "+x.n+" 条 wgmma（N = "+Nn+"，"+A+"，B 由描述符从 SMEM 读）。代价：1 条 wgmma = 4 条 warp 指令，张量管线 "+pc.toFixed(0)+" 周期；D 占每个线程 "+Nn/2+" 个寄存器"+(md===4?"":"")});

  return E.sort((a,b)=>a.t-b.t); }

  if(u!=null&&u<1) s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(18*u).toFixed(1)+'" height="11" rx="2" fill="'+col(n-1)+'"/>';

function show(){ const md=mode; let dots="", lit=[false,false,false,false], lsuL=[false,false,false,false];

  if(md===1){ const w=W/8; for(let i=0;i<8;i++){ const ins=IN.filter(x=>x.n===i+1); const st=ins.every(x=>t>=x.te)?"done":ins.some(x=>t>=x.ts)?"fly":"wait"; const x0=AX+i*w;

    ar+='<text class="tn" x="'+AX+'" y="'+(AY+54)+'">每块再按 '+Math.ceil(T/8)+' 个 token 列块各发 1 条，共 '+IN.length+' 条</text>'; }
  else if(md===4){ const ins=IN[0]; const st=t>=ins.te?"done":t>=ins.ts?"fly":"wait"; const uw=W*Math.min(T,64)/64;
    ar+='<rect class="tw" x="'+AX+'" y="'+AY+'" width="'+W+'" height="20"/><rect fill="'+col(0)+'" '+(st==="done"?'class="wdone" ':'')+'x="'+AX+'" y="'+AY+'" width="'+Math.max(2,uw).toFixed(1)+'" height="20"/><text class="bn" style="fill:var(--anatomy-strong)" x="'+(AX+W/2).toFixed(1)+'" y="'+(AY+14)+'">1：M 维 64 行，有用 '+Math.min(T,64)+' 行（token），零填充 '+(64-Math.min(T,64))+' 行</text><text class="tn" x="'+AX+'" y="'+(AY+34)+'">N 维 = 128 个权重行，一条 wgmma 算完</text>'; }
  else { const w=W/2; for(let i=0;i<2;i++){ const ins=IN[i]; const st=t>=ins.te?"done":t>=ins.ts?"fly":"wait"; const x0=AX+i*w;
      ar+='<rect '+(st==="wait"?'class="wrow"':'fill="'+col(i)+'"'+(st==="done"?' class="wdone"':''))+' x="'+(x0+1).toFixed(1)+'" y="'+AY+'" width="'+(w-2).toFixed(1)+'" height="20"/><text class="bn" style="'+(st==="wait"?'fill:var(--anatomy-text)':'')+'" x="'+(x0+w/2).toFixed(1)+'" y="'+(AY+14)+'">'+(i+1)+'：权重行 '+(64*i)+'–'+(64*i+63)+'</text><text class="tn" text-anchor="middle" x="'+(x0+w/2).toFixed(1)+'" y="'+(AY+34)+'">N = '+Nn+' 列，有用 '+Math.min(T,Nn)+' 列</text>'; } }
  $("algR").innerHTML=ar; finish(); }

const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const col=(n)=>"hsl("+((n*53+205)%360)+" 55% 46%)";
let mode=1, t=0, end=1, EV=[];
const TX=(x)=>TL0+(TL1-TL0)*x/Math.max(AXMAX,1);
function along(pts,u){ const segs=[]; let Lt=0; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); Lt+=d;} let s=Math.max(0,Math.min(1,u))*Lt; for(let i=0;i<segs.length;i++){ if(s<=segs[i]){const f=segs[i]?s/segs[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];} s-=segs[i];} return pts[pts.length-1]; }
const tok=(p,n,r)=>'<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(r||6)+'" fill="'+col(n)+'"/><text class="dn" x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.2).toFixed(1)+'">'+n+'</text>';
const bar=(a,b,y,fill,n,cls)=>{ const w=Math.max(1,TX(b)-TX(a)-0.6); return '<rect '+(cls?'class="'+cls+'" ':'')+(fill?'fill="'+fill+'" ':'')+'x="'+TX(a).toFixed(1)+'" y="'+(y+2)+'" width="'+w.toFixed(1)+'" height="14"/>'+(n!=null&&w>9?'<text class="bn" x="'+(TX(a)+w/2).toFixed(1)+'" y="'+(y+12.2)+'">'+n+'</text>':''); };
function drawAxis(step,unit){ let h='<text class="lab2" x="'+TL0+'" y="'+(TY0-10)+'">'+unit+'</text>'; for(let v=0;v<=AXMAX+1e-9;v+=step){ h+='<path d="M'+TX(v).toFixed(1)+' '+(TY0+NROW*24)+'v4" stroke="var(--anatomy-faint)" stroke-width=".8"/><text class="ax" x="'+TX(v).toFixed(1)+'" y="'+(TY0+NROW*24+15)+'">'+v+'</text>'; } $("ax").innerHTML=h; }
function finish(){ const tt=Math.min(t,end); $("clipR").setAttribute("width",(TX(tt)-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(tt).toFixed(1)+" "+(TY0-4)+"V"+(TY0+NROW*24)); $("tIn").value=String(t);
  let k_=-1; for(let i=0;i<EV.length;i++){ if(EV[i].t<=t+1e-9) k_=i; else break; }
  const n=$("stepN"), s=$("stepT"); let f="";
  if(k_<0){ n.textContent=""; s.textContent="按播放，或拖动时间"; } else { const e=EV[k_]; n.textContent="第 "+(k_+1)+" 步"; s.textContent=e.s; if(e.f) f='<circle class="fr" cx="'+e.f[0]+'" cy="'+e.f[1]+'" r="'+(e.f[3]||9)+'"/><text class="fn" x="'+e.f[0]+'" y="'+(e.f[1]-(e.f[3]||9)-3)+'">'+e.f[2]+'</text>'; }
  $("focus").innerHTML=f; }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*SPD); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));

  const q=new URLSearchParams(location.search); t = q.has("t") ? +q.get("t") : (still ? end*tStill : 0); show(); if(playing) start(); else play.textContent="播放"; }
document.querySelectorAll("input[name=tk]").forEach(r=>r.addEventListener("change",()=>{ setMode(mode); t=0; hold=0; setPlay(!still); if(still){t=end*0.6;show();} }));
