const esc_=(s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const HUES=CFG.hues, pal=(i)=>"hsl("+HUES[i%8]+" 55% 46%)";
function card(c){ $("stepT").innerHTML=c.t||""; const K=$("stepK"); if(!c.f){ K.innerHTML=""; return; }
  K.innerHTML=[["公式",c.f],["输入",c.i],["输出",c.o],["交给下一步",c.x],["代价",c.c]].map(r=>"<div><dt>"+r[0]+"</dt><dd>"+r[1]+"</dd></div>").join(""); }
function along(pts,u){ const segs=[]; let Lt=0; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); Lt+=d;} let s=Math.max(0,Math.min(1,u))*Lt; for(let i=0;i<segs.length;i++){ if(s<=segs[i]){const f=segs[i]?s/segs[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];} s-=segs[i];} return pts[pts.length-1]; }
const pd=(pts)=>"M"+pts.map(p=>p[0]+" "+p[1]).join("L");
let mode=1, M=null, end=1, t=0, EV=[], FX=[], FXC=[];
const TL0=CFG.tl0, TL1=CFG.tl1, TY0=26; let PITCH=24, RH=18;
let TX=(x)=>x, TLT=[];
function buildTL(){ const tl=M.tl, n=tl.rows.length; PITCH=tl.pitch||24; RH=tl.rowh||18; TX=(x)=>TL0+(TL1-TL0)*x/tl.T; const H=TY0+n*PITCH+18;
  let h='<svg class="flat" viewBox="0 0 640 '+H+'" role="img" aria-label="'+esc_(tl.title)+'"><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" class="hl"/></pattern><pattern id="hatchF" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" class="hf"/></pattern></defs>';
  h+='<text class="lab2" x="'+TL0+'" y="'+(TY0-10)+'">'+esc_(tl.title)+'</text>';
  tl.rows.forEach((r,i)=>{ h+='<text class="rl" x="'+(TL0-8)+'" y="'+(TY0+i*PITCH+RH*0.72)+'">'+esc_(r)+'</text><rect class="row" x="'+TL0+'" y="'+(TY0+i*PITCH)+'" width="'+(TL1-TL0)+'" height="'+RH+'"/>'; });
  h+='<clipPath id="clipT"><rect id="clipR" x="'+TL0+'" y="'+(TY0-4)+'" width="0" height="'+(n*PITCH+20)+'"/></clipPath><g clip-path="url(#clipT)">';
  tl.bars.forEach(b=>{ const x=TX(b.a), w=Math.max(b.minw||1.2,TX(b.b)-TX(b.a)-(b.gap==null?0.6:b.gap)); const y=TY0+b.r*PITCH+(RH>=18?2:1), hh=RH-(RH>=18?4:2);
    const fill=b.c!=null?' fill="'+pal(b.c)+'"':""; h+='<rect class="'+(b.cls||"rd")+'" x="'+x.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+hh+'"'+fill+'/>';
    if(b.txt) h+='<text class="bt" x="'+(x+w/2).toFixed(1)+'" y="'+(y+hh*0.75)+'">'+esc_(b.txt)+'</text>'; });
  (tl.div||[]).forEach(d=>{ h+='<path class="div" d="M'+TX(d.t)+' '+(TY0-14)+'V'+(TY0+n*PITCH)+'"/><text class="lab2" x="'+(TX(d.t)+4)+'" y="'+(TY0+n*PITCH+9)+'">'+esc_(d.label)+'</text>'; });
  h+='</g><path id="cur" class="cur" d=""/></svg>'; $("tlHost").innerHTML=h; TLT=[...$("tlHost").querySelectorAll("text.bt")].map(x=>{ const b=x.getBBox(); return [x,b.x+b.width]; }); }
function setMode(md){ FX.forEach(f=>f.els.forEach(e=>FXC.forEach(c=>e.classList.remove(c)))); mode=md; M=CFG.modes[md-1]; end=M.tl.T; t=Math.min(t,end);
  $("algHost").innerHTML='<svg class="flat" viewBox="0 0 640 '+M.algH+'" role="img" aria-label="'+esc_(M.algAria)+'">'+M.alg+'<g id="algO"></g></svg>';
  $("links").innerHTML=(M.links||[]).map(r=>'<path class="lk" d="'+pd(r)+'"/>').join("");
  buildTL(); readout.textContent=M.ro; $("tIn").max=String(end);
  EV=M.events.slice().sort((a,b)=>a.t-b.t); FX=(M.fx||[]).map(f=>({...f,els:[...document.querySelectorAll(f.sel)]}));
  FXC=[...new Set(FX.flatMap(f=>f.cls.split(" ")))];
  if($("mlabs")) $("mlabs").innerHTML=(M.labels||[]).map(l=>'<text class="'+(l.cls||"lab")+'" x="'+l.p[0]+'" y="'+l.p[1]+'"'+(l.a?' text-anchor="'+l.a+'"':"")+'>'+esc_(l.t)+'</text>').join(""); }
function show(){ const tt=Math.min(t,end);
  const all=new Set(FX.flatMap(f=>f.els)); all.forEach(e=>FXC.forEach(c=>e.classList.remove(c)));
  FX.forEach(f=>{ if(tt>=f.t0 && tt<(f.t1==null?1e9:f.t1)) f.els.forEach(e=>f.cls.split(" ").forEach(c=>e.classList.add(c))); });
  let dots=""; (M.dots||[]).forEach(d=>{ if(tt>=d.t0 && tt<d.t1){ const p=along(d.route,(tt-d.t0)/(d.t1-d.t0)); dots+='<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(d.r||2.8)+'" fill="'+(d.c!=null?pal(d.c):"var(--anatomy-blue)")+'"/>'; } });
  $("dots").innerHTML=dots;
  TLT.forEach(([x,r])=>{ x.style.visibility=r<=TX(tt)+0.5?"visible":"hidden"; }); $("clipR").setAttribute("width",(TX(tt)-TL0+1).toFixed(1)); const n=M.tl.rows.length; $("cur").setAttribute("d","M"+TX(tt).toFixed(1)+" "+(TY0-4)+"V"+(TY0+n*PITCH)); $("tIn").value=String(t);
  let k_=-1; for(let i=0;i<EV.length;i++){ if(EV[i].t<=tt+1e-9) k_=i; else break; }
  const N=$("stepN"), A=$("algO");
  if(k_<0){ N.textContent=""; card({t:"按播放，或拖动时间"}); $("focus").innerHTML=""; A.innerHTML=""; return; }
  const e=EV[k_]; N.textContent="第 "+(k_+1)+" 步"; card(Object.assign({t:e.s},e.card||{}));
  $("focus").innerHTML=(e.ring||[]).map(r=>'<circle class="fr" cx="'+r[0]+'" cy="'+r[1]+'" r="'+(r[3]||9)+'"/>'+(r[2]!=null?'<text class="fn" x="'+r[0]+'" y="'+(r[1]-10)+'">'+r[2]+'</text>':"")).join("");
  A.innerHTML=(e.chip||[]).map(i=>{ const c=M.chips[i]; return '<rect class="ao" x="'+c[0]+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[3]+'"/>'; }).join(""); }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*CFG.speed); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(!still); if(still){ t=end*0.5; show(); } }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t")*end : (still ? end*0.5 : 0); show(); if(playing) start(); else play.textContent="播放";
</script></body></html>
