 h+='<text class="lab2" x="18" y="112">KV cache（FP8，每格 256 B）：横向 = 62 层，每层各有一份；纵向 = 位置 1 … 13</text>';
 for(let l=0;l<62;l++) h+='<rect x="'+(GX0+l*CW)+'" y="117" width="'+(CW-0.8)+'" height="4" fill="'+(isFull(l)?"var(--anatomy-strong)":"var(--anatomy-faint)")+'" opacity="'+(isFull(l)?1:.45)+'"/>';
 for(let p=1;p<=13;p++){ h+='<text class="tm" x="'+(GX0-6)+'" y="'+(GY0+(p-1)*CH+5.2)+'" text-anchor="end">'+p+'</text>'; for(let l=0;l<62;l++) h+='<rect class="gc" id="g'+l+"_"+p+'" x="'+(GX0+l*CW)+'" y="'+(GY0+(p-1)*CH)+'" width="'+(CW-0.8)+'" height="'+(CH-0.8)+'"/>'; }
 h+='<rect class="cl" id="gcl" x="0" y="'+(GY0-2)+'" width="'+(CW)+'" height="'+(13*CH+3)+'" style="display:none"/>';
 h+='<text class="tn" x="'+GX0+'" y="'+(GY0+13*CH+13)+'">层 0</text><text class="tn" x="'+(GX0+62*CW-CW)+'" y="'+(GY0+13*CH+13)+'" text-anchor="end">层 61</text><text class="tm" x="'+(GX0+62*CW+6)+'" y="121">深 = 全长层</text><text class="tm" x="'+(GX0+62*CW+6)+'" y="132">浅 = 滑窗层</text>';
 a.innerHTML=h; stripKey=""; }
function updStrip(){ const ld=t<L0?0:Math.min(62,Math.floor((t-L0)/LT)), act=(t>=L0&&t<L0+62*LT)?layerNow():-1, loc=act>=0?((t-L0)/LT-act):0, k_=stepOf();
 const key=mode+":"+k_+":"+ld+":"+(loc>=0.5?1:0); if(key===stripKey) return; stripKey=key;
 const boxes=$("alg").querySelectorAll(".sb");
 boxes.forEach((b,i)=>{ b.setAttribute("class","sb"+(i<k_?" dn":i===k_?" on":"")); });
 const lbl=[...$("alg").querySelectorAll("text.st")].filter(e=>/^\d /.test(e.textContent)); lbl.forEach((e,i)=>e.setAttribute("class","st"+(i===k_?" on":"")));
 for(let l=0;l<62;l++){ const wr=(l<ld)||(l===act&&loc>=0.5);
  for(let p=1;p<=13;p++){ const e=document.getElementById("g"+l+"_"+p); let f="", o="";
   if(p<=M.c){ f=col(p); o=".5"; } else if(M.pos.indexOf(p)>=0 && wr){ f=col(p); o="1"; }
   if(f){ e.setAttribute("fill",f); e.setAttribute("opacity",o); e.setAttribute("class","gf"); } else { e.removeAttribute("fill"); e.removeAttribute("opacity"); e.setAttribute("class","gc"); } } }
 const cl=$("gcl"); if(act>=0&&t<L0+62*LT){ cl.style.display=""; cl.setAttribute("x",GX0+act*CW-0.5); cl.setAttribute("height",(M.vis*CH+3)); } else cl.style.display="none"; }

// timeline
function stripes(a,b,row,cs,extra){ const n=cs.length, h=12/n; let s=""; cs.forEach((c,j)=>{ s+='<rect x="'+TX(a).toFixed(1)+'" y="'+(TY0+row*24+3+j*h).toFixed(2)+'" width="'+Math.max(0.8,TX(b)-TX(a)-0.5).toFixed(1)+'" height="'+h.toFixed(2)+'" fill="'+c+'"/>'; }); return s; }
function buildTL(){ const cf=cols(M.pos), cr=M.R===1?[col(M.pos[M.pos.length-1])]:cf; let h="";
 h+=stripes(EVT[0],EVT[1],0,cf); h+=stripes(EVT[1],EVT[2],1,cf);
 for(let l=0;l<62;l++){ const a=L0+l*LT, b=a+LT; h+=stripes(a,b,2,cf); if(isFull(l)) h+='<rect x="'+TX(a).toFixed(1)+'" y="'+(TY0+2*24)+'" width="'+Math.max(0.8,TX(b)-TX(a)-0.5).toFixed(1)+'" height="2" fill="var(--anatomy-strong)"/>';
  const kw=M.L, kr=M.vis, w_=Math.max(0.8,TX(LT/2)-TX(0)-0.3);
  h+='<rect x="'+(TX(a+LT/2)).toFixed(1)+'" y="'+(TY0+5*24+17-kw).toFixed(1)+'" width="'+w_.toFixed(1)+'" height="'+kw+'" fill="var(--anatomy-blue)"/>';
  h+='<rect x="'+(TX(a)).toFixed(1)+'" y="'+(TY0+6*24+17-kr).toFixed(1)+'" width="'+w_.toFixed(1)+'" height="'+kr+'" fill="var(--anatomy-mid)"/>'; }
 h+=stripes(EVT[3],EVT[4],3,cr); h+=stripes(EVT[4],EVT[5],3,cr);
 h+=stripes(EVT[5],EVT[6],4,cr); h+=stripes(EVT[6],EVT[7],4,cr); h+=stripes(EVT[7],T_END,4,M.out?[col(M.out)]:cf);
 $("tl").innerHTML=h; }

// anatomy
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function along(pts,u){ const segs=[]; let Lt=0; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); Lt+=d;} let s=clamp(u,0,1)*Lt; for(let i=0;i<segs.length;i++){ if(s<=segs[i]){const f=segs[i]?s/segs[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];} s-=segs[i];} return pts[pts.length-1]; }
const pd=(pts)=>"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L");
const dotS=(p,c,r)=>'<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(r||3.2)+'" fill="'+c+'"/>';
let lit={sl:[0,0,0,0,0,0],l2:0,sm:0}, litKey="";
function anatomy(){ let g="", d="", lk=""; const sl=[0,0,0,0,0,0]; let l2=0, sm=0; const cs=cols(M.pos), n=cs.length;
 const train=(path,u,cl,rr)=>{ cl.forEach((c,j)=>{ const uu=clamp(u*(1+0.07*(n-1))-0.07*j,0,1); d+=dotS(along(path,uu),c,rr); }); };
 const cluster=(cl)=>{ const m_=cl.length; cl.forEach((c,j)=>{ const a=2*Math.PI*j/m_+t*0.4, r=m_>1?7:0; d+=dotS([TILE[0]+r*Math.cos(a),TILE[1]+r*0.55*Math.sin(a)],c,3.2); }); };
 const wdot=(path,u)=>{ g+=dotS(along(path,u),GREY,2.4); };
 if(t<EVT[2]-4){ // tokenize
  const u=t/3; lk+='<path class="lkp" d="'+pd([CPU,ST[0]])+'"/>'; train([CPU,ST[0]],clamp(u,0,1),cs); if(u>0.6) sl[0]=1;
 } else if(t<L0){ const u=(t-3)/4; sl[0]=1; l2=u>0.4?1:0; sm=u>0.8?1:0; lk+='<path class="lkp" d="'+pd([ST[0],L2,TILE])+'"/>'; train([ST[0],L2,TILE],u,cs); }
 else if(t<56){ cluster(cs); sm=1; l2=1;
  if(t<L0+62*LT){ const l=layerNow(), loc=(t-L0)/LT-l, s=l%6, st=ST[s];
   if(loc<0.5){ for(let q=0;q<6;q++){ sl[q]=1; for(let r=0;r<2;r++) wdot([ST[q],L2,TILE],(loc*2*1.5+q/6+r*0.5)%1); }
     if(M.c>0 || M.vis>M.L){ const old=cols(Array.from({length:M.c},(_,i)=>i+1)); old.forEach((c,j)=>{ const uu=clamp(loc*2*1.2-0.05*j,0,1); d+=dotS(along([st,L2,TILE],uu),c,2.8); }); } }
   else { sl[s]=1; train([TILE,L2,st],(loc-0.5)*2,cs,2.8); lk+='<path class="lkp" d="'+pd([TILE,L2,st])+'"/>'; } }
  else if(t<EVT[4]){ sl[1]=1; }
  else if(t<EVT[5]){ const u=(t-EVT[4])/(EVT[5]-EVT[4]); for(let q=0;q<6;q++){ sl[q]=1; for(let r=0;r<3;r++) wdot([ST[q],L2,TILE],(u*3+q/6+r/3)%1); } }
 } else { const u=(t-56)/4; sm=u<0.5?1:0; l2=1; sl[0]=u>0.6?1:0; const rc=M.out?[col(M.out)]:cs; lk+='<path class="lkp" d="'+pd([TILE,L2,ST[0]])+'"/>'; rc.forEach((c,j)=>{ const m_=rc.length; const uu=clamp(u*(1+0.07*(m_-1))-0.07*j,0,1); d+=dotS(along([TILE,L2,ST[0]],uu),c,3.4); }); }
 $("lk").innerHTML=lk; $("dots").innerHTML=g+d;
 const key=sl.join("")+l2+sm+(t<3?"c":""); if(key!==litKey){ litKey=key;
  document.querySelectorAll("[data-hb]").forEach((e,i)=>e.classList.toggle("off",!sl[i]));
  document.querySelectorAll("[data-sm]").forEach(e=>e.classList.toggle("issue",!!sm)); } }

function show(){
 const k_=stepOf(); let e;
 if(k_===2) e=layerCard(layerNow()); else e=EVS[k_];
 const lnow=k_===2?layerNow():-1;
 $("stepN").textContent="第 "+(k_+1)+" 步"+(k_===2?" · 第 "+lnow+" 层":"");
 const sc=splitCost(e.s); card(sc,{f:e.f,i:e.i,o:e.o,x:e.x});
 const p=ringAt(k_); $("focus").innerHTML='<circle class="fr" cx="'+p[0]+'" cy="'+p[1]+'" r="9"/><circle class="rb" cx="'+(p[0]-9)+'" cy="'+(p[1]-9)+'" r="8.5"/><text class="rn" x="'+(p[0]-9)+'" y="'+(p[1]-5.4)+'">'+(k_+1)+'</text>';
 anatomy(); updStrip();
 $("clipR").setAttribute("width",(TX(Math.min(t,T_END))-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(Math.min(t,T_END)).toFixed(1)+" "+(TY0-4)+"V"+(TY0+7*24)); $("tIn").value=String(t); }
function setMode(md){ mode=md; M=MODES[md]; EVS=steps(); readout.textContent=RO[md]; buildStrip(); buildTL(); litKey=""; }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<T_END) t=Math.min(T_END,t+dt*5); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=T_END){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ setPlay(false); t=+$("tIn").value; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(true); }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? 17.5 : 0); show(); if(playing) start(); else play.textContent="播放";
</script></body></html>
