function algDraw(e){ let L="", R="", T2="";

    const cu=(e&&e.cu)||{k:"C"}; const sl=(cu.blk!=null||cu.k!=="C")?LANE:null;

    else if(cu.k==="B") ttl="B 片段 W[n × k]：格内数字 = 线程号；蓝格 = 线程 "+LANE+" 的 b0…b3";

  } else {

    const tile=(y,nm)=>{ let h='<text class="tn" x="8" y="'+(y+25)+'">'+nm+'</text>'; for(let s=0;s<ns;s++){ const on=cur===s; h+='<rect fill="'+WC[s]+'" opacity="'+(t>=SL[s].dep?1:0.5)+'" x="'+(32+s*sw)+'" y="'+y+'" width="'+(sw-1)+'" height="44" rx="2"/><text class="tw" x="'+(32+s*sw+sw/2)+'" y="'+(y+26)+'">'+(s+1)+'</text>'+(on?'<rect class="ao" x="'+(32+s*sw)+'" y="'+y+'" width="'+(sw-1)+'" height="44"/>':''); } return h+'<text class="tg" x="'+(32+wpx/2)+'" y="'+(y+58)+'">64 行 × K = 64（每行 '+(fp8?64:128)+' B）</text>'; };

    R+=row(76,"BF16：每行 K = 64 → 128 B = 4 片 × 32 B，每片 16 个元素（k16）",mode===3,4,16,2);
    R+=row(138,"FP8：每行 K = 64 → 64 B = 2 片 × 32 B，每片 32 个元素（k32）",mode===4,2,32,1);
    R+='<text class="tg" x="'+(GX-8)+'" y="190" style="text-anchor:start">横轴 = 字节（2 像素 = 1 B）；竖线 = 元素边界</text><text class="tg" x="'+(GX-8)+'" y="205" style="text-anchor:start">每片的字节数相同（32 B / 行），K 是 16 或 32</text>';
  }
  $("algT").textContent="算法：一个 warpgroup 算 D[64, 64] += x[64, K] · W[64, K]ᵀ（N = 64，FP32 累加）";
  $("algT2").textContent=T2; $("algL").innerHTML=L; $("algR").innerHTML=R; }

/* ---------- mode setup and timeline ---------- */
function setMode(md){
  mode=md; EV=mk(md); readout.textContent=MODES[md].ro;
  const names=md<=2?["warp 0","warp 1","warp 2","warp 3","寄存器里的块","SMEM 收到的块"]:["warp 0","warp 1","warp 2","warp 3","Tensor Core（片号）","累加寄存器 D"];
  $("rows").innerHTML=names.map((r,i)=>'<text class="rl" x="'+(TL0-8)+'" y="'+(TY0+i*24+13)+'">'+r+'</text><rect class="row" x="'+TL0+'" y="'+(TY0+i*24)+'" width="'+(TL1-TL0)+'" height="18"/>').join("");
  $("tlT").textContent="同一过程中，每个 warp 依次在做什么（只表示先后，条的长短不代表周期）";
  let h="";
  if(md<=2){
    for(let w=0;w<4;w++){ const y=TY0+w*24;
      if(md===1){ h+=bar(0.6,5.5,y,"free"); h+=tick(0,y,"#3e63dd"); }
      if(md===2){ h+=tick(0,y,"#555"); for(let q=0;q<4;q++) h+=tick(4+q*0.3,y,"#555"); BL.filter(b=>b.w===w).forEach(b=>{ h+=tick(b.dep,y,WC[w]); }); }
      for(let p=0;p<4;p++) h+=tick(BL[w*8+p*2].dep2,y,"#d9822b"); }
    h+=bar(BL[0].arr,BL[31].arr2,TY0+4*24,"regb");
    BL.forEach(b=>{ h+='<rect fill="'+b.col+'" x="'+(TX(b.arr2)-1).toFixed(1)+'" y="'+(TY0+5*24+3)+'" width="2.4" height="12"/>'; });
  } else {
    for(let w=0;w<4;w++) SL.forEach(s=>{ h+=tick(s.dep,TY0+w*24,s.col); });
    SL.forEach(s=>{ h+=bar(s.dep,s.arr+0.6,TY0+4*24,"",s.col); h+='<text class="tw" x="'+((TX(s.dep)+TX(s.arr+0.6))/2).toFixed(1)+'" y="'+(TY0+4*24+13)+'">'+(s.s+1)+'</text>'; });
    h+=bar(0,end,TY0+5*24,"regb"); SL.forEach(s=>{ h+=tick(s.arr,TY0+5*24,"#111"); });
  }
  $("tl").innerHTML=h; $("tIn").max=String(end); $("tIn").step="0.05"; t=Math.min(t,end);
  let lk=""; for(let w=0;w<4;w++) lk+='<path class="lk" d="'+pd([TC[w],REG[w]])+'"/><path class="lk" d="'+pd([REG[w],LSU[w],DST[w*8+3]])+'"/>';
  if(md===2) for(let w=0;w<4;w++) lk+='<path class="lk" d="'+pd([SMEM,LSU[w],REG[w]])+'"/>';
  if(md>=3) lk="";
  $("links").innerHTML=lk;
}
function ringPos(r){ if(r[0]==="blk") return [REG[BL[r[1]].w],String(r[1]+1)]; if(r[0]==="cell") return [DST[r[1]],r[2]||String(r[1]+1)]; if(r[0]==="tc") return [TC[r[1]],r[2]||""]; if(r[0]==="smem") return [SMEM,""]; return [REG[0],""]; }
function show(){
  let dots="", got=0; const issue=[0,0,0,0], regBusy=[0,0,0,0], lsuBusy=[0,0,0,0], tcBusy=[0,0,0,0]; let smemBusy=false;
  cells.forEach((c,i)=>{ c.classList.remove("c0","c1","c2","c3","gone","dim"); });
  if(mode<=2){
    BL.forEach(b=>{
      if(t>=b.dep&&t<b.arr){ const p=along([TC[b.w],REG[b.w]],(t-b.dep)/(b.arr-b.dep)); dots+=tok(p,b.i+1,b.col); tcBusy[b.w]=1; }
      if(t>=b.arr) regBusy[b.w]=1;
      if(t>=b.dep2&&t<b.arr2){ const p=along([REG[b.w],LSU[b.w],DST[b.i]],(t-b.dep2)/(b.arr2-b.dep2)); dots+=tok(p,b.i+1,b.col); lsuBusy[b.w]=1; }
      if(t>=b.arr2){ cells[b.i].classList.add("c"+b.w); got++; }
      if(t>=b.dep&&t<b.dep+1) issue[b.w]=1;
    });
    if(mode===1&&t>=0&&t<1.2) for(let w=0;w<4;w++){ issue[w]=1; tcBusy[w]=1; }
    OP.forEach(o=>{ if(t>=o.dep&&t<o.arr){ smemBusy=true; for(let w=0;w<4;w++){ const p=along([SMEM,LSU[w],REG[w]],(t-o.dep)/(o.arr-o.dep)); dots+='<circle class="dot" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="6" fill="#555"/><text class="dn" x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.2).toFixed(1)+'">'+o.n+'</text>'; lsuBusy[w]=1; issue[w]=1; } }
      if(t>=o.arr) for(let w=0;w<4;w++) regBusy[w]=1; });
  } else {
    const ns=SL.length;
    cells.forEach((c,i)=>{ const s=Math.floor(i/8); if(s<ns){ c.classList.add("c"+s); const act=SL[s].dep<=t&&t<SL[s].arr+0.6; if(t>0&&!act&&!(t<SL[s].dep)) c.classList.add("dim"); } else c.classList.add("gone"); });
    SL.forEach(s=>{ if(t>=s.dep&&t<s.arr){ const from=DST[8*s.s+3]; for(let w=0;w<4;w++){ const p=along([from,TC[w]],(t-s.dep)/(s.arr-s.dep)); dots+=tok(p,s.s+1,s.col); } smemBusy=true; }
      if(t>=s.dep&&t<s.arr+0.6) for(let w=0;w<4;w++){ tcBusy[w]=1; issue[w]=(t<s.dep+1)?1:0; } });
    if(t>0) for(let w=0;w<4;w++) regBusy[w]=1;
  }
  schedG.forEach((g,i)=>g&&g.classList.toggle("issue",!!issue[i])); regG.forEach((g,i)=>g&&g.classList.toggle("busy",!!regBusy[i]));
  lsuG.forEach((g,i)=>g&&g.classList.toggle("busy",!!lsuBusy[i])); tcG.forEach((g,i)=>g&&g.classList.toggle("busy",!!tcBusy[i])); smemG&&smemG.classList.toggle("busy",smemBusy);
  $("dots").innerHTML=dots;
  let k_=-1; for(let i=0;i<EV.length;i++){ if(EV[i].t<=t+1e-9) k_=i; else break; }
  const e=k_>=0?EV[k_]:null; algDraw(e);
  const n=$("stepN"); let f="";
  if(!e){ n.textContent=""; card({t:"按播放，或拖动时间"}); } else { n.textContent="第 "+(k_+1)+" 步"; card({t:e.h,c:e.c},{f:e.f,i:e.i,o:e.o,x:e.x});
    (e.ring||[]).forEach(r=>{ const [p,l]=ringPos(r); f+='<circle class="fr" cx="'+p[0]+'" cy="'+p[1]+'" r="'+(r[0]==="smem"?11:7.5)+'"/><text class="fn" x="'+p[0]+'" y="'+(p[1]-(r[0]==="smem"?14:10))+'">'+l+'</text>'; }); }
  $("focus").innerHTML=f;
  $("clipR5").setAttribute("width",(TX(Math.min(t,end))-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(Math.min(t,end)).toFixed(1)+" "+(TY0-4)+"V"+(TY0+6*24)); $("tIn").value=String(t);
}
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0; const SPD=1.3;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*SPD); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(!still); if(still){ t=MODES[mode].tS; show(); } }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? MODES[m0].tS : 0); show(); if(playing) start(); else play.textContent="播放";
</script></body></html>
