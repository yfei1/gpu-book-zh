    E.push({t:ld.t,s:head,ring:{k:"reg",w:0,r:chain?j:0},cd:cd(ins.c.replace(";",""),
      j===0 ? "<code>"+src+"</code>：LDS 读 "+V+"，在 SMEM；地址 i 在 warp 1 的寄存器" : rn(PROGS.chain[j-1].dst)+"已就绪，"+V+"，在 warp 1 的寄存器堆；<code>"+src+"</code>："+V+"，在 SMEM",
      rn(ld.dst)+"："+V+"，"+LAT+" 个周期后经 LSU 写入 warp 1 的寄存器；此前 scoreboard 位为未就绪",
      use,
      j===0 ? "1 条指令；"+rn(ld.dst)+"被占住，数据要 "+LAT+" 个周期后才回来（H200 实测 LDS 延迟 23.06 个周期，模型取 23）" : "1 条指令；这一步又要等 "+LAT+" 个周期")});
    if(j===0 && W>1){ const l2=R.lds.find(x=>x.w===1); E.push({t:l2.t,s:"周期 "+l2.t+"："+(W===2?"warp 2":"warp 2 到 warp "+W)+" 依次各发出 1 条读取，每个 warp 各占 1 个 R4",ring:{k:"slot",w:W-1},
      cd:cd("v = smem[i]（每个 warp 各一条）","每个 warp：<code>smem[i]</code> "+V+"，在 SMEM；共 "+W+" 份","每个 warp 的 v（R4）："+V+"，"+LAT+" 个周期后写入各自的寄存器；共占 "+W+" 个 R4","各 warp 的 v 交给各自第 5 行 acc += v * x","共 "+W+" 条读取、占 "+W+" 个 R4；发射槽每个周期仍只发 1 条")}); }
    if(!chain && j===0){ const o=R.issue.findIndex(x=>x&&x.w===0&&x.i===1);
      E.push({t:o,s:"周期 "+o+"："+(W===1?"R4 还没到，但后面 3 条指令不读 v，warp 1 继续发（周期 1 到 3）":"warp 1 的独立指令被穿插在其它 warp 之间发出，调度器每个周期换下一个 warp"),ring:{k:"slot",w:0},
       cd:cd("a1 += c1;  a2 += c2;  a3 += c3","a1…a3、c1…c3：示意寄存器，在 warp 1 的寄存器堆，不依赖 v","a1…a3 更新，写回 warp 1 的寄存器","这 3 条与读取重叠；之后第 5 行才读 v",(W===1?"3 条独立指令，没有空周期":"每个周期发 1 条指令"))}); }
    const nxt= PR.findIndex((x,i)=>x.dep===ld.dst);
    const useT= R.issue.findIndex((x,c)=>x&&x.w===0&&x.it===0&&x.i===nxt);
    const st0 = (()=>{ for(let c=ld.t+1;c<ld.t+LAT;c++) if(R.state[0][c]===3) return c; return -1; })();
    const rdyT=ld.t+LAT; let waited=0; for(let c=ld.t;c<(useT<0?CYC:useT);c++) if(R.state[0][c]===3) waited++;
    if(st0>=0){ const idle=idleIn(st0,rdyT);
      E.push({t:st0,s:"周期 "+st0+"：warp 1 的下一条要读 "+rn(ld.dst)+"，scoreboard 显示未就绪，warp 1 挂起",ring:{k:"slot",w:0},
       cd:cd("scoreboard["+rn(ld.dst)+"] 未就绪 → warp 1 不可发","要读的 "+rn(ld.dst)+"：还在 SMEM → LSU → 寄存器的路上，约还要 "+(rdyT-st0)+" 个周期","无新数据；warp 1 暂不可发，"+(W===1?"本 SMSP 没有别的 warp，发射槽空着":(idle===0?"调度器换别的 warp 上场":"可发的 warp 不够，发射槽空 "+idle+" 个周期（no eligible）")),
       "数据在周期 "+rdyT+" 回到寄存器后，warp 1 重新可发",
       (W===1?"到数据返回前 "+(rdyT-st0)+" 个周期没有指令发射":(idle===0?"warp 1 暂停 "+(rdyT-st0)+" 个周期，发射槽空 0 个周期":"warp 1 暂停 "+(rdyT-st0)+" 个周期，其中 "+idle+" 个周期没有指令发射")))}); }
    if(rdyT<CYC) E.push({t:rdyT,s:"周期 "+rdyT+"："+rn(ld.dst)+"的数据回到 warp 1 的寄存器，scoreboard 清除",ring:{k:"reg",w:0,r:chain?j:0},
       cd:cd("scoreboard["+rn(ld.dst)+"] ← 就绪（发出周期 "+ld.t+" + "+LAT+" = "+rdyT+"）",V+" 从 SMEM 经 LSU 到达","写入 warp 1 的寄存器堆："+rn(ld.dst)+"，"+V+"；scoreboard 位清除",use,"这次读取共 "+LAT+" 个周期，其中 warp 1 自己挂起 "+waited+" 个周期")});
    if(useT>=0 && !(chain && nxt<3)) E.push({t:useT,s:"周期 "+useT+"：warp 1 发出读 "+rn(ld.dst)+"的 acc += v * x，"+(waited? "它在这条读取上共挂起 "+waited+" 个周期":"数据已在，没有挂起"),ring:{k:"slot",w:0},
       cd:cd("acc += v * x","v（R4）"+V+"，已就绪，在寄存器；x、acc：示意寄存器","acc 更新，写回 warp 1 的寄存器","acc 带进下一轮循环",
         "1 条指令；"+(chain?"从发出 idx 读取到用上 v，一共 "+useT+" 个周期":"这一轮共 5 条指令"))});
  });
  const lds2=R.lds.find(x=>x.w===0&&x.it===1); if(lds2) E.push({t:lds2.t,s:"周期 "+lds2.t+"：warp 1 开始下一轮，再发读取，后面各轮同样重复",ring:{k:"slot",w:0},
       cd:cd("循环：回到第 1 行 "+PR[0].c.replace(";",""),"上一轮的 acc，在 warp 1 的寄存器","新一轮的第 1 条读取发出","本轮读取同样要 "+LAT+" 个周期返回","每轮 "+PR.length+" 条指令，"+(W===1&&!chain?"约每 24 个周期一轮":"本轮不改变上面的周期数"))});
  const tot= chain ? "只有 1 个 warp，3 步读取串成一条链：前 "+CYC+" 个周期发出 "+R.busy+" 条指令，发射槽有 "+R.none+" 个周期空着，读取返回 "+R.ret+" 次，每次查找要 69 个周期（3 × 23.06 = 69.2，H200 实测）"
     : W===1 ? "1 个 warp 每 24 个周期完成 1 轮：前 "+CYC+" 个周期发出 "+R.busy+" 条指令，发射槽空 "+R.none+" 个周期，读取返回 "+R.ret+" 次"
     : W===4 ? "4 个 warp 的 4 × 4 = 16 条指令盖不住 "+LAT+" 个周期。前 "+CYC+" 个周期发出 "+R.busy+" 条指令，发射槽空 "+R.none+" 个周期，读取返回 "+R.ret+" 次，占 4 个 R4"
     : "6 个 warp 的 6 × 4 = 24 条指令盖住 "+LAT+" 个周期。前 "+CYC+" 个周期发出 "+R.busy+" 条指令，发射槽空 "+R.none+" 个周期，读取返回 "+R.ret+" 次，占 6 个 R4";
  E.push({t:CYC-1,s:"总结：前 "+CYC+" 个周期的发射槽",ring:null,
       cd:cd("发射槽忙 = "+R.busy+" / "+CYC+" = "+Math.round(100*R.busy/CYC)+"%；no eligible = "+R.none,"前 "+CYC+" 个周期内 "+W+" 个 warp 的全部指令","发出 "+R.busy+" 条指令；发射槽空 "+R.none+" 个周期；读取返回 "+R.ret+" 次","这个数字与下一种情形（切换模式）对比","总代价（前 "+CYC+" 个周期）："+tot)});
  return E.filter(e=>e.t>=0).sort((a,b)=>a.t-b.t); }
function ring(r){ if(!r) return ""; const p= r.k==="reg"?REGC[r.w][r.r]: r.k==="slot"?SLOTC[r.w]: LSUC; return '<circle class="fr" cx="'+p[0]+'" cy="'+p[1]+'" r="8"/><text class="fn" x="'+p[0]+'" y="'+(p[1]-11)+'">'+(r.w+1)+'</text>'; }
function narrate(){ let k=-1; for(let i=0;i<EV.length;i++){ if(EV[i].t<=t+1e-9) k=i; else break; }
  const n=$("stepN"), s=$("stepT"); if(k<0){ n.textContent=""; s.textContent="按播放，或拖动时间"; $("focus").innerHTML=""; return; }
  n.textContent="第 "+(k+1)+" 步"; s.innerHTML=cardHtml(EV[k]); $("focus").innerHTML=ring(EV[k].ring); }
function drawTop(c){ const chain=PR===PROGS.chain; const n=PR.length; let h="";
  PR.forEach((ins,i)=>{ const y=34+i*22; h+='<line class="ln" x1="8" x2="478" y1="'+(y+8)+'" y2="'+(y+8)+'"/><text class="ann" x="124" y="'+(y+4)+'" text-anchor="end">'+(i+1)+'</text><text class="code" x="132" y="'+(y+4)+'">'+ins.c+'</text><text class="ann" x="262" y="'+(y+4)+'">'+ins.a+'</text>'; });
  for(let w=0;w<W;w++){ const pc=R.pc[w][c]; const blocked=R.state[w][c]===3; const y=34+pc*22; const x=16+w*16;
    h+='<circle cx="'+x+'" cy="'+y+'" r="7" fill="'+COL[w]+'"'+(blocked?' stroke="var(--anatomy-red)" stroke-width="2"':'')+'/><text class="bn" x="'+x+'" y="'+(y+3.5)+'">'+(w+1)+'</text>'; }
  $("prog").innerHTML=h;
  const regs= chain ? [2,3,4] : [4]; const nm={2:"idx",3:"p",4:"v"}; let s="";
  regs.forEach((r,j)=>{ s+='<text class="tn" x="'+(530+j*34)+'" y="32" text-anchor="middle">'+nm[r]+'</text>'; });
  for(let w=0;w<W;w++){ const y=40+w*16; s+='<circle cx="498" cy="'+(y+6)+'" r="6.5" fill="'+COL[w]+'"/><text class="bn" x="498" y="'+(y+9.5)+'">'+(w+1)+'</text>';
    regs.forEach((r,j)=>{ const p=R.pend[w][c][r]; const known=R.pend[w][c][r]!==undefined; s+='<rect x="'+(518+j*34)+'" y="'+y+'" width="24" height="12" '+(p?'fill="url(#hatch)" class="pend"':(known?'fill="'+COL[w]+'"':'fill="none" stroke="var(--anatomy-faint)" stroke-width=".4"'))+'/>'; }); }
  s+='<text class="tn" x="486" y="'+(40+W*16+14)+'">斜线 = 未就绪　实心 = 已就绪</text>';
  $("sb").innerHTML=s; }
function show(){ const c=Math.min(CYC-1,Math.floor(t)); drawTop(c);
  let ovS="",ovR="",ovM="",dots=""; for(let w=0;w<W;w++){ ovS+='<path d="'+SLOT[w]+'" fill="'+COL[w]+'" opacity="'+(R.state[w][c]===3?0.35:1)+'"/>';
    const regs= PR===PROGS.chain?[2,3,4]:[4]; regs.forEach((r,j)=>{ const p=R.pend[w][c][r]; if(p===undefined) return; ovR+='<path d="'+REGD[w][j]+'" fill="'+COL[w]+'"'+(p?' fill-opacity=".35" stroke="var(--anatomy-red)" stroke-width=".9"':'')+'/>'; }); }
  const is=R.issue[c]; let lsuOn=false;
  R.lds.forEach(ld=>{ const u=(t-ld.t)/LAT; const j=PR===PROGS.chain?ld.i:0; if(u>=0&&u<1){ const a=LSUC,b=SMC[ld.w][j],d=REGC[ld.w][j]; let p; if(u<.5){ const f=u*2; p=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]; ovM+='<path d="'+SMD[ld.w][j]+'" fill="'+COL[ld.w]+'" opacity=".55"/>'; } else { const f=u*2-1; p=[b[0]+(d[0]-b[0])*f,b[1]+(d[1]-b[1])*f]; }
      dots+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="6" fill="'+COL[ld.w]+'" stroke="var(--anatomy-card)" stroke-width="1"/><text class="dn" x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.3).toFixed(1)+'">'+(ld.w+1)+'</text>'; } });
  if(is && PR[is.i].k==="ld") lsuOn=true;
  $("ovS").innerHTML=ovS; $("ovR").innerHTML=ovR; $("ovM").innerHTML=ovM; $("dots").innerHTML=dots;
  const lsu=document.querySelector('[data-smsp="0"] [data-part="lsu"]'); if(lsu) lsu.classList.toggle("on",lsuOn);
  const sch=document.querySelector('[data-smsp="0"] [data-part="sched"]'); if(sch) sch.classList.toggle("on",!!is);
  const smem=document.querySelector('[data-part="smem"]'); if(smem) smem.classList.toggle("on",ovM!=="");
  $("clipR").setAttribute("width",(TX(Math.min(t,end))-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(Math.min(t,end)).toFixed(1)+" "+(TY0-4)+"V"+(TY0+7*RH+4)); $("tIn").value=String(t); narrate();
}
const ROWS=[["公式","f"],["输入","i"],["输出","o"],["交给下一步","g"],["代价","c"]];
const cardHtml=(e)=>'<span class="hd">'+e.s+'</span>'+ROWS.map(([a,b])=>'<span class="rw"><i>'+a+'</i><span class="'+(b==="f"?"fm":"tx")+'">'+e.cd[b]+'</span></span>').join("");
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*7); else { hold+=dt; if(hold>2.5){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=end){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(!still); if(still){t=end;show();} }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||4);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? end : 0); show(); if(playing) start(); else play.textContent="播放";
</script></body></html>
