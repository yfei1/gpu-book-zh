  if(k_<0){ n.textContent=""; s.textContent="按播放，或拖动时间"; } else { const e=EV[k_]; c=e.c; n.textContent="第 "+(k_+1)+" 步"; s.textContent=c.h; if(e.f) f='<circle class="fr" cx="'+e.f[0]+'" cy="'+e.f[1]+'" r="'+(e.f[3]||9)+'"/><text class="fn" x="'+e.f[0]+'" y="'+(e.f[1]-(e.f[3]||9)-3)+'">'+e.f[2]+'</text>'; }
  const esc=(x)=>String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"), L=(x)=>x?(Array.isArray(x)?x:[x]):[];
  const io=(x)=>{ const q=x.split("|"); return '<div class="il"><code>'+esc(q.slice(0,2).join("  "))+'</code>'+(q[2]?'<em>'+esc(q[2])+'</em>':'')+'</div>'; };
  const rows=[["公式",L(c&&c.fm).map(x=>'<div><code>'+esc(x)+'</code></div>')],["输入",L(c&&c.i).map(io)],["输出",L(c&&c.o).map(io)],["交给下一步",L(c&&c.nx).map(x=>'<div>'+esc(x)+'</div>')],["代价",L(c&&c.cost).map(x=>'<div>'+esc(x)+'</div>')]];
  $("cr").innerHTML=rows.map(r=>'<div class="rw"><i>'+r[0]+'</i><div>'+(r[1].join("")||"—")+'</div></div>').join("");
  $("focus").innerHTML=f; }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*SPD); else { hold+=dt; if(hold>2){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };

  document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
  const q=new URLSearchParams(location.search); t = q.has("t") ? +q.get("t") : (still ? end*tStill : 0); show(); if(playing) start(); else play.textContent="播放"; }
