<button id="play">暂停</button><label>时间 <input id="tIn" type="range" min="0" max="40" step="0.05" value="0"></label></div><div class="lg"><span><i class="k1"></i>有活的 CTA / 在干活的 SM</span><span><i class="kw"></i>空退出的 CTA / 已完成</span><span><i class="kr"></i>SM 没活，在等别的 SM</span></div><p class="cap">切换模式，看 T = 16,384 下网格里哪些 CTA 有活，各个 SM 什么时候没活。格子的数量、颜色的面积和条的长度是示意，只有读数里的数字是测得的。</p><template id="c1b_0_t">录制 CUDA Graph 时不知道实际命中多少，行分块按最坏情况开</template><template id="c1b_0_f"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>N</mi><mtext>行分块</mtext></msub><mo>=</mo><mo stretchy="false">⌈</mo><mo stretchy="false">(</mo><mn>8</mn><mi>T</mi><mo>+</mo><mn>32</mn><mo>×</mo><mn>127</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>128</mn><mo stretchy="false">⌉</mo><mo>=</mo><mo stretchy="false">⌈</mo><mn>135,136</mn><mi mathvariant="normal">/</mi><mn>128</mn><mo stretchy="false">⌉</mo><mo>=</mo><mn>1,056</mn></mrow><annotation encoding="application/x-tex">N_{\text{行分块}} = \lceil (8T + 32 \times 127) / 128 \rceil = \lceil 135{,}136 / 128 \rceil = 1{,}056</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.109em;">N</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.109em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord cjk_fallback mtight">行分块</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌈(</span><span class="mord">8</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">32</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">127</span><span class="mclose">)</span><span class="mord">/128</span><span class="mclose">⌉</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌈</span><span class="mord">135</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">136/128</span><span class="mclose">⌉</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">1</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">056</span></span></span></span>，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>=</mo><mn>16,384</mn></mrow><annotation encoding="application/x-tex">T = 16{,}384</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">16</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">384</span></span></span></span></template><template id="c1b_0_i">所有词元的 8 个槽位都落在本卡：<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>8</mn><mi>T</mi></mrow><annotation encoding="application/x-tex">8T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord">8</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span> 个命中对，再加每个专家最多 127 行填充；分块高度 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>B</mi><mi>M</mi><mo>=</mo><mn>128</mn></mrow><annotation encoding="application/x-tex">BM = 128</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mord mathnormal" style="margin-right:0.109em;">M</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">128</span></span></span></span></template><template id="c1b_0_o">1,056 个 128 行的行分块（每块再按列切分派给 CTA）</template><template id="c1b_0_x">每个 CTA 进场后查自己的行分块有没有活</template><template id="c1b_0_c">要预先分配一块固定大小的缓冲显存，供 CUDA Graph 每次重放复用</template><template id="c1b_1_t">统计下来，77% 的行分块没有活，对应的 CTA 一进场就直接退出</template><template id="c1b_1_f">每卡平均总有 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>8</mn><mi>T</mi><mi mathvariant="normal">/</mi><mn>8</mn><mo>=</mo><mi>T</mi></mrow><annotation encoding="application/x-tex">8T / 8 = T</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">8</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mord">/8</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span></span></span></span> 个命中对（与路由是否偏斜无关）</template><template id="c1b_1_i">1,056 个行分块</template><template id="c1b_1_o">约 77% 空退出，约 23%（约 243 个行分块）有活（格子按 77% 画，是示意）</template><template id="c1b_1_x">按本卡平均命中对个数（约 T）的 2 倍截断行分块</template><template id="c1b_1_c">空块对应的 CTA 不干活，却占调度</template><template id="c1b_2_t">把主网格截断在 288 个行分块，万一超出上限则交由主 kernel 末尾的循环接管</template><template id="c1b_2_f"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>n</mi><mtext>cap</mtext></msub><mo>=</mo><mo stretchy="false">⌈</mo><mo stretchy="false">(</mo><mn>2</mn><mi>T</mi><mo>+</mo><mn>32</mn><mo>×</mo><mn>127</mn><mo stretchy="false">)</mo><mi mathvariant="normal">/</mi><mn>128</mn><mo stretchy="false">⌉</mo><mo>=</mo><mo stretchy="false">⌈</mo><mn>36,832</mn><mi mathvariant="normal">/</mi><mn>128</mn><mo stretchy="false">⌉</mo><mo>=</mo><mn>288</mn></mrow><annotation encoding="application/x-tex">n_{\text{cap}} = \lceil (2T + 32 \times 127) / 128 \rceil = \lceil 36{,}832 / 128 \rceil = 288</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7167em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal">n</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="katex-sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord mtight">cap</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌈(</span><span class="mord">2</span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">32</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord">127</span><span class="mclose">)</span><span class="mord">/128</span><span class="mclose">⌉</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">⌈</span><span class="mord">36</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">832/128</span><span class="mclose">⌉</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">288</span></span></span></span></template><template id="c1b_2_i">按本卡平均命中对个数（约 T）的 2 倍作偏斜余量，再加每个专家最多 127 行填充</template><template id="c1b_2_o">主网格上限设为 288 个行分块（gemm2 共 288 × 32 = 9,216 个 CTA）；超出上限的分块由 gemm1 与 gemm2 各自的尾部循环处理</template><template id="c1b_2_x">只在 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>&gt;</mo><mn>3,012</mn></mrow><annotation encoding="application/x-tex">T &gt; 3{,}012</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7224em;vertical-align:-0.0391em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">3</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">012</span></span></span></span> 打开</template><template id="c1b_2_c">gemm1 2,905 → 2,831 µs，gemm2 1,406 → 1,376 µs（单层快 1.07%）。测试里没有溢出。“2 倍”是设计选择，没有按实测的最大偏斜标定</template><template id="c2b_0_t">持久 kernel：264 个 CTA（<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>2</mn><mo>×</mo><mn>132</mn></mrow><annotation encoding="application/x-tex">2 \times 132</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">132</span></span></span></span>）按固定步长领分块</template><template id="c2b_0_f">CTA <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi></mrow><annotation encoding="application/x-tex">c</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.4306em;"></span><span class="mord mathnormal">c</span></span></span></span> 领第 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>c</mi><mo separator="true">,</mo><mtext> </mtext><mi>c</mi><mo>+</mo><mn>264</mn><mo separator="true">,</mo><mtext> </mtext><mi>c</mi><mo>+</mo><mn>528</mn><mo separator="true">,</mo><mtext> </mtext><mo>…</mo></mrow><annotation encoding="application/x-tex">c,\ c + 264,\ c + 528,\ \dots</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7778em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">c</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">264</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">c</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">528</span><span class="mpunct">,</span><span class="mspace"> </span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner">…</span></span></span></span> 块</template><template id="c2b_0_i">9,216 个分块（288 个行分块 × 32 个 128 列分块）</template><template id="c2b_0_o">每个 CTA 一串固定的分块</template><template id="c2b_0_x">各分块完成时间参差不齐，固定步长没法把活从慢 SM 挪给快 SM</template><template id="c2b_0_c">kernel 内 SM 空闲 60.3 µs（剖析读数）；挂在后面的归一化 kernel 在 PDL 等待里空等约 118 µs</template><template id="c2b_1_t">改成 9,216 个普通 CTA：硬件块调度器把下一块派给最先空出来的 SM</template><template id="c2b_1_f"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>288</mn><mo>×</mo><mn>32</mn><mo>=</mo><mn>9,216</mn></mrow><annotation encoding="application/x-tex">288 \times 32 = 9{,}216</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">288</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">32</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">9</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">216</span></span></span></span> 个 CTA，一个 CTA 一个分块</template><template id="c2b_1_i">9,216 个分块</template><template id="c2b_1_o">最先空出来的 SM 先拿到下一块</template><template id="c2b_1_x">任务长、数量多时，硬件块调度器就是零屏障的动态领活</template><template id="c2b_1_c">kernel 内 SM 空闲压到 18.6 µs；每个 CTA 都要重新进场，每块的启动开销没有单独测</template><template id="c2b_2_t">总代价：SM 空闲 60.3 → 18.6 µs</template><template id="c2b_2_f"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>60.3</mn><mo>−</mo><mn>18.6</mn><mo>=</mo><mn>41.7</mn><mtext> </mtext><mi>μ</mi><mtext>s</mtext></mrow><annotation encoding="application/x-tex">60.3 - 18.6 = 41.7\ \mu\text{s}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">60.3</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.6444em;"></span><span class="mord">18.6</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">41.7</span><span class="mspace"> </span><span class="mord mathnormal">μ</span><span class="mord text"><span class="mord">s</span></span></span></span></span> 空闲</template><template id="c2b_2_i">同一个 gemm2，<span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>T</mi><mo>=</mo><mn>16,384</mn></mrow><annotation encoding="application/x-tex">T = 16{,}384</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="katex-base"><span class="katex-strut" style="height:0.8389em;vertical-align:-0.1944em;"></span><span class="mord">16</span><span class="mord"><span class="mpunct">,</span></span><span class="mord">384</span></span></span></span></template><template id="c2b_2_o">gemm2 单个 kernel 1,468.96 → 1,443.17 µs，省 25.8 µs（另一次测量）</template><template id="c2b_2_x">kernel 内用原子加动态领活，在这个 kernel 上没有测</template><template id="c2b_2_c">空闲差 41.7 µs 与 kernel 耗时差 25.8 µs 不一致，原因未查明</template></main><script type="module">const CARDS_N={"1b":3,"2b":3};
const PAL={"k1":"#3e63dd","k2":"#d9822b","k3":"#2f9e6b","k4":"#8a5cd0","kr":"#d64545","kw":"#9aa0a6","kd":"#2a2a2e","kl":"#cfd6f5","km":"#8ea2ea"};

const NV=243, NG=1056;   // 23% of 1056 drawn as busy (schematic)
const MODES={};
const bar=(r,a,b,c,l)=>({r,a,b,c,l:l||""});
const TP=(m,i,f)=>document.getElementById("c"+m+"_"+i+"_"+f).innerHTML;
const rect=(x,y,w,h,c,extra)=>'<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+c+'"'+(extra||"")+'/>';
const txt=(x,y,s,cls,a)=>'<text class="'+(cls||"tn")+'" x="'+x+'" y="'+y+'"'+(a?' text-anchor="'+a+'"':"")+'>'+s+'</text>';
// ---- schematic simulation for mode 2 (tile times vary; same 9216 tiles for both ways)
let seed=7; const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
const DUR=Array.from({length:9216},()=>0.5+1.5*Math.pow(rnd(),3));
function simulate(){
  const Fp=new Float64Array(264); DUR.forEach((d,i)=>{ Fp[i%264]+=d; });
  const smP=[...Array(132).keys()].map(s=>Math.max(Fp[2*s],Fp[2*s+1]));
  const Fd=new Float64Array(264); for(let i=0;i<9216;i++){ let j=0; for(let s=1;s<264;s++) if(Fd[s]<Fd[j]) j=s; Fd[j]+=DUR[i]; }
  const smD=[...Array(132).keys()].map(s=>Math.max(Fd[2*s],Fd[2*s+1]));
  const norm=(a)=>{ const m=Math.max(...a); return a.map(v=>10*v/m); };
  return {p:norm(smP),d:norm(smD)}; }
const SIM=simulate();
const TOPY=40;
function gridCells(x0,y0,cols,n,pitch,size,colorOf){ let h=""; for(let i=0;i<n;i++){ const c=i%cols, r=(i-c)/cols; h+=rect(x0+c*pitch,y0+r*pitch,size,size,colorOf(i),' stroke="#9aa0a6" stroke-width=".4"'); } return h; }
function getM(md){
  const key=md+"b";
  const ncard=CARDS_N[key];
  const steps=[]; for(let i=0;i<ncard;i++){ const s={n:String(i+1)}; for(const f of ["f","i","o","x","c"]) s[f]=TP(key,i,f); s.h=TP(key,i,"t"); steps.push(s); }
  if(md===1){ Object.assign(steps[0],{t:0,alg:0,focus:[21,29],r:9}); Object.assign(steps[1],{t:3,alg:1,focus:[46,106],r:9}); Object.assign(steps[2],{t:8,alg:2,focus:[502,124],r:9});
    return {ro:"网格行分块：1,056 → 288（超出上限的分块由主 kernel 尾部循环处理）\n空退出比例：77%\nSM 空闲时间：本模式不涉及（看模式 2）", end:13, tend:13, still:12, tlTitle:"左：改前的行分块；右：改后的行分块。横轴只表示先后，长度示意", axis:[[0,"改前"],[8,"改后"]],
      rows:["有活（约 23%）","空退出（约 77%）","截断后：主网格"],
      bars:[bar(0,0,8,"k1","干活"),bar(1,0,3,"kw","进场即退出"),bar(2,8,13,"k1","干活")], steps,
      init(){ $("algT").textContent="算法：128 行的词元行分块上限（每次重放都用录图时定下的上限）";
        $("algB").innerHTML=ab(0,"最坏：⌈(8T + 32×127)/128⌉")+ab(1,"空退出 77%")+ab(2,"截断 288"); },
      paint(t){ let h=txt(18,18,"原上限：1,056 个行分块（每格一个）","lab2")+txt(300,18,"截断后：288 个行分块","lab2");
        const f=Math.max(0,Math.min(1,(t-3)/2)), nGrey=Math.round((NG-NV)*f);
        h+=gridCells(18,26,33,NG,6.4,5.6,i=> i<NV?PAL.k1:(i-NV<nGrey?PAL.kw:"#fff"));
        const on=t>=8, op=on?1:0.2;
        h+='<g opacity="'+op+'">'+gridCells(300,26,24,288,8.6,7.6,i=>i<NV?PAL.k1:PAL.kw)+'</g>';
        h+=txt(18,246,"（格子数按 77% 画，是示意）","tn"); $("topG").innerHTML=h; } }; }
  if(md===2){ Object.assign(steps[0],{t:0,alg:0,focus:[66,46],r:10}); Object.assign(steps[1],{t:4,alg:1,focus:[366,46],r:10}); Object.assign(steps[2],{t:9.8,alg:2,focus:[291,118],r:40});
    const order=(a)=>a.map((v,i)=>[v,i]).sort((x,y)=>x[0]-y[0]);
    return {ro:"网格 CTA：264（持久）→ 9,216（普通）\n空退出比例：不涉及\nSM 空闲时间：60.3 → 18.6 µs（剖析读数）", end:10, tend:10, still:9.8, curH:200, steps,
      init(){ $("algT").textContent="算法：下投影 gemm2 有 288 × 32 = 9,216 个分块（4,096 列），分块完成时间参差不齐";
        $("algB").innerHTML=ab(0,"持久：264 个 CTA，固定步长")+ab(1,"普通：9,216 个 CTA，硬件派发")+ab(2,"SM 空闲 60.3 → 18.6 µs"); },
      flat(){ const f=$("flat"), H=TY0+200+34; f.setAttribute("viewBox","0 0 640 "+H);
        let h='<text class="lab2" x="'+TL0+'" y="'+(TY0-10)+'">横轴只表示先后，红色宽度是示意（132 个 SM 按结束先后排）</text>';
        const lbl=(y0,title)=>txt(TL0-8,y0+44,title[0],"rl")+txt(TL0-8,y0+58,title[1],"rl")+'<rect class="row" x="'+TL0+'" y="'+y0+'" width="'+(TL1-TL0)+'" height="92"/>';
        const panel=(y0,title,fin)=>{ let g="";
          order(fin).forEach(([v,i],r)=>{ const y=y0+1+r*(90/132), hh=0.78; g+=rect(TL0,y,TX(v)-TL0,hh,PAL.k1)+rect(TX(v),y,TX(10)-TX(v),hh,PAL.kr); }); return g; };
        h+=lbl(TY0,["持久 kernel","264 个 CTA"])+lbl(TY0+108,["普通 CTA","9,216 个"]);
        h+='<clipPath id="clipT"><rect id="clipR" x="'+TL0+'" y="'+(TY0-4)+'" width="0" height="210"/></clipPath><g clip-path="url(#clipT)">'+panel(TY0,["持久 kernel","264 个 CTA"],SIM.p)+panel(TY0+108,["普通 CTA","9,216 个"],SIM.d)+'</g><path id="cur" class="cur" d=""/>';
        f.innerHTML=h; },
      paint(t){ let h=txt(18,18,"持久 kernel：264 个 CTA（每 SM 2 个）","lab2")+txt(318,18,"9,216 个普通 CTA，硬件派发","lab2");
        const m=(x0,fin)=>{ let g=""; for(let s=0;s<132;s++){ const c=s%12, r=(s-c)/12; const col=t>=9.97?PAL.kw:(t<fin[s]?PAL.k1:PAL.kr); g+=rect(x0+c*13.5,TOPY+r*13.5,12,12,col,' stroke="#9aa0a6" stroke-width=".4"'); } return g; };
        h+=m(60,SIM.p)+m(360,SIM.d)+txt(291,110,"SM 空闲","tn","middle")+txt(291,126,"60.3 → 18.6 µs","tn","middle"); h+=txt(60,TOPY+158,"每格一个 SM，共 132 个；蓝 = 在干活，红 = 已经没活","tn")+txt(360,TOPY+158,"红色的 SM 在等别的 SM 收尾","tn");
        $("topG").innerHTML=h; } }; }
}
const AB=[[18,30,200,22],[230,30,200,22],[442,30,180,22]];
const ALGBOX=(i)=>AB[i];
const ab=(i,s)=>'<rect class="ac" x="'+AB[i][0]+'" y="'+AB[i][1]+'" width="'+AB[i][2]+'" height="'+AB[i][3]+'" rx="3" style="fill:#e5e7eb"/>'+'<text class="an d" x="'+(AB[i][0]+AB[i][2]/2)+'" y="'+(AB[i][1]+15)+'">'+s+'</text>';
const SPEED=2.4;


const $=(id)=>document.getElementById(id), readout=document.querySelector("[data-readout]");
const esc_=(s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const NS_="http://www.w3.org/2000/svg";
const chipSvg=(p,n,c)=>'<circle class="mvc" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="6.2" fill="'+PAL[c]+'"/><text class="mvt" x="'+p[0].toFixed(1)+'" y="'+(p[1]+3).toFixed(1)+'">'+n+'</text>';
function along(pts,u){ const segs=[]; let Lt=0; for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]); segs.push(d); Lt+=d;} let s=Math.max(0,Math.min(1,u))*Lt; for(let i=0;i<segs.length;i++){ if(s<=segs[i]){const f=segs[i]?s/segs[i]:0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f];} s-=segs[i];} return pts[pts.length-1]; }
const prog=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const pd=(pts)=>"M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L");
const TL0=132,TL1=620,TY0=26,RH=24;
let mode=1,M=null,end=1,tend=1,t=0;
const AXMAP=(v)=>{ const m=M.map; if(!m) return v; if(v<=m[0][0]) return m[0][1]; for(let i=1;i<m.length;i++){ if(v<=m[i][0]){ const f=(v-m[i-1][0])/(m[i][0]-m[i-1][0]||1); return m[i-1][1]+(m[i][1]-m[i-1][1])*f; } } return m[m.length-1][1]; };
const TX=(v)=>TL0+(TL1-TL0)*v/end;
function drawFlat(){
  const n=M.rows.length, H=TY0+n*RH+(M.axis?22:8), f=$("flat"); f.setAttribute("viewBox","0 0 640 "+H);
  let h='<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" class="hl"/></pattern></defs>';
  h+='<text class="lab2" x="'+TL0+'" y="'+(TY0-10)+'">'+esc_(M.tlTitle)+'</text>';
  M.rows.forEach((r,i)=>{ h+='<text class="rl" x="'+(TL0-8)+'" y="'+(TY0+i*RH+13)+'">'+esc_(r)+'</text><rect class="row" x="'+TL0+'" y="'+(TY0+i*RH)+'" width="'+(TL1-TL0)+'" height="18"/>'; });
  if(M.axis) M.axis.forEach(a=>{ h+='<path class="axl" d="M'+TX(a[0]).toFixed(1)+' '+(TY0-2)+'V'+(TY0+n*RH-4)+'"/><text class="ax" x="'+TX(a[0]).toFixed(1)+'" y="'+(TY0+n*RH+10)+'">'+esc_(a[1])+'</text>'; });
  h+='<clipPath id="clipT"><rect id="clipR" x="'+TL0+'" y="'+(TY0-4)+'" width="0" height="'+(n*RH+8)+'"/></clipPath><g clip-path="url(#clipT)">';
  M.bars.forEach(b=>{ const y=TY0+b.r*RH, x0=TX(b.a), w=b.b>b.a?TX(b.b)-x0:2.2;
    h+='<rect class="bar b-'+b.c+'" x="'+x0.toFixed(1)+'" y="'+(y+2)+'" width="'+w.toFixed(1)+'" height="14"/>';
    if(b.l&&w>=18) h+='<text class="bt'+(b.d?" d":"")+'" x="'+(x0+w/2).toFixed(1)+'" y="'+(y+12.5)+'">'+esc_(b.l)+'</text>'; });
  h+='</g><path id="cur" class="cur" d=""/>';
  f.innerHTML=h; }
function splitCard(a){ document.getElementById("stepT").innerHTML=a.h||"";
  const K=$("stepK"); if(!a.f){ K.innerHTML=""; return; }
  K.innerHTML=[["公式",a.f],["输入",a.i],["输出",a.o],["交给下一步",a.x],["代价",a.c]].map(r=>"<div><dt>"+r[0]+"</dt><dd>"+r[1]+"</dd></div>").join(""); }
function narrate(){ const S=M.steps; let k=-1; for(let i=0;i<S.length;i++){ if(S[i].t<=t+1e-9) k=i; else break; }
  const n=$("stepN");
  if(k<0){ n.textContent=""; splitCard({h:"按播放，或拖动时间"}); $("focus").innerHTML=""; $("algO").innerHTML=""; return; }
  n.textContent="第 "+(k+1)+" 步"; const s=S[k]; splitCard(s);
  $("focus").innerHTML = s.focus ? '<circle class="fr" cx="'+s.focus[0].toFixed(1)+'" cy="'+s.focus[1].toFixed(1)+'" r="'+(s.r||7.5)+'"/><text class="fn" x="'+s.focus[0].toFixed(1)+'" y="'+(s.focus[1]-(s.r||7.5)-3.5).toFixed(1)+'">'+esc_(s.n||String(k+1))+'</text>' : "";
  if(s.alg!=null){ const b=ALGBOX(s.alg); $("algO").innerHTML='<rect class="ao" x="'+(b[0]-1.5)+'" y="'+(b[1]-1.5)+'" width="'+(b[2]+3)+'" height="'+(b[3]+3)+'" rx="3"/>'; } else $("algO").innerHTML=""; }
function show(){ const e=AXMAP(Math.min(t,tend));
  $("clipR").setAttribute("width",Math.max(0,TX(e)-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(e).toFixed(1)+" "+(TY0-4)+"V"+(TY0+(M.curH||M.rows.length*RH))); $("tIn").value=String(t);
  if(M.paint) M.paint(t); else paint(t); narrate(); }
function setMode(md){ mode=md; M=getM(md); end=M.end; tend=M.tend||M.end; $("tIn").max=String(tend); if(M.flat) M.flat(); else drawFlat(); readout.textContent=M.ro; t=Math.min(t,tend); if(M.init) M.init(); }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<tend) t=Math.min(tend,t+dt*(typeof SPEED!=="undefined"?SPEED:2.5)); else { hold+=dt; if(hold>3){hold=0;t=0;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(p)=>{ playing=p; play.textContent=p?"暂停":"播放"; if(p){ if(t>=tend){t=0;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=0; hold=0; setPlay(true); }));
const q=new URLSearchParams(location.search); const m0=+(q.get("mode")||q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? M.still : 0); show(); if(playing) start(); else play.textContent="播放";
</script></body></html>
