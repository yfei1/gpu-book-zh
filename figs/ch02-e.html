    f:"派发：最后一个空出的 SM ← B 块 131",i:"最后一个退出 A CTA 的 SM；队列里的块 131",o:"132 个 B CTA 都已驻留；A 阶段全部结束，inter 写完",x:"每个块开始自己的第一个 B 单元"});
  E.push({t:p.lo,b:0,at:"tile",s:"编号小于 100 的块到达第一个 B 单元，距最后一个 A 结束 "+f1(p.lo)+" µs。代价：这是 B 阶段的基准起步时间；B 单元周期约 1.05 µs",
    f:"y[tok, n] = Σₖ inter[tok, k] · W2[e][n, k]，W2 = E2M1 码 × w2_sf × w2_gs",
    i:"inter [M_e, 4096]，在全局内存（经 L2）；W2[e] uint8 [4096, 2048] 和 w2_sf FP8 [4096, 256]，在 HBM，每专家共 9.4 MB，本块只读自己负责的部分",
    o:"y 里本块负责的那部分，形状属于 [M_e, 4096]，写进全局内存",x:"所有块的 y 交给后面的 post-norm"});
  E.push({t:p.hi,b:131,at:"tile",s:"131 号块到达第一个 B 单元，距最后一个 A 结束 "+f1(p.hi)+" µs，比编号小于 100 的块晚 "+p.gap+" µs。代价：晚的时间约等于 "+(+p.gap/1.05).toFixed(1)+" 个 B 单元周期（"+p.gap+" ÷ 1.05）",
    f:"y[tok, n] = Σₖ inter[tok, k] · W2[e][n, k]（同上，只是 131 号块更晚开始）",
    i:"inter [M_e, 4096]，全局内存；W2[e] 的本块部分，在 HBM",o:"y 里 131 号块负责的部分",x:"与其他块的 y 一起交给 post-norm"});
  E.push({t:p.hi+0.5,b:131,at:"tile",s:"总代价：等量分配 B 单元时，131 号块比编号小于 100 的块晚 "+p.gap+" µs 起步，在 "+p.pct+"% 的随机样本里是最慢的 B CTA。新的分配让编号 ≥ 100 的块少分 B 单元，平均 "+p.gain,
    f:"T_B = 最慢 B CTA 的结束时刻",i:"132 个 B CTA 各自写出的 y 部分",o:"y [M_e, 4096] 全部写完",x:"post-norm：逐专家 RMSNorm，再按 topk_weights 求和，得 out BF16 [M, 4096]"});
  return E; }
function setMode(m){ mode=m; p=M[m]; end=p.hi+0.6;
  readout.textContent=p.n+"：编号小于 100 的块 "+f1(p.lo)+" µs 到第一个 B 单元，131 号块 "+f1(p.hi)+" µs，晚 "+p.gap+" µs\n131 号块是最慢 B CTA 的随机样本占 "+p.pct+"%；新的分配让编号大的块少分，平均 "+p.gain;
  let h=""; const ty=(b)=>TY0+b*LP;
  for(let b=0;b<132;b++){ const g=grp(b), e=entry(b), f=first(b);
    h+='<rect x="'+TX(TMIN).toFixed(1)+'" y="'+ty(b).toFixed(2)+'" width="'+(TX(e)-TX(TMIN)).toFixed(1)+'" height="'+(LP*0.9).toFixed(2)+'" fill="#2a2a2e" fill-opacity=".8"/>';
    h+='<rect x="'+TX(e).toFixed(1)+'" y="'+ty(b).toFixed(2)+'" width="'+(TX(f)-TX(e)).toFixed(1)+'" height="'+(LP*0.9).toFixed(2)+'" fill="'+COL[g]+'" fill-opacity=".38"/>';
    h+='<rect x="'+TX(f).toFixed(1)+'" y="'+ty(b).toFixed(2)+'" width="'+(TX(TMAX)-TX(f)).toFixed(1)+'" height="'+(LP*0.9).toFixed(2)+'" fill="'+COL[g]+'"/>'; }
  $("tl").innerHTML=h;
  let ax=""; for(let u=TMIN;u<=TMAX;u+=2) ax+='<path d="M'+TX(u).toFixed(1)+' '+(TY0+105.60000000000001)+'v4" stroke="var(--anatomy-lo)"/><text class="tn" x="'+TX(u).toFixed(1)+'" y="'+(TY0+105.60000000000001+16)+'" text-anchor="middle">'+u+'</text>';
  ax+='<text class="tn" x="'+TL1+'" y="'+(TY0+105.60000000000001+32)+'" text-anchor="end">时间（µs）；0 = 最后一个 A CTA 结束</text>'; $("ax").innerHTML=ax;
  $("marks").innerHTML='<path class="z0" d="M'+TX(0).toFixed(1)+' '+(TY0-3)+'V'+(TY0+105.60000000000001)+'"/><path class="zm" d="M'+TX(p.lo).toFixed(1)+' '+(TY0-3)+'V'+(TY0+105.60000000000001)+'M'+TX(p.hi).toFixed(1)+' '+(TY0-3)+'V'+(TY0+105.60000000000001)+'"/>'
    +'<text class="tn" x="'+TX(0).toFixed(1)+'" y="'+(TY0-6)+'" text-anchor="end">最后一个 A 结束</text><text class="tn" x="'+TX(p.lo).toFixed(1)+'" y="'+(TY0-6)+'" text-anchor="'+(p.hi-p.lo>1.2?"end":"middle")+'">+'+f1(p.lo)+'</text><text class="tn" x="'+TX(p.hi).toFixed(1)+'" y="'+(TY0-6)+'" text-anchor="start">+'+f1(p.hi)+'</text>';
  $("tIn").min=String(TMIN); $("tIn").max=String(end); t=Math.max(TMIN,Math.min(t,end)); EV=events(); }
function show(){ let dots="", cells="";
  for(let b=0;b<132;b++){ const g=grp(b), e=entry(b), f=first(b), tl=tiles[b];
    const st = t>=f ? 2 : t>=e ? 1 : 0;
    tl.setAttribute("class", st===0 ? "busy" : (st===1 ? "e" : "f")+g);
    if(t>=e-0.35 && t<e){ const u=(t-(e-0.35))/0.35, a=QC, c=TC[b]; dots+='<circle class="dot" cx="'+(a[0]+(c[0]-a[0])*u).toFixed(1)+'" cy="'+(a[1]+(c[1]-a[1])*u).toFixed(1)+'" r="3" fill="'+COL[g]+'"/>'; }
    cells+='<rect x="'+(SX0+b*CW).toFixed(2)+'" y="'+SY+'" width="'+(CW-0.5).toFixed(2)+'" height="16" fill="'+(st===0?"#9a9aa3":COL[g])+'" fill-opacity="'+(st===1?".38":"1")+'"/>'; }
  $("dots").innerHTML=dots; $("cells").innerHTML=cells;
  $("clipR").setAttribute("width",(TX(Math.min(t,end))-TL0+1).toFixed(1)); $("cur").setAttribute("d","M"+TX(Math.min(t,end)).toFixed(1)+" "+(TY0-3)+"V"+(TY0+105.60000000000001)); $("tIn").value=String(t);
  let k_=-1; for(let i=0;i<EV.length;i++){ if(EV[i].t<=t+1e-9) k_=i; else break; }
  const n=$("stepN"); let f="", ao="", to="";
  if(k_<0){ n.textContent=""; card({t:"按播放，或拖动时间"}); } else { const e=EV[k_]; n.textContent="第 "+(k_+1)+" 步"; card(splitCost(e.s),{f:e.f,i:e.i,o:e.o,x:e.x});
    if(e.b!=null){ const c=TC[e.b]; f='<circle class="fr" cx="'+c[0]+'" cy="'+c[1]+'" r="8"/><circle class="rb" cx="'+(c[0]-8)+'" cy="'+(c[1]-8)+'" r="8"/><text class="rn" x="'+(c[0]-8)+'" y="'+(c[1]-4.5)+'">'+e.b+'</text>';
      ao='<rect class="ao" x="'+(SX0+e.b*CW-1.5).toFixed(2)+'" y="'+(SY-2)+'" width="'+(CW+2.5).toFixed(2)+'" height="20"/>';
      const y=TY0+e.b*LP+LP/2; to='<circle class="fr" cx="'+(TL0-3)+'" cy="'+y.toFixed(1)+'" r="2.5"/><circle class="rb" cx="'+(TL0-14)+'" cy="'+y.toFixed(1)+'" r="8"/><text class="rn" x="'+(TL0-14)+'" y="'+(y+3.6).toFixed(1)+'" style="font-size:9px">'+e.b+'</text>'; } }
  $("focus").innerHTML=f; $("algO").innerHTML=ao; $("tlO").innerHTML=to; }
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing=!still, last=0, hold=0, raf=0;
function loop(now){ const dt=last?Math.min((now-last)/1000,0.05):0; last=now; if(playing){ if(t<end) t=Math.min(end,t+dt*3); else { hold+=dt; if(hold>2){hold=0;t=TMIN;} } } show(); raf=playing?requestAnimationFrame(loop):0; }
const start=()=>{ if(!raf){ last=0; raf=requestAnimationFrame(loop);} };
const play=$("play"); const setPlay=(pl)=>{ playing=pl; play.textContent=pl?"暂停":"播放"; if(pl){ if(t>=end){t=TMIN;hold=0;} start(); } else show(); };
play.addEventListener("click",()=>setPlay(!playing));
$("tIn").addEventListener("input",()=>{ const v_=+$("tIn").value; setPlay(false); t=v_; show(); });
document.querySelectorAll("input[name=mode]").forEach(r=>r.addEventListener("change",()=>{ setMode(+r.value); t=TMIN; hold=0; setPlay(!still); if(still){t=end;show();} }));
const q=new URLSearchParams(location.search); const m0=+(q.get("m")||1);
document.querySelector("input[name=mode][value='"+m0+"']").checked=true; setMode(m0);
t = q.has("t") ? +q.get("t") : (still ? end : TMIN); show(); if(playing) start(); else play.textContent="播放";
</script></body></html>
